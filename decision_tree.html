<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Tree Analysis Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Sans','Meiryo',sans-serif;
     background:#f4f6f9;color:#1a2332;font-size:14px;line-height:1.6}
header{background:#233A9A;color:#fff;padding:14px 24px;
       display:flex;align-items:center;gap:12px}
header h1{font-size:17px;font-weight:600}
header .badge{background:#F28018;color:#1a2332;font-size:11px;
              padding:2px 8px;border-radius:10px;font-weight:700}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.card{background:#fff;border-radius:8px;border:1px solid #e0e4ea;
      padding:20px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:700;color:#1a2332;margin-bottom:14px;
         padding-bottom:8px;border-bottom:2px solid #e05c2a;display:inline-block}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
label{display:block;font-size:12px;font-weight:600;color:#555;
      margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
select,input[type=number]{width:100%;padding:7px 10px;border:1px solid #d0d5dd;
  border-radius:6px;font-size:13px;color:#1a2332;background:#fff;outline:none}
select:focus,input:focus{border-color:#1a2332;box-shadow:0 0 0 2px rgba(26,35,50,.12)}
textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:6px;
         font-size:12px;font-family:monospace;resize:vertical;outline:none}
textarea:focus{border-color:#1a2332;box-shadow:0 0 0 2px rgba(26,35,50,.12)}
.btn-primary{background:#1a2332;color:#fff;border:none;padding:9px 22px;
             border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:#2d3d52}
.btn-secondary{background:#fff;color:#1a2332;border:1px solid #d0d5dd;
               padding:7px 16px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-secondary:hover{border-color:#1a2332}
.btn-dl{background:#0e7c5a;color:#fff;border:none;padding:7px 16px;
        border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.err{color:#c0392b;font-size:12px;padding:8px 12px;background:#fdf0ee;
     border:1px solid #f5c6c0;border-radius:6px;margin-top:8px;display:none}
.note{font-size:11px;color:#777;margin-top:6px;line-height:1.6}
.info{font-size:12px;color:#185FA5;padding:8px 12px;background:#e8f0fd;
      border:1px solid #c5d8f9;border-radius:6px;margin:8px 0}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1a2332;color:#fff;padding:7px 10px;text-align:center;
   font-weight:600;font-size:12px;white-space:nowrap}
th.left{text-align:left}
td{padding:6px 10px;border-bottom:1px solid #edf0f4;text-align:center}
td.left{text-align:left}
tr:nth-child(even) td{background:#f8fafc}
.stat-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.stat{text-align:center}
.stat-val{font-size:22px;font-weight:700;color:#185FA5}
.stat-lbl{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.4px}
.tabs{display:flex;gap:0;border-bottom:2px solid #e0e4ea;margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;
     color:#777;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#1a2332;border-bottom-color:#e05c2a}
.panel{display:none}.panel.active{display:block}
/* ツリー図 */
#tree-svg-wrap{overflow:auto;border:1px solid #e0e4ea;border-radius:6px;
               background:#fafafa;padding:10px;min-height:200px}
.node-box{rx:6;ry:6}
/* 重要度バー */
.imp-bar-wrap{height:18px;background:#edf0f4;border-radius:4px;overflow:hidden}
.imp-bar{height:100%;background:#185FA5;border-radius:4px;transition:width .3s}

.langsw{margin-left:auto;display:flex;gap:4px}
.langsw button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;
  padding:3px 10px;font-size:12px;cursor:pointer}
.langsw button.on{background:#fff;color:#233A9A;font-weight:700}
.foot{max-width:1100px;margin:0 auto;padding:0 16px 28px;font-size:11px;color:#777}
</style>
<script data-goatcounter="https://yuki-toyoda.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <h1 data-i="h1"></h1>
  <span class="badge">Decision Tree</span>
  <div class="langsw"><button type="button" data-lang="ja" onclick="setLang('ja')">日本語</button><button type="button" data-lang="en" onclick="setLang('en')">English</button></div>
</header>
<div style="background:#F28018;border-bottom:0;padding:10px 24px;margin-bottom:20px;font-size:12px;color:#1a2332;font-weight:700;line-height:1.6">
  <span data-i="disc1"></span><br><span data-i="disc2"></span>
</div>
<div class="container">

<!-- data input -->
<div class="card">
  <h2 data-i="cardData"></h2>
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn-secondary" onclick="loadExample(1)" data-i="ex1"></button>
    <button class="btn-secondary" onclick="loadExample(2)" data-i="ex2"></button>
    <button class="btn-secondary" onclick="loadExample(3)" data-i="ex3"></button>
    <label class="btn-secondary" style="cursor:pointer;display:inline-flex;align-items:center">
      <span data-i="openCsv"></span>
      <input type="file" accept=".csv,.txt" style="display:none" onchange="loadCSVFile(event)">
    </label>
  </div>
  <label data-i="csvLabel"></label>
  <textarea id="csv-input" rows="10" data-ip="csvPh"></textarea>
  <div id="err-msg" class="err"></div>
</div>

<!-- settings -->
<div class="card">
  <h2 data-i="cardSet"></h2>
  <div class="row">
    <div>
      <label data-i="lblTask"></label>
      <select id="task-type">
        <option value="auto" data-i="optAuto"></option>
        <option value="classification" data-i="optClf"></option>
        <option value="regression" data-i="optReg"></option>
      </select>
    </div>
    <div>
      <label data-i="lblDepth"></label>
      <input type="number" id="max-depth" value="4" min="1" max="10">
    </div>
    <div>
      <label data-i="lblSplit"></label>
      <input type="number" id="min-split" value="2" min="1" max="50">
    </div>
    <div>
      <label data-i="lblLeaf"></label>
      <input type="number" id="min-leaf" value="1" min="1" max="50">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-primary" onclick="runTree()" data-i="run"></button>
  </div>
</div>

<!-- results -->
<div class="card" id="result-card" style="display:none">
  <h2 data-i="cardResult"></h2>
  <div id="result-info" class="info" style="margin-bottom:12px"></div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('tree')" data-i="tabTree"></div>
    <div class="tab" onclick="switchTab('importance')" data-i="tabImp"></div>
    <div class="tab" onclick="switchTab('predict')" data-i="tabPred"></div>
    <div class="tab" onclick="switchTab('rules')" data-i="tabRules"></div>
  </div>

  <div class="panel active" id="tab-tree">
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
      <div class="note" data-i="scrollNote"></div>
      <label style="font-size:12px;color:#555;font-weight:600;text-transform:none;letter-spacing:0">
        <span data-i="lblNodeW"></span>
        <select id="node-width" onchange="drawTree()" style="font-size:12px;padding:3px 8px;border:1px solid #ddd;border-radius:4px;width:auto">
          <option value="120" data-i="nw120"></option>
          <option value="160" data-i="nw160"></option>
          <option value="200" selected data-i="nw200"></option>
          <option value="260" data-i="nw260"></option>
        </select>
      </label>
      <label style="font-size:12px;color:#555;font-weight:600;text-transform:none;letter-spacing:0">
        <span data-i="lblVGap"></span>
        <select id="v-gap" onchange="drawTree()" style="font-size:12px;padding:3px 8px;border:1px solid #ddd;border-radius:4px;width:auto">
          <option value="30" data-i="vg30"></option>
          <option value="50" selected data-i="vg50"></option>
          <option value="80" data-i="vg80"></option>
        </select>
      </label>
      <label style="font-size:12px;color:#555;font-weight:600;text-transform:none;letter-spacing:0">
        <span data-i="lblFont"></span>
        <select id="font-size" onchange="drawTree()" style="font-size:12px;padding:3px 8px;border:1px solid #ddd;border-radius:4px;width:auto">
          <option value="9" data-i="fs9"></option>
          <option value="11" selected data-i="fs11"></option>
          <option value="13" data-i="fs13"></option>
        </select>
      </label>
      <label style="font-size:12px;color:#555;font-weight:600;text-transform:none;letter-spacing:0">
        <span data-i="lblZoom"></span>
        <select id="tree-zoom" onchange="applyZoom()" style="font-size:12px;padding:3px 8px;border:1px solid #ddd;border-radius:4px;width:auto">
          <option value="0.1">10%</option>
          <option value="0.2">20%</option>
          <option value="0.3">30%</option>
          <option value="0.4">40%</option>
          <option value="0.5">50%</option>
          <option value="0.6">60%</option>
          <option value="0.7">70%</option>
          <option value="0.8">80%</option>
          <option value="0.9">90%</option>
          <option value="1.0" selected>100%</option>
          <option value="1.1">110%</option>
          <option value="1.2">120%</option>
          <option value="1.3">130%</option>
          <option value="1.4">140%</option>
          <option value="1.5">150%</option>
          <option value="1.6">160%</option>
          <option value="1.7">170%</option>
          <option value="1.8">180%</option>
          <option value="1.9">190%</option>
          <option value="2.0">200%</option>
        </select>
      </label>
    </div>
    <div id="tree-svg-wrap"></div>
  </div>

  <div class="panel" id="tab-importance">
    <div id="importance-wrap"></div>
  </div>

  <div class="panel" id="tab-predict">
    <div class="btn-row" style="margin-bottom:10px">
      <button class="btn-dl" onclick="downloadPredictions()" data-i="dlPred"></button>
    </div>
    <div id="predict-wrap"></div>
  </div>

  <div class="panel" id="tab-rules">
    <div id="rules-wrap"></div>
  </div>
</div>

<!-- glossary -->
<div class="card">
  <h2 data-i="cardGloss"></h2>
  <div class="tbl-wrap"><table>
    <thead><tr><th class="left" data-i="thTerm"></th><th class="left" data-i="thDesc"></th></tr></thead>
    <tbody id="gloss-body"></tbody>
  </table></div>
</div>

</div>
<!-- ===== R script (check) ===== -->
<div id="rscript-wrap" style="max-width:1100px;margin:0 auto;padding:0 16px 24px">
  <div style="background:#fff;border:1px solid #d0d5dd;border-radius:10px;padding:16px 18px">
    <div style="font-weight:700;font-size:15px;margin-bottom:6px" data-i="rsTitle"></div>
    <div style="font-size:12px;color:#555;line-height:1.7;margin-bottom:10px" data-i="rsDesc"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button type="button" onclick="rsMake()" data-i="rsMake" style="padding:8px 14px;border:none;border-radius:6px;background:#1a2332;color:#fff;font-size:13px;font-weight:600;cursor:pointer"></button>
      <button type="button" id="rs-copy-btn" onclick="rsCopy()" data-i="rsCopy" style="padding:8px 14px;border:1px solid #d0d5dd;border-radius:6px;background:#fff;color:#1a2332;font-size:13px;cursor:pointer"></button>
      <button type="button" onclick="rsDownload()" data-i="rsSave" style="padding:8px 14px;border:1px solid #d0d5dd;border-radius:6px;background:#fff;color:#1a2332;font-size:13px;cursor:pointer"></button>
    </div>
    <textarea id="rs-text" readonly spellcheck="false" data-ip="rsPh" style="width:100%;height:300px;box-sizing:border-box;font-family:Consolas,Menlo,monospace;font-size:12px;line-height:1.5;padding:10px;border:1px solid #d0d5dd;border-radius:6px;background:#fafbfc;white-space:pre;overflow:auto"></textarea>
  </div>
</div>
<div class="foot" data-i="foot"></div>

<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}

// ─── グローバル ───
let G = {
  features: [], target: '', rows: [],
  tree: null, task: 'classification',
  predictions: [], importance: {}
};

// ─── タブ ───
function switchTab(name){
  const names=['tree','importance','predict','rules'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',names[i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

let ERR_I=null;   // [key,...args] of the message currently shown (re-translated on language change)
function showErr(m,ik){const e=document.getElementById('err-msg');e.textContent=m;e.style.display='block';ERR_I=ik||null;}
function clearErr(){document.getElementById('err-msg').style.display='none';ERR_I=null;}
function terr(){const a=Array.prototype.slice.call(arguments);const e=new Error(t.apply(null,a));e.ik=a;return e;}
let HAS_RESULT=false, LAST={accuracy:null,rmse:null};

// ─── CSV ───
function loadCSVFile(e){
  const file=e.target.files[0]; if(!file) return;
  const tryRead=enc=>{
    const r=new FileReader();
    r.onload=ev=>{
      let t=ev.target.result.replace(/^\uFEFF/,'');
      if(enc==='UTF-8'&&(t.match(/\uFFFD/g)||[]).length>3){tryRead('Shift-JIS');return;}
      document.getElementById('csv-input').value=t;
    };
    r.readAsText(file,enc);
  };
  tryRead('UTF-8'); e.target.value='';
}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<3) throw terr('errRows3');
  const sep=lines[0].includes('\t')?'\t':',';
  const headers=lines[0].split(sep).map(h=>h.trim());
  if(headers.length<2) throw terr('errCols2');
  const features=headers.slice(0,-1);
  const target=headers[headers.length-1];
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const vals=lines[i].split(sep).map(v=>v.trim());
    if(vals.length!==headers.length) throw terr('errColMis',i+1);
    const row={};
    features.forEach((f,j)=>{
      const n=+vals[j];
      row[f]=isNaN(n)?vals[j]:n;
    });
    const ty=+vals[vals.length-1];
    row[target]=isNaN(ty)?vals[vals.length-1]:ty;
    rows.push(row);
  }
  return {features, target, rows};
}

// ─── 決定木アルゴリズム ───
function gini(groups, classes){
  const total=groups.reduce((s,g)=>s+g.length,0);
  let score=0;
  for(const g of groups){
    if(!g.length) continue;
    let p=0;
    for(const c of classes){
      const cnt=g.filter(r=>r._y===c).length/g.length;
      p+=cnt*cnt;
    }
    score+=(1-p)*(g.length/total);
  }
  return score;
}

function mse(group){
  if(!group.length) return 0;
  const mean=group.reduce((s,r)=>s+r._y,0)/group.length;
  return group.reduce((s,r)=>s+(r._y-mean)**2,0)/group.length;
}

function splitScore(left, right, task, classes){
  if(task==='classification') return gini([left,right],classes);
  const n=left.length+right.length;
  return (mse(left)*left.length+mse(right)*right.length)/n;
}

function bestSplit(rows, features, task, classes, minLeaf){
  let bestScore=Infinity, bestFeat=null, bestVal=null, bestLeft=[], bestRight=[];
  const consider=(feat,val,left,right)=>{
    if(!left.length||!right.length) return;
    if(left.length<(minLeaf||1)||right.length<(minLeaf||1)) return;  // 葉の最小サンプル数を満たす分割だけを候補にする
    const score=splitScore(left,right,task,classes);
    if(score<bestScore){
      bestScore=score; bestFeat=feat; bestVal=val;
      bestLeft=left; bestRight=right;
    }
  };
  for(const feat of features){
    const vals=[...new Set(rows.map(r=>r[feat]))].sort((a,b)=>a>b?1:-1);
    if(typeof vals[0]==='number'){
      // 数値: 隣り合う値の中点で分割（Rのrpartと同じ）
      for(let i=0;i<vals.length-1;i++){
        const threshold=(vals[i]+vals[i+1])/2;
        consider(feat,threshold,
          rows.filter(r=>r[feat]<=threshold),
          rows.filter(r=>r[feat]>threshold));
      }
    } else if(vals.length<=12){
      // カテゴリ: 水準を2グループに分けるすべての組み合わせを試す（Rのrpartと同じ）
      const k=vals.length;
      for(let mask=1; mask<(1<<(k-1)); mask++){
        const sub=[]; // 先頭の水準は常に右側に置く（左右の入れ替えによる重複を避ける）
        for(let j=1;j<k;j++) if(mask&(1<<(j-1))) sub.push(vals[j]);
        consider(feat,sub,
          rows.filter(r=>sub.includes(r[feat])),
          rows.filter(r=>!sub.includes(r[feat])));
      }
    } else {
      // 水準が13以上: 1水準 対 その他（計算量のため）
      for(const v of vals){
        consider(feat,[v],
          rows.filter(r=>r[feat]===v),
          rows.filter(r=>r[feat]!==v));
      }
    }
  }
  return {feat:bestFeat, val:bestVal, score:bestScore,
          left:bestLeft, right:bestRight};
}

function majorityClass(rows){
  const cnt={};
  rows.forEach(r=>{cnt[r._y]=(cnt[r._y]||0)+1;});
  return Object.keys(cnt).sort((a,b)=>(cnt[b]-cnt[a])||(a<b?-1:a>b?1:0))[0];  // 同数のときは名前順（scikit-learnと同じ）
}
function meanVal(rows){ return rows.reduce((s,r)=>s+r._y,0)/rows.length; }

// 葉の「損失」: 分類=誤分類数、回帰=平方和（Rのrpartのrisk）
function nodeRisk(rows, task){
  if(task==='classification'){
    const c={}; rows.forEach(r=>{c[r._y]=(c[r._y]||0)+1;});
    return rows.length-Math.max(...Object.values(c));
  }
  return mse(rows)*rows.length;
}

function makeLeaf(rows, task, classes){
  const n=rows.length;
  return {leaf:true,
    pred: task==='classification'?majorityClass(rows):meanVal(rows),
    n,
    dist: task==='classification'?
      Object.fromEntries(classes.map(c=>[c,rows.filter(r=>r._y===c).length])):null,
    impurity: task==='classification'?gini([rows],classes):mse(rows),
    risk: nodeRisk(rows,task)};
}

function buildTree(rows, features, task, classes, depth, maxDepth, minSplit, minLeaf){
  const n=rows.length;
  // 終了条件
  const allSame=new Set(rows.map(r=>r._y)).size===1;
  if(depth>=maxDepth||n<minSplit||allSame) return makeLeaf(rows,task,classes);
  const {feat,val,score,left,right}=bestSplit(rows,features,task,classes,minLeaf);
  if(!feat||left.length<minLeaf||right.length<minLeaf) return makeLeaf(rows,task,classes);

  const parentImp=task==='classification'?gini([rows],classes):mse(rows);
  const L=buildTree(left,features,task,classes,depth+1,maxDepth,minSplit,minLeaf);
  const R=buildTree(right,features,task,classes,depth+1,maxDepth,minSplit,minLeaf);
  // 枝刈り: この分割（とその下の分割）で損失が減らないなら分割しない（Rのrpart(cp=0)と同じ）
  const parentRisk=nodeRisk(rows,task);
  if(parentRisk-(L.risk+R.risk) <= 1e-12) return makeLeaf(rows,task,classes);

  return {
    leaf:false, feat, val, score, n,
    impurity: parentImp,
    pred: task==='classification'?majorityClass(rows):meanVal(rows),
    risk: L.risk+R.risk,
    left:L, right:R,
  };
}

// 変数の重要度: 各分割での不純度の減少量（×サンプル数）を変数ごとに合計
function collectImportance(node, importance){
  if(node.leaf) return;
  importance[node.feat]=(importance[node.feat]||0)+(node.impurity-node.score)*node.n;
  collectImportance(node.left,importance);
  collectImportance(node.right,importance);
}

function predict(node, row){
  if(node.leaf) return node.pred;
  if(typeof node.val==='number'){
    return row[node.feat]<=node.val?predict(node.left,row):predict(node.right,row);
  } else {
    return node.val.includes(row[node.feat])?predict(node.left,row):predict(node.right,row);
  }
}

// ─── メイン ───
function runTree(){
  clearErr();
  const text=document.getElementById('csv-input').value;
  if(!text.trim()){showErr(t('errNoData'),['errNoData']);return;}
  let parsed;
  try{parsed=parseCSV(text);}catch(e){showErr(e.message,e.ik);return;}

  const {features,target,rows}=parsed;
  // タスク判定
  let task=document.getElementById('task-type').value;
  const yVals=rows.map(r=>r[target]);
  if(task==='auto'){
    const unique=[...new Set(yVals)];
    task=(unique.length<=10&&unique.some(v=>typeof v==='string'||Number.isInteger(+v)&&unique.length<=10))?
      'classification':'regression';
  }
  const classes=task==='classification'?[...new Set(yVals)].sort():[];
  const maxDepth=+document.getElementById('max-depth').value||4;
  const minSplit=+document.getElementById('min-split').value||2;
  const minLeaf=+document.getElementById('min-leaf').value||1;

  // Y列を _y に
  const data=rows.map(r=>({...r, _y:task==='regression'?+r[target]:r[target]}));

  const importance={};
  const tree=buildTree(data,features,task,classes,0,maxDepth,minSplit,minLeaf);
  collectImportance(tree,importance);

  // 重要度の正規化
  const totalImp=Object.values(importance).reduce((s,v)=>s+v,0)||1;
  const normImp=Object.fromEntries(
    Object.entries(importance).map(([k,v])=>[k,v/totalImp])
  );

  // 予測
  const preds=data.map(r=>predict(tree,r));

  G={features,target,rows:data,tree,task,classes,predictions:preds,importance:normImp};

  // 精度計算
  let accuracy=null, rmse=null;
  if(task==='classification'){
    accuracy=preds.filter((p,i)=>p==data[i]._y).length/preds.length;
  } else {
    rmse=Math.sqrt(preds.reduce((s,p,i)=>s+(p-data[i]._y)**2,0)/preds.length);
  }

  LAST={accuracy,rmse};
  HAS_RESULT=true;
  renderInfo();

  document.getElementById('result-card').style.display='block';
  switchTab('tree');
  drawTree();
  setTimeout(applyZoom,50);
  renderImportance();
  renderPredict(accuracy, rmse);
  renderRules();
  document.getElementById('result-card').scrollIntoView({behavior:'smooth'});
  setTimeout(applyZoom, 50);
}

function renderInfo(){
  const {task,rows,features}=G;
  const {accuracy,rmse}=LAST;
  const taskLabel=task==='classification'?t('taskClf'):t('taskReg');
  const acc=task==='classification'?t('accTxt',(accuracy*100).toFixed(1)):`RMSE: ${rmse.toFixed(3)}`;
  document.getElementById('result-info').innerHTML=t('info',taskLabel,rows.length,features.length,acc);
}

// ─── ツリー図描画 ───
function drawTree(){
  const wrap=document.getElementById('tree-svg-wrap');
  const NODE_W=+(document.getElementById('node-width')?.value||200);
  const NODE_H=80, H_GAP=20;
  const V_GAP=+(document.getElementById('v-gap')?.value||50);
  const FONT_SZ=+(document.getElementById('font-size')?.value||11);
  const task=G.task;
  const classes=G.classes;

  // ノードの位置を計算(葉を左から順に等間隔で並べ、内部ノードは子の中点に置く。ノードどうしは重ならない)
  const positions=[];
  let maxX=0, maxY=0, leafCount=0;
  const SLOT=NODE_W+H_GAP;

  function layout(node, depth){
    const y=depth*(NODE_H+V_GAP)+20;
    const id=positions.length;
    const rec={node, x:0, y, id, lId:-1, rId:-1};
    positions.push(rec);
    if(node.leaf){
      rec.x=20+leafCount*SLOT+NODE_W/2; leafCount++;
    } else {
      rec.lId=layout(node.left, depth+1);
      rec.rId=layout(node.right, depth+1);
      rec.x=(positions[rec.lId].x+positions[rec.rId].x)/2;
    }
    maxX=Math.max(maxX,rec.x+NODE_W/2);
    maxY=Math.max(maxY,y+NODE_H);
    return id;
  }
  layout(G.tree, 0);

  const W=Math.max(maxX+20,600), H=maxY+40;

  // 色設定
  const classColors=['#185FA5','#e05c2a','#0e7c5a','#8e44ad','#c0392b',
                     '#f39c12','#16a085','#2c3e50'];
  const classColorMap={};
  classes.forEach((c,i)=>classColorMap[c]=classColors[i%classColors.length]);

  function nodeColor(node){
    if(task==='classification'&&node.pred!==undefined){
      return classColorMap[node.pred]||'#185FA5';
    }
    return '#185FA5';
  }

  let svg=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="min-width:${W}px">`;

  // エッジ
  positions.forEach(({node,x,y,lId,rId})=>{
    if(!node.leaf){
      const lPos=positions[lId], rp=positions[rId];
      svg+=`<line x1="${x}" y1="${y+NODE_H}" x2="${lPos.x}" y2="${lPos.y}"
             stroke="#aaa" stroke-width="1.5"/>`;
      svg+=`<text x="${(x+lPos.x)/2-12}" y="${(y+NODE_H+lPos.y)/2}"
             font-size="${FONT_SZ-1}" fill="#185FA5" font-family="sans-serif">Yes</text>`;
      svg+=`<line x1="${x}" y1="${y+NODE_H}" x2="${rp.x}" y2="${rp.y}"
             stroke="#aaa" stroke-width="1.5"/>`;
      svg+=`<text x="${(x+rp.x)/2+4}" y="${(y+NODE_H+rp.y)/2}"
             font-size="${FONT_SZ-1}" fill="#e05c2a" font-family="sans-serif">No</text>`;
    }
  });

  // ノード（後で描画してエッジの上に重なるように）
  positions.forEach(({node,x,y,id})=>{
    const color=nodeColor(node);
    const rx=x-NODE_W/2, ry=y;
    const isLeaf=node.leaf;
    const fillColor=isLeaf?color+'22':'#fff';
    const strokeColor=color;

    svg+=`<rect x="${rx}" y="${ry}" width="${NODE_W}" height="${NODE_H}"
           rx="6" ry="6" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2"/>`;

    // ノード内テキスト
    const lines=[];
    if(!isLeaf){
      const valStr=typeof node.val==='number'?
        `≤ ${node.val.toFixed(2)}`:`∈ {${node.val.join(', ')}}`;
      lines.push({text:`${node.feat} ${valStr}`, bold:true, color:'#1a2332'});
      lines.push({text:`n = ${node.n}`, bold:false, color:'#555'});
      if(G.task==='classification')
        lines.push({text:`Gini = ${node.impurity.toFixed(3)}`, bold:false, color:'#777'});
      else
        lines.push({text:`MSE = ${node.impurity.toFixed(3)}`, bold:false, color:'#777'});
    } else {
      lines.push({text:`${t('predLbl')}${typeof node.pred==='number'?node.pred.toFixed(2):node.pred}`,
                  bold:true, color});
      lines.push({text:`n = ${node.n}`, bold:false, color:'#555'});
      if(G.task==='classification'&&node.dist){
        const distStr=Object.entries(node.dist).map(([k,v])=>`${k}:${v}`).join(' ');
        lines.push({text:distStr, bold:false, color:'#777'});
      } else if(G.task==='regression'){
        lines.push({text:`MSE = ${node.impurity.toFixed(3)}`, bold:false, color:'#777'});
      }
    }

    const lineH=18, startY=ry+NODE_H/2-(lines.length*lineH)/2+13;
    lines.forEach((l,i)=>{
      const esc=l.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      svg+=`<text x="${x}" y="${startY+i*lineH}" text-anchor="middle"
             font-size="${FONT_SZ}" font-family="sans-serif"
             font-weight="${l.bold?'700':'400'}" fill="${l.color}">${esc}</text>`;
    });
  });

  svg+='</svg>';
  wrap.innerHTML=svg;
}

// ─── 変数重要度 ───
function renderImportance(){
  const imp=G.importance;
  const sorted=Object.entries(imp).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length){
    document.getElementById('importance-wrap').innerHTML=
      '<p style="color:#777;font-style:italic">'+t('impNone')+'</p>';
    return;
  }
  let html='<div class="tbl-wrap"><table><thead><tr><th class="left">'+t('thVar')+'</th><th>'+t('thImp')+'</th><th style="width:40%">'+t('thBar')+'</th></tr></thead><tbody>';
  sorted.forEach(([feat,val])=>{
    html+=`<tr>
      <td class="left"><b>${feat}</b></td>
      <td>${(val*100).toFixed(1)}%</td>
      <td><div class="imp-bar-wrap"><div class="imp-bar" style="width:${(val*100).toFixed(1)}%"></div></div></td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('importance-wrap').innerHTML=html;
}

// ─── 予測・精度 ───
function renderPredict(accuracy, rmse){
  const {rows,predictions,target,features,task,classes}=G;
  let html='<div class="stat-row">';
  if(task==='classification'){
    html+=`<div class="stat"><div class="stat-val">${(accuracy*100).toFixed(1)}%</div>
           <div class="stat-lbl">${t('accTrain')}</div></div>`;
    // クラスごとの精度
    classes.forEach(c=>{
      const actual=rows.filter(r=>String(r._y)===String(c));
      const correct=actual.filter((r,i)=>String(predictions[rows.indexOf(r)])===String(c));
      html+=`<div class="stat">
        <div class="stat-val" style="font-size:18px">${actual.length>0?(correct.length/actual.length*100).toFixed(0):0}%</div>
        <div class="stat-lbl">${t('recall',c)}</div></div>`;
    });
  } else {
    html+=`<div class="stat"><div class="stat-val">${rmse.toFixed(3)}</div>
           <div class="stat-lbl">${t('rmseTrain')}</div></div>`;
    const r2=1-rows.reduce((s,r,i)=>s+(r._y-predictions[i])**2,0)/
             (rows.reduce((s,r)=>s+(r._y-rows.reduce((a,b)=>a+b._y,0)/rows.length)**2,0)||1);
    html+=`<div class="stat"><div class="stat-val">${r2.toFixed(3)}</div>
           <div class="stat-lbl">${t('r2Train')}</div></div>`;
  }
  html+='</div>';

  // テーブル
  html+='<div class="tbl-wrap"><table><thead><tr>';
  features.forEach(f=>html+=`<th>${f}</th>`);
  html+=`<th>${t('thObs',target)}</th><th>${t('thPredV')}</th><th>${t('thJudge')}</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const pred=predictions[i];
    const correct=task==='classification'?r._y==pred:null;
    html+='<tr>';
    features.forEach(f=>html+=`<td>${r[f]}</td>`);
    const predStr=typeof pred==='number'?pred.toFixed(3):pred;
    html+=`<td>${r._y}</td><td>${predStr}</td>`;
    if(task==='classification'){
      html+=`<td style="color:${correct?'#0e7c5a':'#c0392b'};font-weight:700">${correct?'✓':'✗'}</td>`;
    } else {
      const err=Math.abs(r._y-pred);
      html+=`<td style="color:#555">${t('errLbl',err.toFixed(3))}</td>`;
    }
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  document.getElementById('predict-wrap').innerHTML=html;
}

// ─── ルール一覧 ───
function renderRules(){
  const rules=[];
  function extract(node, path){
    if(node.leaf){
      const predStr=typeof node.pred==='number'?node.pred.toFixed(2):node.pred;
      rules.push({path:[...path], pred:predStr, n:node.n});
      return;
    }
    const valStr=typeof node.val==='number'?`≤ ${node.val.toFixed(2)}`:`∈ {${node.val.join(', ')}}`;
    const valStrR=typeof node.val==='number'?`> ${node.val.toFixed(2)}`:`∉ {${node.val.join(', ')}}`;
    extract(node.left, [...path, `${node.feat} ${valStr}`]);
    extract(node.right, [...path, `${node.feat} ${valStrR}`]);
  }
  extract(G.tree, []);

  let html='<div class="tbl-wrap"><table><thead><tr><th>#</th><th class="left">'+t('thRule')+'</th><th>'+t('thPredVal')+'</th><th>'+t('thN')+'</th></tr></thead><tbody>';
  rules.forEach((r,i)=>{
    const conds=r.path.length?r.path.join('<br>AND '):t('noCond');
    html+=`<tr>
      <td>${i+1}</td>
      <td class="left" style="font-size:12px">${conds}</td>
      <td><b>${r.pred}</b></td>
      <td>${r.n}</td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('rules-wrap').innerHTML=html;
}

// ─── CSVダウンロード ───
function downloadPredictions(){
  const {rows,predictions,target,features}=G;
  const headers=[...features, target, t('thPredV'), t('csvJudge')];
  const lines=[headers.join(',')];
  rows.forEach((r,i)=>{
    const pred=predictions[i];
    const predStr=typeof pred==='number'?pred.toFixed(3):pred;

}

  if(svg&&wrap){

    const w=+svg.getAttribute('width')||600;
    wrap.style.minHeight=(h*scale)+'px';
  }
}

function loadExample(n){
  document.getElementById('csv-input').value=EX[LANG][n];
  document.getElementById('task-type').value=EX_CFG[n][0];
  document.getElementById('max-depth').value=EX_CFG[n][1];
}

function renderGlossary(){
  let html='';
  t('gloss').forEach(r=>{ html+=`<tr><td class="left"><b>${r[0]}</b></td><td class="left">${r[1]}</td></tr>`; });
  document.getElementById('gloss-body').innerHTML=html;
}

// re-render everything language-dependent (results are re-drawn from the stored state; nothing is re-computed)
function onLangChange(){
  renderGlossary();
  const ta=document.getElementById('csv-input');
  if(!HAS_RESULT){   // an untouched example follows the language (not after an analysis, so inputs and results stay consistent)
    outer: for(const n of [1,2,3]) for(const l of ['ja','en']){
      if(l!==LANG && ta.value===EX[l][n]){ ta.value=EX[LANG][n]; break outer; }
    }
  }
  if(ERR_I && document.getElementById('err-msg').style.display==='block')
    document.getElementById('err-msg').textContent=t.apply(null,ERR_I);
  if(HAS_RESULT){
    renderInfo(); drawTree(); applyZoom();
    renderImportance(); renderPredict(LAST.accuracy,LAST.rmse); renderRules();
  }
  const rs=document.getElementById('rs-text');
  if(rs && rs.value && rsFailed(rs.value)) rsMake();
}

function rsRaw(text){
  let d='---';

function rsDownload(){
  const ta=document.getElementById('rs-text');

  const b64=btoa(unescape(encodeURIComponent('﻿'+ta.value)));

  rawLines[0]=names.join(sepc);
  const L=rsHeader(ja?'決定木: アプリ(decision_tree.html)と同じ計算をRで行う（rpartパッケージ）'
                      :'Decision tree: the same calculation as the app (decision_tree.html), in R (rpart package)',
    ['# install.packages("rpart")']);
  L.push('',
    'library(rpart)',
    '',
    (ja?'# 変数の対応: ':'# Variable mapping: ')+features.map((f,i)=>'x'+(i+1)+'='+f).join(', ')+', y='+target+(ja?'（目的変数）':' (target)'),
    '',
    ja?'# 1. データ（文字の列は自動で factor になる）':'# 1. Data (character columns are converted to factors automatically)',
    'dat <- read.csv(text = '+rsRaw(rawLines.join('\n'))+',',
    '                sep = "'+(sepc==='\t'?'\\t':',')+'", header = TRUE, stringsAsFactors = TRUE)');
  if(task==='classification') L.push(ja?'dat$y <- factor(dat$y)   # 分類木: 目的変数をカテゴリとして扱う':'dat$y <- factor(dat$y)   # classification tree: treat the target as categorical');
  L.push('',
    ja?('# 2. 決定木（'+(task==='classification'?'分類木。不純度はジニ係数':'回帰木。分割基準は平方和の減少')+'）')
       :('# 2. Decision tree ('+(task==='classification'?'classification tree; impurity is the Gini index':'regression tree; the split criterion is the reduction in the sum of squares')+')'),
    ja?'#    cp = 0: 複雑さによる枝刈りをしない。ただし、分割しても損失が減らない枝は、rpartの仕様で切り落とされる'
       :'#    cp = 0: no pruning by complexity; however, rpart drops branches whose split does not reduce the loss',
    ja?'#    xval = 0, maxcompete = 0, maxsurrogate = 0: 交差検証・競合分割・代理分割は使わない（アプリと同じ条件）'
       :'#    xval = 0, maxcompete = 0, maxsurrogate = 0: no cross-validation, competing splits or surrogate splits (same conditions as the app)',
    'fit <- rpart(y ~ ., data = dat,',
    '             method = "'+(task==='classification'?'class':'anova')+'",',
    '             control = rpart.control(minsplit = '+minSplit+', minbucket = '+minLeaf+', maxdepth = '+maxDepth+',',
    '                                     cp = 0, xval = 0, maxcompete = 0, maxsurrogate = 0))',
    '',
    ja?'# 3. 木の構造（アプリの「ツリー図」「ルール」タブと比べてください）'
       :'# 3. Tree structure (compare with the "Decision tree" and "Rules" tabs of the app)',
    'print(fit)',
    '',
    ja?'# 4. 変数の重要度（合計1に正規化。アプリの「重要度」タブに対応）'
       :'# 4. Variable importance (normalized to sum to 1; corresponds to the "Variable importance" tab)',
    'imp <- fit$variable.importance',
    'print(round(imp / sum(imp), 4))',
    '',
    ja?'# 5. 学習データでの精度':'# 5. Accuracy on the training data');
  if(task==='classification') L.push('pred <- predict(fit, type = "class")',
      ja?'cat("正解率:", round(mean(pred == dat$y), 4), "\\n")':'cat("Accuracy:", round(mean(pred == dat$y), 4), "\\n")',
      ja?'print(table(実測 = dat$y, 予測 = pred))':'print(table(observed = dat$y, predicted = pred))');
  else L.push('pred <- predict(fit)','cat("RMSE:", round(sqrt(mean((pred - dat$y)^2)), 4), "\\n")');
  L.push('',
    ja?'# 6. グラフ（rpart.plotパッケージがあれば、より見やすくなります: install.packages("rpart.plot")）'
       :'# 6. Plot (the rpart.plot package gives a nicer figure if available: install.packages("rpart.plot"))',
    'plot(fit, uniform = TRUE, margin = 0.1); text(fit, use.n = TRUE, cex = 0.8)');
  return L.join('\n')+'\n';
}

LANG=detectLang();
applyI18n();
