<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}
// =================================================================

function loadCACSVFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const tryRead = (encoding) => {
    const reader = new FileReader();
    reader.onload = function(e){
      let text = e.target.result.replace(/^\uFEFF/, '');
      if(encoding === 'UTF-8' && (text.match(/\uFFFD/g)||[]).length > 5){
        tryRead('Shift-JIS'); return;
      }
      document.getElementById('csv-input').value = text;
      parseCSV();
    };
    reader.readAsText(file, encoding);
  };
  tryRead('UTF-8');
  event.target.value = '';
}

function parseCSV(){
  const txt = document.getElementById('csv-input').value.trim();
  if(!txt) return;
  const lines = txt.split('\n').map(l=>l.trim()).filter(l=>l);
  if(lines.length < 3){ return; }

  const header = lines[0].split(',');
  colNames = header.slice(1).map(s=>s.trim());
  rowNames = []; contingency = [];

  for(let i=1; i<lines.length; i++){
    const cols = lines[i].split(',');
    const rname = cols[0].trim();
    const vals = cols.slice(1).map(v=>parseInt(v.trim()));
    if(vals.some(isNaN) || vals.length < colNames.length) continue;
    rowNames.push(rname);
    contingency.push(vals.slice(0, colNames.length));
  }

  N = {r: rowNames.length, c: colNames.length};
  renderParseInfo();
}

// ─── 行列演算ユーティリティ ───────────────────────────────
const matAdd=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
const matScale=(A,s)=>A.map(r=>r.map(v=>v*s));
const matMul=(A,B)=>{
  const r=A.length, mid=B.length, c=B[0].length;
  return Array.from({length:r},(_,i)=>Array.from({length:c},(_,j)=>
    Array.from({length:mid},(_,k)=>A[i][k]*B[k][j]).reduce((a,b)=>a+b,0)));
};
const transpose=M=>M[0].map((_,j)=>M.map(r=>r[j]));

// ─── SVD（ゴルブ・ラインシュ二重対角化の簡易実装）────────
// Jacobi SVDで対称行列A^TAの固有値分解を使う方法
function svd(A){
  // A: m×n行列 → U(m×k), S(k), V(n×k) を返す (k=min(m,n))
  const m=A.length, n=A[0].length;
  // ATA = A^T * A (n×n)
  const At=transpose(A);
  const ATA=matMul(At,A);

  // Jacobi固有値分解でATAの固有値・固有ベクトル
  const{values, vectors}=jacobiEigen(ATA, n);

  // 特異値 = sqrt(固有値)、降順ソート
  let sv=values.map((v,i)=>({s:Math.sqrt(Math.max(0,v)), v:vectors[i], idx:i}));
  sv.sort((a,b)=>b.s-a.s);

  const k=Math.min(m,n);
  const S=sv.slice(0,k).map(x=>x.s);
  // V: 右特異ベクトル (n×k)
  const V=Array.from({length:n},(_,i)=>sv.slice(0,k).map(x=>x.v[i]));
  // U: 左特異ベクトル U = A*V / s
  const AV=matMul(A, V);
  const U=Array.from({length:m},(_,i)=>sv.slice(0,k).map((x,j)=>
    S[j]>1e-10 ? AV[i][j]/S[j] : 0
  ));
  return{U, S, V};
}

function jacobiEigen(A, n){
  let a=A.map(r=>[...r]);
  let V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let iter=0;iter<2000;iter++){
    let p=0,q=1,mx=0;
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++)
      if(Math.abs(a[i][j])>mx){mx=Math.abs(a[i][j]);p=i;q=j;}
    if(mx<1e-12) break;
    const th=0.5*Math.atan2(2*a[p][q], a[p][p]-a[q][q]);
    const c=Math.cos(th), s=Math.sin(th);
    const na=a.map(r=>[...r]);
    for(let i=0;i<n;i++){
      na[p][i]=c*a[p][i]+s*a[q][i]; na[q][i]=-s*a[p][i]+c*a[q][i];
    }
    for(let i=0;i<n;i++){
      na[i][p]=c*a[i][p]+s*a[i][q]; na[i][q]=-s*a[i][p]+c*a[i][q];
    }
    na[p][p]=c*c*a[p][p]+2*s*c*a[p][q]+s*s*a[q][q];
    na[q][q]=s*s*a[p][p]-2*s*c*a[p][q]+c*c*a[q][q];
    na[p][q]=0; na[q][p]=0; a=na;
    const nV=V.map(r=>[...r]);
    for(let i=0;i<n;i++){
      nV[i][p]=c*V[i][p]+s*V[i][q]; nV[i][q]=-s*V[i][p]+c*V[i][q];
    }
    V=nV;
  }
  return{values:Array.from({length:n},(_,i)=>Math.max(0,a[i][i])),
         vectors:Array.from({length:n},(_,i)=>V.map(r=>r[i]))};
}

// ─── コレスポンデンス分析 ──────────────────────────────────
function correspondenceAnalysis(P, coordType){
  const nr=P.length, nc=P[0].length;

  // 合計
  const grand=P.flat().reduce((a,b)=>a+b,0);
  // 確率行列
  const F=P.map(r=>r.map(v=>v/grand));
  // 行・列の周辺分布
  const r=F.map(row=>row.reduce((a,b)=>a+b,0));
  const c=F[0].map((_,j)=>F.reduce((s,row)=>s+row[j],0));

  // 残差行列 S = Dr^{-1/2} (F - r c^T) Dc^{-1/2}
  const S=Array.from({length:nr},(_,i)=>
    Array.from({length:nc},(_,j)=>
      (F[i][j] - r[i]*c[j]) / (Math.sqrt(r[i])*Math.sqrt(c[j]))
    )
  );

  // SVD
  const{U, S:sv, V}=svd(S);
  const ndim=Math.min(nr-1, nc-1, sv.length);

  // 固有値（慣性）= 特異値の二乗
  const inertia=sv.slice(0,ndim).map(s=>s*s);
  const totalInertia=inertia.reduce((a,b)=>a+b,0);
  const contrib=inertia.map(v=>v/totalInertia);

  // 座標計算
  // 標準座標
  const rowStd=Array.from({length:nr},(_,i)=>
    sv.slice(0,ndim).map((s,d)=> s>1e-10 ? U[i][d]/Math.sqrt(r[i]) : 0)
  );
  const colStd=Array.from({length:nc},(_,j)=>
    sv.slice(0,ndim).map((s,d)=> s>1e-10 ? V[j][d]/Math.sqrt(c[j]) : 0)
  );
  // 主座標
  const rowPrin=Array.from({length:nr},(_,i)=>
    sv.slice(0,ndim).map((s,d)=>rowStd[i][d]*s)
  );
  const colPrin=Array.from({length:nc},(_,j)=>
    sv.slice(0,ndim).map((s,d)=>colStd[j][d]*s)
  );

  // 座標タイプに応じて返す座標を決定
  let rowCoords, colCoords;
  if(coordType==='row'){
    rowCoords=rowPrin; colCoords=colStd;
  } else if(coordType==='col'){
    rowCoords=rowStd; colCoords=colPrin;
  } else {
    // 対称（principal for both）
    rowCoords=rowPrin; colCoords=colPrin;
  }

  // 寄与度（行・列）
  const rowContrib=Array.from({length:nr},(_,i)=>
    inertia.map((iv,d)=> iv>1e-10 ? r[i]*rowPrin[i][d]**2/iv : 0)
  );
  const colContrib=Array.from({length:nc},(_,j)=>
    inertia.map((iv,d)=> iv>1e-10 ? c[j]*colPrin[j][d]**2/iv : 0)
  );

  // cos2（表現の良さ）
  const rowCos2=Array.from({length:nr},(_,i)=>{
    const dist2=rowPrin[i].reduce((s,v)=>s+v**2,0);
    return rowPrin[i].map(v=> dist2>1e-10 ? v**2/dist2 : 0);
  });
  const colCos2=Array.from({length:nc},(_,j)=>{
    const dist2=colPrin[j].reduce((s,v)=>s+v**2,0);
    return colPrin[j].map(v=> dist2>1e-10 ? v**2/dist2 : 0);
  });

  // カイ二乗統計量・自由度・p値の計算
  const grandTotal = P.flat().reduce((a,b)=>a+b,0);
  const chiSq = totalInertia * grandTotal;
  const df = (nr-1)*(nc-1);
  // p値の近似（カイ二乗分布の上側確率）
  function chiSqPval(x, k){
    // カイ二乗分布の上側確率 = 正則化不完全ガンマ関数 Q(k/2, x/2)（級数展開／連分数）
    if(x<=0||k<=0) return 1;
    const a=k/2, xx=x/2;
    function lgamma(z){
      const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
      let y=z, t=z+5.5; t-=(z+0.5)*Math.log(t);
      let ser=1.000000000190015;
      for(let j=0;j<6;j++) ser+=c[j]/++y;
      return -t+Math.log(2.5066282746310005*ser/z);
    }
    if(xx<a+1){
      let ap=a, sum=1/a, del=sum;
      for(let n=0;n<1000;n++){ap++; del*=xx/ap; sum+=del; if(Math.abs(del)<Math.abs(sum)*1e-14) break;}
      return Math.max(0,Math.min(1,1-sum*Math.exp(-xx+a*Math.log(xx)-lgamma(a))));
    }
    let b=xx+1-a, c=1/1e-300, d=1/b, h=d;
    for(let i=1;i<1000;i++){
      const an=-i*(i-a); b+=2;
      d=an*d+b; if(Math.abs(d)<1e-300) d=1e-300;
      c=b+an/c; if(Math.abs(c)<1e-300) c=1e-300;
      d=1/d; const del=d*c; h*=del;
      if(Math.abs(del-1)<1e-14) break;
    }
    return Math.max(0,Math.min(1,Math.exp(-xx+a*Math.log(xx)-lgamma(a))*h));
  }
  const pval = chiSqPval(chiSq, df);

  return{inertia,totalInertia,contrib,
         rowCoords,colCoords,rowStd,colStd,rowPrin,colPrin,
         rowContrib,colContrib,rowCos2,colCos2,
         rowMass:r,colMass:c,ndim,sv:sv.slice(0,ndim),
         chiSq,df,pval,grandTotal,nr,nc};
}

function rerunCA(){
  if(window._caLastRes) runCA();
}

function runCA(opts){
  const keepTab=!!(opts&&opts.keepTab);
  hideErr();
  if(!N || contingency.length<2){
    showErr('errLoad');
    return;
  }
  if(contingency.some(r=>r.some(v=>v<0))){
    showErr('errNeg');
    return;
  }
  const total=contingency.flat().reduce((a,b)=>a+b,0);
  if(total===0){showErr('errTotal0'); return;}
  if(contingency.some(r=>r.reduce((a,b)=>a+b,0)===0) || contingency[0].some((_,j)=>contingency.reduce((a,r)=>a+r[j],0)===0)){
    showErr('errZeroRC'); return;
  }

  const coordType=document.getElementById('coord-type').value;

  const res=correspondenceAnalysis(contingency, coordType);
  const ndim=res.ndim;

  // snapshot of the inputs used for this result (so that the result can be re-rendered in another language)
  window._caSnap={N:{r:N.r,c:N.c}, rowNames:[...rowNames], colNames:[...colNames], contingency:contingency.map(r=>[...r])};
  window._caRes = res;
  window._caNdim = ndim;

  const rc=document.getElementById('result-content');
  rc.innerHTML = buildResultHTML(window._caSnap,res);
  if(opts&&opts.ui){ fillAxisSelects(res); restoreUI(opts.ui); }
  if(!keepTab) switchTab('result');

  setTimeout(()=>{
    drawAllCharts(res, ndim);
  }, 50);
}

function buildResultHTML(snap,res){
  const N=snap.N, rowNames=snap.rowNames, colNames=snap.colNames, contingency=snap.contingency;
  const ndim=res.ndim;
  let html='';

  // metrics
  const cumAcc2=res.contrib.slice(0,Math.min(2,res.ndim)).reduce((a,b)=>a+b,0);
  html+=`<div class="metric-row">
    <div class="metric"><div class="metric-lbl">${t('mRows')}</div><div class="metric-val">${N.r}</div></div>
    <div class="metric"><div class="metric-lbl">${t('mCols')}</div><div class="metric-val">${N.c}</div></div>
    <div class="metric"><div class="metric-lbl">${t('mTI')}</div><div class="metric-val">${f4(res.totalInertia)}</div></div>
    <div class="metric"><div class="metric-lbl">${t('mCum2')}</div><div class="metric-val">${pct(cumAcc2)}</div></div>
  </div>`;

  // cross-tabulation
  html+=`<div class="card"><h2>${t('cardCross')}</h2>
  <div class="overflow-x"><table class="tbl"><thead><tr>
    <th></th>${colNames.map(c=>`<th>${c}</th>`).join('')}<th>${t('total')}</th>
  </tr></thead><tbody>`;
  for(let i=0;i<N.r;i++){
    const rowSum=contingency[i].reduce((a,b)=>a+b,0);
    html+=`<tr><td>${rowNames[i]}</td>
      ${contingency[i].map(v=>`<td>${v}</td>`).join('')}
      <td style="background:#e8f5f0;font-weight:500">${rowSum}</td></tr>`;
  }
  const colSums=colNames.map((_,j)=>contingency.reduce((s,r)=>s+r[j],0));
  const grandTotal=colSums.reduce((a,b)=>a+b,0);
  html+=`<tr style="background:#e8f5f0;font-weight:500"><td>${t('total')}</td>
    ${colSums.map(v=>`<td>${v}</td>`).join('')}
    <td>${grandTotal}</td></tr>`;
  html+=`</tbody></table></div></div>`;

  // inertia table
  const dimLabels=Array.from({length:res.ndim},(_,i)=>t('dimLbl',i+1));
  html+=`<div class="card"><h2>${t('cardInertia')}
    <span class="star-sig">${t('hiNote')}</span></h2>
  <div class="overflow-x"><table class="tbl"><thead><tr>
    <th>${t('thDim')}</th><th>${t('thSv')}</th><th>${t('thIn')}</th><th>${t('thPr')}</th><th>${t('thCu')}</th>
  </tr></thead><tbody>`;
  let cumS=0;
  for(let d=0;d<res.ndim;d++){
    cumS+=res.contrib[d];
    html+=`<tr>
      <td>${dimLabels[d]}</td>
      <td>${f4(res.sv[d])}</td>
      <td>${f4(res.inertia[d])}</td>
      <td>${pct(res.contrib[d])}</td>
      <td class="${cumS>=0.8?'hi':''}">${pct(cumS)}</td>
    </tr>`;
  }
  html+=`</tbody></table></div></div>`;

  // fit statistics
  const pvalStr = res.pval < 0.001 ? 'p &lt; .001 ***' :
                  res.pval < 0.01  ? `p = ${res.pval.toFixed(3)} **` :
                  res.pval < 0.05  ? `p = ${res.pval.toFixed(3)} *` :
                                     `p = ${res.pval.toFixed(3)}`;
  html+=`<div class="card"><h2>${t('cardFit')}
    <span class="star-sig">*** p&lt;.001　** p&lt;.01　* p&lt;.05</span></h2>
  <div class="overflow-x"><table class="tbl"><thead><tr>
    <th>${t('thStat')}</th><th>${t('thVal')}</th><th>${t('thDesc')}</th>
  </tr></thead><tbody>
    <tr><td>${t('sN')}</td><td>${res.grandTotal}</td><td>${t('sNd')}</td></tr>
    <tr><td>${t('mRows')}</td><td>${res.nr}</td><td></td></tr>
    <tr><td>${t('mCols')}</td><td>${res.nc}</td><td></td></tr>
    <tr><td>${t('sDf')}</td><td>${res.df}</td><td>${t('sDfd')}</td></tr>
    <tr class="${res.pval<0.05?'hi':''}" style="${res.pval<0.05?'':''}">
      <td>${t('sChi')}</td>
      <td>${res.chiSq.toFixed(3)}</td>
      <td>${t('sChiD',pvalStr)}</td></tr>
    <tr><td>${t('sTI')}</td><td>${f4(res.totalInertia)}</td>
      <td>${t('sTId')}</td></tr>
    <tr><td>${t('sD1')}</td><td>${f4(res.inertia[0])}</td>
      <td>${t('sProp',pct(res.contrib[0]))}</td></tr>
    <tr><td>${t('sD2')}</td><td>${res.ndim>=2?f4(res.inertia[1]):t('na')}</td>
      <td>${res.ndim>=2?t('sProp',pct(res.contrib[1])):t('na')}</td></tr>
    <tr><td>${t('sCum')}</td>
      <td>${pct(res.contrib.slice(0,Math.min(2,res.ndim)).reduce((a,b)=>a+b,0))}</td>
      <td>${t('sCumD')}</td></tr>
  </tbody></table></div>
  <div class="note" style="margin-top:8px">
    ${t('fitNote1')}<br>
    ${t('fitNote2')}
  </div></div>`;

  // coordinates, contributions
  html+=`<div class="card"><h2>${t('cardRowC')}</h2>
  <div class="overflow-x"><table class="tbl"><thead><tr>
    <th>${t('thRowCat')}</th>
    ${dimLabels.slice(0,ndim).flatMap(d=>[`<th>${t('hCoord',d)}</th>`,`<th>${t('hCtr',d)}</th>`,`<th>${t('hCos',d)}</th>`]).join('')}
  </tr></thead><tbody>`;
  for(let i=0;i<N.r;i++){
    html+=`<tr><td>${rowNames[i]}</td>`;
    for(let d=0;d<ndim;d++){
      html+=`<td>${f3(res.rowCoords[i][d])}</td>
             <td class="${res.rowContrib[i][d]>=0.1?'hi':''}">${f3(res.rowContrib[i][d])}</td>
             <td>${f3(res.rowCos2[i][d])}</td>`;
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table></div></div>`;

  html+=`<div class="card"><h2>${t('cardColC')}</h2>
  <div class="overflow-x"><table class="tbl"><thead><tr>
    <th>${t('thColCat')}</th>
    ${dimLabels.slice(0,ndim).flatMap(d=>[`<th>${t('hCoord',d)}</th>`,`<th>${t('hCtr',d)}</th>`,`<th>${t('hCos',d)}</th>`]).join('')}
  </tr></thead><tbody>`;
  for(let j=0;j<N.c;j++){
    html+=`<tr><td>${colNames[j]}</td>`;
    for(let d=0;d<ndim;d++){
      html+=`<td>${f3(res.colCoords[j][d])}</td>
             <td class="${res.colContrib[j][d]>=0.1?'hi':''}">${f3(res.colContrib[j][d])}</td>
             <td>${f3(res.colCos2[j][d])}</td>`;
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table></div>`;

  // symmetric map
  html+=`<div class="card">
    <h2>${t('cardSym')}
      <span class="star-sig">${t('symLegend')}</span></h2>
    <div class="badge-row">
      <span class="badge badge-row-item">${t('badgeRow')}${rowNames.join(t('sepNames'))}</span>
      <span class="badge badge-col-item">${t('badgeCol')}${colNames.join(t('sepNames'))}</span>
    </div>
    <div class="chk-row" style="flex-wrap:wrap;gap:10px">
      <span style="color:#555;font-size:13px">${t('axXl')}<select id="axis-x" onchange="onAxisChange()" style="font-size:12px;padding:2px 6px;border:1px solid #ddd;border-radius:4px"></select></span>
      <span style="color:#555;font-size:13px">${t('axYl')}<select id="axis-y" onchange="onAxisChange()" style="font-size:12px;padding:2px 6px;border:1px solid #ddd;border-radius:4px"></select></span>
      <label><input type="checkbox" id="sym-row-lbl" checked onchange="updateCharts()">${t('lblRowCk')}</label>
      <label><input type="checkbox" id="sym-col-lbl" checked onchange="updateCharts()">${t('lblColCk')}</label>
      <label><input type="checkbox" id="sym-col-arrow" onchange="updateCharts()">${t('arrowCk')}</label>
      <label style="color:#555">${t('fontSz')}<select id="sym-font-size" onchange="updateCharts()" style="font-size:12px;padding:2px 6px;border:1px solid #ddd;border-radius:4px">
        <option value="9">9px</option>
        <option value="10">10px</option>
        <option value="11" selected>11px</option>
        <option value="12">12px</option>
        <option value="13">13px</option>
        <option value="14">14px</option>
      </select></label>
    </div>
    <div class="chart-wrap" style="height:520px"><canvas id="sym-canvas"></canvas></div>
  </div>`;

  // separate row / column plots
  const fontOpts=`<option value="9">9px</option><option value="10">10px</option><option value="11" selected>11px</option><option value="12">12px</option><option value="13">13px</option><option value="14">14px</option>`;
  html+=`<div class="two-col">
    <div class="card">
      <h2>${t('cardRowP')}</h2>
      <div class="chk-row">
        <label><input type="checkbox" id="row-lbl" checked onchange="updateCharts()">${t('lblCk')}</label>
        <label style="color:#555">${t('fontSz2')}<select id="row-font-size" onchange="updateCharts()" style="font-size:12px;padding:2px 6px;border:1px solid #ddd;border-radius:4px">${fontOpts}</select></label>
      </div>
      <div class="chart-wrap" style="height:300px"><canvas id="row-canvas"></canvas></div>
    </div>
    <div class="card">
      <h2>${t('cardColP')}</h2>
      <div class="chk-row">
        <label><input type="checkbox" id="col-lbl" checked onchange="updateCharts()">${t('lblCk')}</label>
        <label style="color:#555">${t('fontSz2')}<select id="col-font-size" onchange="updateCharts()" style="font-size:12px;padding:2px 6px;border:1px solid #ddd;border-radius:4px">${fontOpts}</select></label>
      </div>
      <div class="chart-wrap" style="height:300px"><canvas id="col-canvas"></canvas></div>
    </div>
  </div>`;

  // glossary
  const gh=t('glH'), gl=t('gloss');
  html+=`<div class="card"><h2>${t('cardGloss')}</h2>
  <div class="overflow-x"><table class="tbl"><thead><tr>
    ${gh.map(x=>`<th style="text-align:left">${x}</th>`).join('')}
  </tr></thead><tbody>
    ${gl.map(r=>`<tr><td style="text-align:left"><b>${r[0]}</b></td>
      <td style="text-align:left">${r[1]}</td>
      <td style="text-align:left">${r[2]}</td></tr>`).join('')}
  </tbody></table></div></div>`;

  // download
  html+=`<div style="display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap">
    <button class="btn-download" onclick="downloadCoords()">${t('dlCoords')}</button>
  </div>`;
  return html;
}

// ─── チャート描画 ─────────────────────────────────────────
function destroyCharts(){
  caCharts.forEach(c=>{try{c.destroy();}catch(e){}});
  caCharts=[];
}

function makeLabelPlugin(getId1, getId2, rowCoords, colCoords, rowNames, colNames, getFontSizeId){
  return{
    id:'caLabels'+Math.random(),
    afterDraw(chart){
      const showRow=document.getElementById(getId1)?.checked!==false;
      const showCol=getId2?document.getElementById(getId2)?.checked!==false:false;
      const fs=+(document.getElementById(getFontSizeId||'sym-font-size')?.value||11);
      const ctx2=chart.ctx;
      const xs=chart.scales.x, ys=chart.scales.y;
      const toX=v=>xs.getPixelForValue(v);
      const toY=v=>ys.getPixelForValue(v);
      ctx2.save();
      ctx2.font=`bold ${fs}px Helvetica Neue,Arial,sans-serif`;
      ctx2.textBaseline='middle';
      const th=fs+4;

      if(showRow && rowCoords){
        rowCoords.forEach((c,i)=>{
          const px=toX(c[0]), py=toY(c[1]);
          const tw=ctx2.measureText(rowNames[i]).width;
          ctx2.fillStyle='rgba(255,255,255,0.85)';
          ctx2.fillRect(px+8,py-th/2-1,tw+4,th+2);
          ctx2.fillStyle='rgba(14,124,90,0.95)';
          ctx2.fillText(rowNames[i],px+10,py);
        });
      }
      if(showCol && colCoords){
        colCoords.forEach((c,j)=>{
          const px=toX(c[0]), py=toY(c[1]);
          const tw=ctx2.measureText(colNames[j]).width;
          ctx2.fillStyle='rgba(255,255,255,0.85)';
          ctx2.fillRect(px+8,py-th/2-1,tw+4,th+2);
          ctx2.fillStyle='rgba(200,80,0,0.95)';
          ctx2.fillText(colNames[j],px+10,py);
        });
      }
      ctx2.restore();
    }
  };
}

function axisRange(coords1, coords2){
  const all=[...coords1, ...(coords2||[])].flatMap(c=>c.slice(0,2));
  const mx=Math.max(...all.map(Math.abs));
  const rng=(mx||1)*1.3;
  return{min:-rng, max:rng};
}

function makeChartOptions(ax1, ax2, xRange, yRange, plugins){
  return{
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}, tooltip:{callbacks:{
      label:c=>`${c.dataset.label} (${f3(c.raw.x)}, ${f3(c.raw.y)})`
    }}, ...plugins},
    scales:{
      x:{min:xRange.min, max:xRange.max,
         title:{display:true,text:ax1,font:{size:12}},
         grid:{color:'rgba(0,0,0,0.06)'}, ticks:{callback:v=>f2(v)}},
      y:{min:yRange.min, max:yRange.max,
         title:{display:true,text:ax2,font:{size:12}},
         grid:{color:'rgba(0,0,0,0.06)'}, ticks:{callback:v=>f2(v)}}
    }
  };
}

// 原点の十字線プラグイン
const crosshairPlugin={
  id:'crosshair',
  beforeDraw(chart){
    const ctx2=chart.ctx;
    const xs=chart.scales.x, ys=chart.scales.y;
    ctx2.save();
    ctx2.strokeStyle='rgba(0,0,0,0.15)';
    ctx2.lineWidth=1;
    ctx2.setLineDash([4,4]);
    // 縦線（x=0）
    ctx2.beginPath();
    ctx2.moveTo(xs.getPixelForValue(0), ys.top);
    ctx2.lineTo(xs.getPixelForValue(0), ys.bottom);
    ctx2.stroke();
    // 横線（y=0）
    ctx2.beginPath();
    ctx2.moveTo(xs.left, ys.getPixelForValue(0));
    ctx2.lineTo(xs.right, ys.getPixelForValue(0));
    ctx2.stroke();
    ctx2.setLineDash([]);
    ctx2.restore();
  }
};

function redrawSymMap(res, ndim, xi, yi, ax1, ax2, range){
  const rowNames = window._caRowNames || [];
  const colNames = window._caColNames || [];
  if(xi===undefined || yi===undefined){
    const idx=getAxisIndices(); xi=idx.x; yi=idx.y;
  }
  if(!ax1) ax1=t('axisT',xi+1,pct(res.contrib[xi]||0));
  if(!ax2) ax2=t('axisT',yi+1,pct(res.contrib[yi]||0));
  if(!range) range=axisRange(
    res.rowCoords.map(c=>[c[xi]||0, c[yi]||0]),
    res.colCoords.map(c=>[c[xi]||0, c[yi]||0])
  );
  const showArrow=document.getElementById('sym-col-arrow')?.checked||false;

  // 既存の対称マップを破棄
  const oldSym=caCharts.find(c=>c.canvas&&c.canvas.id==='sym-canvas');
  if(oldSym){ oldSym.destroy(); caCharts=caCharts.filter(c=>c!==oldSym); }

  const symCtx=document.getElementById('sym-canvas');
  if(!symCtx) return;

  // 行ラベル + 矢印でない場合の列ラベルプラグイン
  const symLblPlugin={
    id:'caLabels_sym',
    afterDraw(chart){
      const showRow=document.getElementById('sym-row-lbl')?.checked!==false;
      const showColLbl=document.getElementById('sym-col-lbl')?.checked!==false;
      const isArrow=document.getElementById('sym-col-arrow')?.checked||false;
      const c2=chart.ctx;
      const xs=chart.scales.x, ys=chart.scales.y;
      c2.save();
      c2.font='bold 12px Helvetica Neue,Arial,sans-serif';
      c2.textBaseline='middle';
      // 行ラベル
      if(showRow){
        const fs=+(document.getElementById('sym-font-size')?.value||11);
        c2.font=`bold ${fs}px Helvetica Neue,Arial,sans-serif`;
        res.rowCoords.forEach((coord,i)=>{
          const px=xs.getPixelForValue(coord[xi]||0), py=ys.getPixelForValue(coord[yi]||0);
          const tw=c2.measureText(rowNames[i]).width;
          const th=fs+4;
          c2.fillStyle='rgba(255,255,255,0.85)';
          c2.fillRect(px+8,py-th/2-1,tw+4,th+2);
          c2.fillStyle='rgba(14,124,90,0.95)';
          c2.fillText(rowNames[i],px+10,py);
        });
      }
      // 列ラベル（矢印でない場合のみ点ラベル、矢印の場合は矢印プラグインが担当）
      if(showColLbl && !isArrow){
        const fs2=+(document.getElementById('sym-font-size')?.value||11);
        c2.font=`bold ${fs2}px Helvetica Neue,Arial,sans-serif`;
        res.colCoords.forEach((coord,j)=>{
          const px=xs.getPixelForValue(coord[xi]||0), py=ys.getPixelForValue(coord[yi]||0);
          const tw=c2.measureText(colNames[j]).width;
          const th=fs2+4;
          c2.fillStyle='rgba(255,255,255,0.85)';
          c2.fillRect(px+8,py-th/2-1,tw+4,th+2);
          c2.fillStyle='rgba(200,80,0,0.95)';
          c2.fillText(colNames[j],px+10,py);
        });
      }
      c2.restore();
    }
  };

  // 矢印プラグイン
  const colArrowPlugin={
    id:'colArrows_sym',
    afterDraw(chart){
      if(!document.getElementById('sym-col-arrow')?.checked) return;
      const c2=chart.ctx;
      const xs=chart.scales.x, ys=chart.scales.y;
      const ox=xs.getPixelForValue(0), oy=ys.getPixelForValue(0);
      c2.save();
      res.colCoords.forEach((coord,j)=>{
        const ex=xs.getPixelForValue(coord[0]);
        const ey=ys.getPixelForValue(coord[1]||0);
        const dx=ex-ox, dy=ey-oy;
        const len=Math.sqrt(dx*dx+dy*dy)||1;
        // 線
        c2.beginPath(); c2.moveTo(ox,oy); c2.lineTo(ex,ey);
        c2.strokeStyle='rgba(200,80,0,0.85)';
        c2.lineWidth=2; c2.stroke();
        // 矢頭
        const ah=10,aw=5,ux=dx/len,uy=dy/len;
        c2.beginPath();
        c2.moveTo(ex,ey);
        c2.lineTo(ex-ah*ux+aw*uy, ey-ah*uy-aw*ux);
        c2.lineTo(ex-ah*ux-aw*uy, ey-ah*uy+aw*ux);
        c2.closePath();
        c2.fillStyle='rgba(200,80,0,0.85)'; c2.fill();
        // ラベル
        if(document.getElementById('sym-col-lbl')?.checked){
          c2.font='bold 12px Helvetica Neue,Arial,sans-serif';
          c2.textBaseline='middle';
          const lx=ex+(dx/len)*14, ly=ey+(dy/len)*14;
          const tw=c2.measureText(colNames[j]).width;
          c2.fillStyle='rgba(255,255,255,0.88)';
          c2.fillRect(lx-3,ly-9,tw+6,18);
          c2.fillStyle='rgba(180,50,0,0.95)';
          c2.fillText(colNames[j],lx,ly);
        }
      });
      c2.restore();
    }
  };

  const symChart=new Chart(symCtx,{
    type:'scatter',
    data:{datasets:[
      {label:t('rowCat'),
       data:res.rowCoords.map((c,i)=>({x:c[0],y:c[1]||0,label:rowNames[i]})),
       backgroundColor:'rgba(14,124,90,0.7)',
       pointRadius:7, pointHoverRadius:9,
       borderColor:'rgba(14,124,90,0.95)',borderWidth:1.5,
       pointStyle:'circle'},
      {label:t('colCat'),
       data:res.colCoords.map((c,j)=>({x:c[0],y:c[1]||0,label:colNames[j]})),
       backgroundColor: showArrow?'rgba(0,0,0,0)':'rgba(200,80,0,0.7)',
       pointRadius:     showArrow?0:7,
       pointHoverRadius:showArrow?4:9,
       borderColor:'rgba(200,80,0,0.95)',borderWidth:1.5,
       pointStyle:'triangle'},
    ]},
    plugins:[crosshairPlugin, symLblPlugin, colArrowPlugin],
    options:makeChartOptions(ax1, ax2, range, range, {})
  });
  caCharts.push(symChart);
}

function getAxisIndices(){
  const x = +(document.getElementById('axis-x')?.value ?? 0);
  const y = +(document.getElementById('axis-y')?.value ?? 1);
  // 同じ軸が選ばれている場合の保護
  if(x === y) return {x, y: y === 0 ? 1 : 0};
  return {x, y};
}

function drawAllCharts(res, ndim){
  window._caLastRes=res; window._caLastNdim=ndim;
  window._caRowNames=rowNames; window._caColNames=colNames;
  destroyCharts();

  // 軸選択セレクトのoptions更新
  const _axX=document.getElementById('axis-x');
  const _axY=document.getElementById('axis-y');
  if(_axX && _axY){
    const _prevX=+(_axX.value||0), _prevY=+(_axY.value||1);
    const _opts=Array.from({length:res.ndim},(_,i)=>
      `<option value="${i}">${t('dimOpt',i+1)}</option>`).join('');
    _axX.innerHTML=_opts;
    _axY.innerHTML=_opts;
    _axX.value=String(Math.min(_prevX, res.ndim-1));
    _axY.value=String(Math.min(_prevY, res.ndim-1));
    if(_axX.value===_axY.value) _axY.value=_axX.value==='0'?'1':'0';
  }

  // 軸選択セレクトを初期化（初回または次元数変化時）
  const axX=document.getElementById('axis-x');
  const axY=document.getElementById('axis-y');
  if(axX && axY){
    const prevX=+axX.value, prevY=+axY.value;
    const opts=Array.from({length:res.ndim},(_,i)=>
      `<option value="${i}">${t('dimOpt',i+1)}</option>`).join('');
    axX.innerHTML=opts;
    axY.innerHTML=opts;
    axX.value = Math.min(prevX, res.ndim-1);
    axY.value = Math.min(prevY, res.ndim-1);
    if(axX.value===axY.value) axY.value = axX.value==='0'?'1':'0';
  }

  redrawAllPlots(res);
}

function redrawAllPlots(res){
  if(!res) return;
  // 既存チャートをすべて破棄して再描画
  destroyCharts();
  const {x:xi, y:yi} = getAxisIndices();

  const ax1=t('axisT',xi+1,pct(res.contrib[xi]||0));
  const ax2=t('axisT',yi+1,pct(res.contrib[yi]||0));
  const range=axisRange(
    res.rowCoords.map(c=>[c[xi]||0, c[yi]||0]),
    res.colCoords.map(c=>[c[xi]||0, c[yi]||0])
  );

  // ① 対称マップ
  redrawSymMap(res, window._caLastNdim, xi, yi, ax1, ax2, range);

  // ② 行プロット
  const rowCtx=document.getElementById('row-canvas');
  if(rowCtx){
    const rowLblPlugin=makeLabelPlugin('row-lbl', null,
      res.rowCoords.map(c=>[c[xi]||0, c[yi]||0]),
      null, rowNames, colNames, 'row-font-size');
    const rowChart=new Chart(rowCtx,{
      type:'scatter',
      data:{datasets:[{
        label:t('rowCat'),
        data:res.rowCoords.map((c,i)=>({x:c[xi]||0,y:c[yi]||0,label:rowNames[i]})),
        backgroundColor:'rgba(14,124,90,0.7)',
        pointRadius:7, pointHoverRadius:9,
        borderColor:'rgba(14,124,90,0.95)',borderWidth:1.5
      }]},
      plugins:[crosshairPlugin, rowLblPlugin],
      options:makeChartOptions(ax1, ax2, range, range, {})
    });
    caCharts.push(rowChart);
  }

  // ③ 列プロット
  const colCtx=document.getElementById('col-canvas');
  if(colCtx){
    const colLblPlugin=makeLabelPlugin('col-lbl', null,
      res.colCoords.map(c=>[c[xi]||0, c[yi]||0]),
      null, colNames, rowNames, 'col-font-size');
    const colChart=new Chart(colCtx,{
      type:'scatter',
      data:{datasets:[{
        label:t('colCat'),
        data:res.colCoords.map((c,j)=>({x:c[xi]||0,y:c[yi]||0,label:colNames[j]})),
        backgroundColor:'rgba(200,80,0,0.7)',
        pointRadius:7, pointHoverRadius:9,
        borderColor:'rgba(200,80,0,0.95)',borderWidth:1.5,
        pointStyle:'triangle'
      }]},
      plugins:[crosshairPlugin, colLblPlugin],
      options:makeChartOptions(ax1, ax2, range, range, {})
    });
    caCharts.push(colChart);
  }
}

function onAxisChange(){
  if(window._caLastRes) redrawAllPlots(window._caLastRes);
}

function updateCharts(){
  if(window._caLastRes) redrawAllPlots(window._caLastRes);
}

// ─── CSV download ───
function downloadCoords(){
  const res=window._caRes;
  const ndim=window._caNdim;
  if(!res) return;
  const snap=window._caSnap||{rowNames,colNames};
  const rowNames_=snap.rowNames, colNames_=snap.colNames;

  const dimHdr=Array.from({length:ndim},(_,d)=>t('dimLbl',d+1));
  const lines=[t('csvRowT')];
  lines.push([t('csvCat'), ...dimHdr].join(','));
  rowNames_.forEach((nm,i)=>{
    lines.push([nm, ...Array.from({length:ndim},(_,d)=>res.rowCoords[i][d].toFixed(4))].join(','));
  });
  lines.push('');
  lines.push(t('csvColT'));
  lines.push([t('csvCat'), ...dimHdr].join(','));
  colNames_.forEach((nm,j)=>{
    lines.push([nm, ...Array.from({length:ndim},(_,d)=>res.colCoords[j][d].toFixed(4))].join(','));
  });

  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ca_coordinates.csv'; a.click();
}

// ─── tabs ───
function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add('active');
  document.getElementById(`panel-${id}`).classList.add('active');
}

// ─── language switch: re-render everything from stored state ───
const UI_IDS=['axis-x','axis-y','sym-row-lbl','sym-col-lbl','sym-col-arrow','sym-font-size','row-lbl','row-font-size','col-lbl','col-font-size'];
function captureUI(){
  const o={};
  UI_IDS.forEach(id=>{const e=document.getElementById(id); if(e) o[id]=(e.type==='checkbox')?e.checked:e.value;});
  return o;
}
function restoreUI(o){
  UI_IDS.forEach(id=>{const e=document.getElementById(id); if(e&&o[id]!==undefined){ if(e.type==='checkbox') e.checked=o[id]; else e.value=o[id]; }});
}
function fillAxisSelects(res){
  ['axis-x','axis-y'].forEach(id=>{
    const e=document.getElementById(id);
    if(e) e.innerHTML=Array.from({length:res.ndim},(_,i)=>`<option value="${i}">${t('dimOpt',i+1)}</option>`).join('');
  });
}
function onLangChange(){
  const ta=document.getElementById('csv-input');
  const ei=exampleIndex(ta.value);
  const hadResult=!!window._caSnap;
  let reran=false;
  if(ei&&ta.value!==exText(ei)){
    ta.value=exText(ei);
    parseCSV();
    if(hadResult){ runCA({keepTab:true,ui:captureUI()}); reran=true; }
  }
  renderParseInfo();
  paintErr();
  if(hadResult&&!reran){
    const res=window._caRes, ui=captureUI();
    document.getElementById('result-content').innerHTML=buildResultHTML(window._caSnap,res);
    fillAxisSelects(res);
    restoreUI(ui);
    redrawAllPlots(res);
  }
  const rt=document.getElementById('rs-text');
  if(rt&&rt.value) rsMake();
}

// ───────── R script output (check) ─────────
function rsRaw(text){
  let d='---';
  while(text.indexOf(')'+d+'"')>=0) d+='-';
  return 'r"'+d+'(\n'+text.replace(/\r\n?/g,'\n').replace(/\s+$/,'')+'\n)'+d+'"';
}
const RS_FAIL={ja:'# スクリプトを作成できませんでした',en:'# Could not create the script'};
function rsHeader(title, pkgLines){
  const L=(LANG==='ja')?[
    '# =====================================================================',
    '# '+title,
    '# このスクリプトは、アプリに入力したデータと設定をそのまま埋め込んであります。',
    '# RStudioに貼り付けて、上から順に実行してください。',
    '# 日本語が文字化けするときは、RStudioの File > Reopen with Encoding > UTF-8 で開き直してください。',
    '# ====================================================================='
  ]:[
    '# =====================================================================',
    '# '+title,
    '# This script embeds the data and settings you entered in the app.',
    '# Paste it into RStudio and run it from top to bottom.',
    '# ====================================================================='
  ];
  if(pkgLines&&pkgLines.length){ L.push('',(LANG==='ja'?'# 初回だけ、必要なパッケージをインストールしてください（先頭の # を外して実行）':'# Install the required package once (remove the leading # and run)')); pkgLines.forEach(p=>L.push(p)); }
  return L;
}
function rsMake(){
  const ta=document.getElementById('rs-text');
  try{ ta.value=buildRScript(); }
  catch(e){ ta.value=RS_FAIL[LANG]+': '+e.message; }
}
function rsFailed(v){ return v.indexOf(RS_FAIL.ja)===0||v.indexOf(RS_FAIL.en)===0; }
function rsCopy(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(()=>{}); }
  const b=document.getElementById('rs-copy-btn');
  b.textContent=t('copied'); setTimeout(()=>{b.textContent=t('rsCopy');},1500);
}
function rsDownload(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  const b64=btoa(unescape(encodeURIComponent('﻿'+ta.value)));
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8;base64,'+b64;
  a.download=RS_FILENAME;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
const RS_FILENAME='correspondence_analysis_check.R';
function buildRScript(){
  const text=document.getElementById('csv-input').value.trim();
  if(!text) throw new Error(t('errRsNoData'));
  if(!N||!contingency.length) throw new Error(t('errRsParse'));
  const coord=document.getElementById('coord-type').value;
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  const ja=(LANG==='ja');
  const L=rsHeader(ja?'コレスポンデンス分析: アプリ(ca.html)と同じ計算をRで行う（caパッケージ）'
                     :'Correspondence analysis: the same calculation as the app (ca.html), in R (ca package)',
    ['# install.packages("ca")']);
  L.push('',
    'library(ca)',
    '',
    ja?'# 1. クロス集計表（行=行カテゴリ、列=列カテゴリ、セルは度数）':'# 1. Cross-tabulation (rows = row categories, columns = column categories, cells = frequencies)',
    'tab <- as.matrix(read.csv(text = '+rsRaw(lines.join('\n'))+',',
    '                          header = TRUE, row.names = 1, check.names = FALSE))',
    '',
    ja?'# 2. コレスポンデンス分析（特異値分解）':'# 2. Correspondence analysis (singular value decomposition)',
    'res <- ca(tab)',
    ja?'try(print(summary(res)), silent = TRUE)   # 質量、慣性、寄与度など（次元が1つだけの表では表示できません）'
      :'try(print(summary(res)), silent = TRUE)   # masses, inertias, contributions, etc. (cannot be shown for a table with only one dimension)',
    '',
    ja?'# 3. 慣性（固有値）と寄与率（アプリの「慣性・寄与率」タブに対応）':'# 3. Inertia (eigenvalues) and proportions (corresponds to the "Inertia and proportion explained" card of the app)',
    'inertia <- res$sv^2',
    'print(data.frame(dim = seq_along(inertia), sv = res$sv, inertia = inertia,',
    '                 contribution = inertia / sum(inertia), cumulative = cumsum(inertia) / sum(inertia)))',
    ja?'cat("総慣性:", sum(inertia), "\\n")':'cat("Total inertia:", sum(inertia), "\\n")',
    '',
    ja?'# 4. カイ二乗検定（アプリの カイ二乗 = 総慣性 x 総度数、自由度 (行-1) x (列-1) と同じ）'
      :'# 4. Chi-square test (as in the app: chi-square = total inertia x total frequency, df = (rows - 1) x (columns - 1))',
    'chi <- suppressWarnings(chisq.test(tab))',
    'print(c(chisq = unname(chi$statistic), df = unname(chi$parameter), p = chi$p.value))',
    '',
    ja?'# 5. 座標（アプリの「座標」タブに対応。符号は向きが逆になることがあります）'
      :'# 5. Coordinates (corresponds to the coordinate tables of the app; the sign of an axis may be reversed)',
    ja?'#    標準座標: res$rowcoord / res$colcoord   主座標: 標準座標 x 特異値'
      :'#    Standard coordinates: res$rowcoord / res$colcoord   Principal coordinates: standard coordinates x singular values');
  L.push('row_principal <- sweep(res$rowcoord, 2, res$sv, "*")',
    'col_principal <- sweep(res$colcoord, 2, res$sv, "*")',
    'print(round(row_principal, 4)); print(round(col_principal, 4))');
  if(coord==='row') L.push(ja?'# アプリの設定は「行主体」: 行=主座標、列=標準座標':'# App setting is "Row principal": rows = principal coordinates, columns = standard coordinates','if (length(res$sv) >= 2) plot(res, map = "rowprincipal")');
  else if(coord==='col') L.push(ja?'# アプリの設定は「列主体」: 行=標準座標、列=主座標':'# App setting is "Column principal": rows = standard coordinates, columns = principal coordinates','if (length(res$sv) >= 2) plot(res, map = "colprincipal")');
  else L.push(ja?'# アプリの設定は「対称マップ」: 行・列とも主座標':'# App setting is "Symmetric map": rows and columns both in principal coordinates',
    ja?'if (length(res$sv) >= 2) plot(res, map = "symmetric")   # 次元が1つだけの表ではマップを描けません':'if (length(res$sv) >= 2) plot(res, map = "symmetric")   # a map cannot be drawn for a table with only one dimension');
  return L.join('\n')+'\n';
}
