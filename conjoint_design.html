// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}

  const from=LANG==='en'?XJ2E:XE2J, re=LANG==='en'?I18N.ja:I18N.en;

  document.querySelectorAll('.tab').forEach((tb,i)=>tb.classList.toggle('active',names[i]===name));

  // 既存の値を先に読み取って保存（G.attrs をリセットする前に）

  wrap.innerHTML='';
  G.attrs=[];
  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px';
  for(let i=0;i<n;i++){
    const prev=(old&&old[i]&&old[i].levels)?old[i]:{name:t('defAttr',i),levels:[t('defLvl',1),t('defLvl',2)]};
    const div=document.createElement('div');
    div.className='attr-block';
    div.innerHTML=`<h3 data-t="attrH" data-a="${i+1}">${t('attrH',i+1)}</h3>
      <div style="margin-bottom:8px">
        <label style="text-transform:none;letter-spacing:0;font-size:11px" data-t="attrName">${t('attrName')}</label>
        <input type="text" id="attr-name-${i}" value="${prev.name}" data-tp="phAttr" placeholder="${t('phAttr')}">
      </div>
      <label style="text-transform:none;letter-spacing:0;font-size:11px" data-t="nLvlLbl">${t('nLvlLbl')}</label>
      <select id="attr-nlvl-${i}" onchange="updateLevelInputs(${i})" style="margin-bottom:8px">
        <option value="2" data-t="nLvlOpt" data-a="2" ${prev.levels.length===2?'selected':''}>${t('nLvlOpt',2)}</option>
        <option value="3" data-t="nLvlOpt" data-a="3" ${prev.levels.length===3?'selected':''}>${t('nLvlOpt',3)}</option>
        <option value="4" data-t="nLvlOpt" data-a="4" ${prev.levels.length===4?'selected':''}>${t('nLvlOpt',4)}</option>
      </select>
      <div id="lvl-inputs-${i}"></div>`;
    grid.appendChild(div);
    G.attrs.push({});
  }
  wrap.appendChild(grid);

function updateLevelInputs(i, prevLevels){
  const n=+document.getElementById(`attr-nlvl-${i}`).value;
  const wrap=document.getElementById(`lvl-inputs-${i}`);
  wrap.innerHTML='';
  for(let j=0;j<n;j++){
    const prev=prevLevels?.[j]||t('defLvl',j+1);
    const div=document.createElement('div');
    div.className='level-input';
    div.innerHTML=`<span class="lbl" data-t="lvlLbl" data-a="${j+1}">${t('lvlLbl',j+1)}</span>
      <input type="text" id="lvl-${i}-${j}" value="${prev}" data-tp="phLvl" placeholder="${t('phLvl')}">`;
    wrap.appendChild(div);
  }
}

function getAttrsFromDOM(){
  try{
    const n=+document.getElementById('n-attr').value;
    const attrs=[];
    for(let i=0;i<n;i++){
      const nameEl=document.getElementById(`attr-name-${i}`);
      const nlvlEl=document.getElementById(`attr-nlvl-${i}`);
      if(!nameEl||!nlvlEl) return null;
      const name=nameEl.value.trim()||t('defAttr',i);
      const nlvl=+nlvlEl.value;
      const levels=[];
      for(let j=0;j<nlvl;j++){
        const el=document.getElementById(`lvl-${i}-${j}`);
        levels.push(el?el.value.trim()||t('defLvl',j+1):t('defLvl',j+1));
      }
      attrs.push({name, levels});
    }
    return attrs;
  }catch(e){ return null; }
}

function getAttrs(){
  const n=+document.getElementById('n-attr').value;
  const attrs=[];
  for(let i=0;i<n;i++){
    const name=document.getElementById(`attr-name-${i}`).value.trim()||t('defAttr',i);
    const nlvl=+document.getElementById(`attr-nlvl-${i}`).value;
    const levels=[];
    for(let j=0;j<nlvl;j++){
      levels.push(document.getElementById(`lvl-${i}-${j}`).value.trim()||t('defLvl',j+1));
    }
    attrs.push({name, levels});
  }
  return attrs;
}

// ─── 直交配列の選択 ───
function selectOA(attrs){
  const levelCounts=attrs.map(a=>a.levels.length);
  const maxL=Math.max(...levelCounts);
  const n=attrs.length;
  const n2=levelCounts.filter(l=>l===2).length;
  const n3=levelCounts.filter(l=>l===3).length;

  // 2水準のみ
  if(maxL===2){
    if(n<=3) return {oa:'L4', type:'pure2'};
    if(n<=7) return {oa:'L8', type:'pure2'};
    if(n<=11) return {oa:'L12', type:'pure2'};
    if(n<=15) return {oa:'L16', type:'pure2'};
    return null;
  }

  // 3水準のみ
  if(maxL===3 && n2===0){
    if(n<=4) return {oa:'L9', type:'pure3'};
    if(n<=13) return {oa:'L27', type:'pure3'};
    return null;
  }

  // 混合：3水準 + 2水準
  if(maxL===3){
    // 3水準1個+2水準k個 → OA12専用配列（完全直交）
    if(n3===1 && n2<=3) return {oa:'OA12_3_2x3', type:'prebuilt'};
    if(n3===1 && n2<=4) return {oa:'OA12_3_2x4', type:'prebuilt'};
    // 3水準2個以上+2水準 → L9ベース（近似直交、実務標準）
    if(n<=4) return {oa:'L9', type:'mixed'};
    // L18: 2水準1個+3水準≤7個 → 完全直交
    if(n2<=1 && n3<=7) return {oa:'L18', type:'L18mix'};
    // 2水準複数: L18の3水準列をmod2で縮退（近似直交）
    if(n<=8) return {oa:'L18', type:'L18mod'};
    return null;
  }

  // 4水準を含む（疑似4水準: 2列の2水準で表現）→ L16
  if(maxL===4 && levelCounts.every(l=>l===2||l===4) && 3*levelCounts.filter(l=>l===4).length+n2<=15) return {oa:'L16',type:'pseudo4'};

  return null;
}


// ─── 直交計画の生成 ───
// 配列の選び方・列の割り当ては、元のツールと同じ(そのままコピー)
function computeProfiles(attrs,sel){
  let profiles=[];
  const {oa:oaKey, type:oaType}=sel;
  const baseOA=OA[oaKey];

  if(oaType==='prebuilt'){
    // 専用混合直交配列（OA12など）：属性順に列を割り当て
    // 3水準属性を先頭に配置（OAの最初の列が3水準）
    const sorted=[...attrs.map((a,i)=>({...a,origIdx:i}))].sort((a,b)=>b.levels.length-a.levels.length);
    const colMap=new Array(attrs.length);
    sorted.forEach((a,col)=>colMap[a.origIdx]=col);
    for(const row of baseOA.array){
      const p=new Array(attrs.length);
      attrs.forEach((_,i)=>p[i]=row[colMap[i]]);
      profiles.push(p);
    }
  } else if(oaType==='pure2'||oaType==='pure3'){
    // そのまま使用（属性順に列を割り当て）
    const cols=Array.from({length:attrs.length},(_,i)=>i);
    for(const row of baseOA.array){
      profiles.push(cols.map((c,i)=>row[c]%attrs[i].levels.length));
    }

  } else if(oaType==='mixed'){
    // L9の4列を使い、水準数に応じてmod
    // 3水準属性を先に、2水準属性を後に割り当て
    const sorted=[...attrs.map((a,i)=>({...a,origIdx:i}))].sort((a,b)=>b.levels.length-a.levels.length);
    const colMap=new Array(attrs.length);
    sorted.forEach((a,col)=>colMap[a.origIdx]=col);
    for(const row of baseOA.array){
      const p=new Array(attrs.length);
      attrs.forEach((_,i)=>p[i]=row[colMap[i]]%attrs[i].levels.length);
      profiles.push(p);
    }

  } else if(oaType==='L18mix'){
    // L18: col0=2水準, col1-7=3水準
    // 2水準属性→列0、3水準属性→列1,2,3,...
    let c2=0, c3=1;
    const cols=attrs.map(a=>a.levels.length===2?c2++:c3++);
    for(const row of baseOA.array){
      profiles.push(cols.map((c,i)=>row[c]%attrs[i].levels.length));
    }

  } else if(oaType==='L18mod'){
    // L18の3水準列をすべて使い、2水準属性はmod2で縮退
    // 2水準が多い場合: 3水準属性→col1、2水準1個→col0、残り2水準→col2以降mod2
    const sorted=[...attrs.map((a,i)=>({...a,origIdx:i}))].sort((a,b)=>b.levels.length-a.levels.length);
    const colMap=new Array(attrs.length);
    let c3=1, c2=0, usedC0=false;
    for(const a of sorted){
      if(a.levels.length===3){ colMap[a.origIdx]=c3++; }
      else if(!usedC0){ colMap[a.origIdx]=0; usedC0=true; }
      else { colMap[a.origIdx]=c3++; }
    }
    // 18行そのまま出力（重複があっても直交性近似のため許容）
    for(const row of baseOA.array){
      profiles.push(colMap.map((c,i)=>row[c]%attrs[i].levels.length));
    }

  } else if(oaType==='pseudo4'){
    // 4水準属性は L16 の独立な2列(j1,j2)と、その交互作用列(j1 xor j2)の3列を専有する（完全直交）
    const used=new Set(), attrCols=new Array(attrs.length);
    const n4idx=attrs.map((a,i)=>a.levels.length===4?i:-1).filter(i=>i>=0);
    const lines=[];
    (function dfs(t){
      if(t===n4idx.length) return true;
      for(let j1=1;j1<=15;j1++) for(let j2=j1+1;j2<=15;j2++){
        const j3=j1^j2;
        if(used.has(j1)||used.has(j2)||used.has(j3)) continue;
        used.add(j1);used.add(j2);used.add(j3); lines[t]=[j1,j2];
        if(dfs(t+1)) return true;
        used.delete(j1);used.delete(j2);used.delete(j3);
      }
      return false;
    })(0);
    n4idx.forEach((ai,t)=>attrCols[ai]=lines[t]);
    let nextCol=1;
    attrs.forEach((a,i)=>{ if(a.levels.length===2){ while(used.has(nextCol)) nextCol++; used.add(nextCol); attrCols[i]=[nextCol]; } });
    for(const row of baseOA.array){
      profiles.push(attrCols.map(cs=> cs.length===2 ? row[cs[0]-1]*2+row[cs[1]-1] : row[cs[0]-1]));
    }
  }

  return profiles;
}

function mkDummyHeaders(attrs){
  const h=[];
  for(let i=0;i<attrs.length;i++){
    // 最初の水準を基準として残りをダミー化
    for(let j=1;j<attrs[i].levels.length;j++){
      h.push(t('dummyHdr',attrs[i].name,attrs[i].levels[j]));
    }
  }
  return h;
}

function generateDesign(){
  clearErr();
  const attrs=getAttrs();
  G.attrs=attrs;

  const sel=selectOA(attrs);
  if(!sel){
    showErr(()=>t('errNoOA'));
    return;
  }

  const oaType=sel.type;
  const profiles=computeProfiles(attrs,sel);

  G.profiles=profiles;
  G.oa=sel.oa;
  G.oaType=oaType;

  // ダミー変数の計算
  const dummies=[];
  G.dummyHeaders=mkDummyHeaders(attrs);

  for(const p of profiles){
    const row=[];
    for(let i=0;i<attrs.length;i++){
      for(let j=1;j<attrs[i].levels.length;j++){
        row.push(p[i]===j?1:0);
      }
    }
    dummies.push(row);
  }
  G.dummies=dummies;

  // 描画
  renderProfileTable();
  renderDummyTable();
  renderCards();
  renderDesignInfo();
  document.getElementById('result-card').style.display='block';
  switchTab('profiles');
  document.getElementById('result-card').scrollIntoView({behavior:'smooth'});
}

function renderDesignInfo(){
  const {attrs,profiles,oa,oaType}=G;
  // 直交性タイプに応じた注記
  const orthoNote=
    oaType==='prebuilt'?t('nFull'):
    oaType==='pure2'||oaType==='pure3'||oaType==='pseudo4'?t('nFull'):
    oaType==='L18mix'?t('nFull'):
    oaType==='mixed'?t('nMixed'):
    oaType==='L18mod'?t('nL18mod'):'';
  document.getElementById('design-info').innerHTML=
    t('infoOA',oa,profiles.length,attrs.length,attrs.map(a=>a.levels.length).join('×'),orthoNote);
}

function downloadCSV(type){
  const {attrs,profiles,dummies,dummyHeaders}=G;
  const rows=[];
  if(type==='profiles'){
    rows.push([t('thProfNo'),...attrs.map(a=>a.name),t('thRank'),t('thScore')].join(','));

      rows.push([t('profRow',i+1),...p.map((vi,ai)=>attrs[ai].levels[vi]),'',''].join(','));
    });
  } else {
    rows.push([t('thProfNo'),...attrs.map(a=>a.name),...dummyHeaders,t('thRank'),t('thScore')].join(','));
    profiles.forEach((p,i)=>{
      rows.push([t('profRow',i+1),
        ...p.map((vi,ai)=>attrs[ai].levels[vi]),
        ...dummies[i],'',''].join(','));

  }
  const bom='﻿';
  const b64=btoa(unescape(encodeURIComponent(bom+rows.join('\n'))));
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8;base64,'+b64;

// ─── 直交性チェック ───
function renderOrthoCheck(){
  const {attrs, profiles}=G;
  if(!profiles||profiles.length===0) return;
  const n=attrs.length;
  const wrap=document.getElementById('ortho-wrap');

  let allOK=true;
  let html='';

  // 重複プロファイルチェック（L18mod使用時のみ発生しうる）
  const pKeys=profiles.map(p=>p.join(','));
  const dupes=pKeys.filter((k,i)=>pKeys.indexOf(k)!==i);
  if(dupes.length>0){
    allOK=false;
    html+=`<div style="padding:10px 14px;background:#fff3e0;border-left:4px solid #e05c2a;
           border-radius:6px;margin-bottom:12px;font-size:12px">
      ${t('dupWarn',dupes.length)}
    </div>`;
  }

  // 各属性ペアのクロス集計
  html+=`<div class="note" style="margin-bottom:12px">
    ${t('orthoNote')}
  </div>`;

  // 各属性の水準出現回数（周辺度数）
  html+=`<h3 style="font-size:13px;font-weight:700;margin-bottom:8px">${t('h1Freq')}</h3>`;
  html+=`<div class="tbl-wrap"><table><thead><tr>
    <th class="left">${t('thAttr')}</th><th class="left">${t('thLevel')}</th><th>${t('thCount')}</th><th>${t('thExp')}</th><th>${t('thJudge')}</th>
  </tr></thead><tbody>`;

  const expected=profiles.length;
  attrs.forEach((attr,i)=>{
    const counts=new Array(attr.levels.length).fill(0);
    profiles.forEach(p=>counts[p[i]]++);
    const exp=profiles.length/attr.levels.length;
    attr.levels.forEach((lv,j)=>{
      const ok=Math.abs(counts[j]-exp)<0.5;
      if(!ok) allOK=false;
      html+=`<tr>
        <td class="left">${j===0?`<b>${attr.name}</b>`:''}</td>
        <td class="left">${lv}</td>
        <td>${counts[j]}</td>
        <td>${exp%1===0?exp:exp.toFixed(2)}</td>
        <td style="color:${ok?'#0e7c5a':'#c0392b'};font-weight:700">${ok?t('okMark'):t('unbal')}</td>
      </tr>`;
    });
  });
  html+=`</tbody></table></div>`;

  // 属性ペアのクロス集計
  html+=`<h3 style="font-size:13px;font-weight:700;margin:16px 0 8px">${t('h2Cross')}</h3>`;

  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const cross={};
      attrs[i].levels.forEach((_,li)=>{
        attrs[j].levels.forEach((_,lj)=>{
          cross[`${li}-${lj}`]=0;
        });
      });
      profiles.forEach(p=>cross[`${p[i]}-${p[j]}`]++);

      const vals=Object.values(cross);
      const mn=Math.min(...vals), mx=Math.max(...vals);
      const diff=mx-mn;
      const isOK=diff<=1;
      const isApprox=diff<=2;
      if(!isOK) allOK=false;

      const statusColor=diff===0?'#0e7c5a':diff<=1?'#185FA5':diff<=2?'#e05c2a':'#c0392b';
      const statusText=diff===0?t('stFull'):diff<=1?t('stOrth1'):diff<=2?t('stApprox'):t('stNon',diff);

      html+=`<div style="margin-bottom:14px">
        <div style="font-size:12px;font-weight:700;margin-bottom:6px;
                    display:flex;align-items:center;gap:8px">
          <span>${attrs[i].name} × ${attrs[j].name}</span>
          <span style="color:${statusColor};font-size:13px">${statusText}</span>
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th></th>`;
      attrs[j].levels.forEach(lv=>html+=`<th>${lv}</th>`);
      html+=`<th style="background:#555">${t('total')}</th></tr></thead><tbody>`;

      attrs[i].levels.forEach((lvi,li)=>{
        const rowTotal=attrs[j].levels.reduce((s,_,lj)=>s+cross[`${li}-${lj}`],0);
        html+=`<tr><td class="left"><b>${lvi}</b></td>`;
        attrs[j].levels.forEach((_,lj)=>{
          const v=cross[`${li}-${lj}`];
          const cellOK=mx-mn<=1;
          html+=`<td style="background:${cellOK?'#e8f5f0':'#fdf0ee'};font-weight:600">${v}</td>`;
        });
        html+=`<td style="background:#f4f6f9;font-weight:700">${rowTotal}</td></tr>`;
      });

      // 列合計
      html+=`<tr><td class="left" style="font-weight:700">${t('total')}</td>`;
      attrs[j].levels.forEach((_,lj)=>{
        const colTotal=attrs[i].levels.reduce((s,_,li)=>s+cross[`${li}-${lj}`],0);
        html+=`<td style="background:#f4f6f9;font-weight:700">${colTotal}</td>`;
      });
      html+=`<td style="background:#e0e4ea;font-weight:700">${profiles.length}</td></tr>`;
      html+=`</tbody></table></div></div>`;
    }
  }

  // 総合判定
  const summaryColor=allOK?'#0e7c5a':'#e05c2a';
  const summaryBg=allOK?'#e8f5f0':'#fff3e0';
  const summaryText=allOK?t('sumOK'):t('sumNG');

  html=`<div style="padding:12px 16px;background:${summaryBg};border-radius:6px;
         border-left:4px solid ${summaryColor};margin-bottom:16px;
         font-size:13px;font-weight:600;color:${summaryColor}">${summaryText}</div>`+html;

  wrap.innerHTML=html;
}

// ───────── Rスクリプト出力（検算用）の共通部品 ─────────
function rsRaw(text){
  // R 4.0以降の raw string: r"---( ... )---"
  let d='---';
  while(text.indexOf(')'+d+'"')>=0) d+='-';
  return 'r"'+d+'(\n'+text.replace(/\r\n?/g,'\n').replace(/\s+$/,'')+'\n)'+d+'"';
}
const RS_FAIL={ja:'# スクリプトを作成できませんでした',en:'# Could not create the script'};
function rsHeader(title, pkgLines){
  const L=(LANG==='ja')?[
    '# =====================================================================',
    '# '+title,
    '# このスクリプトは、アプリに入力したデータと設定をそのまま埋め込んであります。',
    '# RStudioに貼り付けて、上から順に実行してください。',
    '# 日本語が文字化けするときは、RStudioの File > Reopen with Encoding > UTF-8 で開き直してください。',
    '# ====================================================================='
  ]:[
    '# =====================================================================',
    '# '+title,
    '# This script embeds the data and settings you entered in the app.',
    '# Paste it into RStudio and run it from top to bottom.',
    '# ====================================================================='
  ];
  if(pkgLines&&pkgLines.length){ L.push('',(LANG==='ja'?'# 初回だけ、必要なパッケージをインストールしてください（先頭の # を外して実行）':'# Install the required package once (remove the leading # and run)')); pkgLines.forEach(p=>L.push(p)); }
  return L;
}
function rsMake(){
  const ta=document.getElementById('rs-text');
  try{ ta.value=buildRScript(); }
  catch(e){ ta.value=RS_FAIL[LANG]+': '+e.message; }
}
function rsFailed(v){ return v.indexOf(RS_FAIL.ja)===0||v.indexOf(RS_FAIL.en)===0; }
function rsCopy(){
  const ta=document.getElementById('rs-text');
  rsMake();   // 入力が変わっていてもよいよう、毎回作り直す
  if(rsFailed(ta.value)) return;
  ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(()=>{}); }
  const b=document.getElementById('rs-copy-btn');
  b.textContent=t('copied'); setTimeout(()=>{b.textContent=t('rsCopy');},1500);
}
function rsDownload(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  const b64=btoa(unescape(encodeURIComponent('﻿'+ta.value)));
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8;base64,'+b64;
  a.download=RS_FILENAME;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
const RS_FILENAME='conjoint_design_check.R';
function buildRScript(){
  if(!G.profiles||!G.profiles.length) throw new Error(t('errNoDesign'));
  const ja=(LANG==='ja');
  const attrs=G.attrs, prof=G.profiles;
  const q=s=>'"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
  const L=rsHeader(ja?'コンジョイント分析の直交計画: アプリ(conjoint_design.html)が作った計画をRで検査する（標準関数のみ）'
                     :'Orthogonal design for conjoint analysis: check the design created by the app (conjoint_design.html) in R (base functions only)');
  L.push('',
    (ja?'# 1. アプリが生成した計画（プロファイル x 属性）。使用した直交配列: ':'# 1. The design generated by the app (profiles x attributes). Orthogonal array used: ')+(G.oa||'-')+(ja?'、プロファイル数: ':', number of profiles: ')+prof.length,
    'design <- data.frame(');
  attrs.forEach((a,i)=>{
    const col=prof.map(p=>q(a.levels[p[i]])).join(', ');
    L.push('  '+q(a.name)+' = factor(c('+col+'), levels = c('+a.levels.map(q).join(', ')+'))'+(i<attrs.length-1?',':''));
  });
  L.push('  , check.names = FALSE)',
    'print(design)',
    '',
    ja?'# 2. 各水準が何回ずつ現れるか':'# 2. How many times each level appears',
    'for (nm in names(design)) { cat("\\n", nm, "\\n"); print(table(design[[nm]])) }',
    '',
    ja?'# 3. 属性のペアごとの直交性（度数が「周辺度数の積 / 全体」に比例していれば直交）'
      :'# 3. Orthogonality for each pair of attributes (orthogonal if the counts are proportional to "product of the marginal counts / total")',
    'is_orth <- function(a, b) {',
    '  t <- table(a, b); e <- outer(rowSums(t), colSums(t)) / sum(t)',
    ja?'  max(abs(t - e))      # 0なら完全直交。1以下ならほぼ直交':'  max(abs(t - e))      # 0 means fully orthogonal; 1 or less means nearly orthogonal',
    '}',
    'nms <- names(design)',
    'if (length(nms) >= 2) {',
    '  pr <- combn(nms, 2)',
    '  dev <- apply(pr, 2, function(p) is_orth(design[[p[1]]], design[[p[2]]]))',
    ja?'  print(data.frame(属性1 = pr[1, ], 属性2 = pr[2, ], 最大のずれ = round(dev, 4)))'
      :'  print(data.frame(attribute1 = pr[1, ], attribute2 = pr[2, ], max_deviation = round(dev, 4)))',
    '}',
    '',
    ja?'# 4. 主効果が推定できるか（ダミー変数の計画行列のランクが、パラメータ数と同じならOK）'
      :'# 4. Can the main effects be estimated? (OK if the rank of the dummy-coded design matrix equals the number of parameters)',
    'X <- model.matrix(~ ., data = design)',
    ja?'cat("ランク:", qr(X)$rank, " / パラメータ数:", ncol(X), "\\n")':'cat("Rank:", qr(X)$rank, " / Number of parameters:", ncol(X), "\\n")',
    '',
    ja?'# 5. 効果コーディング（各属性で合計0）にしたときの、「異なる属性どうし」の列の相関。'
      :'# 5. Correlations between columns of different attributes under effect coding (sum to zero within each attribute).',
    ja?'#    すべて0なら、属性ごとの効用値は互いに独立に推定できます（同じ属性内の列は、3水準以上だと相関が出ますが問題ありません）'
      :'#    If all are 0, the part-worth utilities of the attributes can be estimated independently of one another (columns within the same attribute may correlate when there are 3 or more levels, which is not a problem)',
    'Xe <- model.matrix(~ ., data = design, contrasts.arg = lapply(design, function(x) "contr.sum"))',
    'grp <- attr(Xe, "assign")[-1]; Ce <- cor(Xe[, -1, drop = FALSE])',
    'cross <- outer(grp, grp, "!=")',
    ja?'cat("異なる属性間の相関の最大値（絶対値）:", round(max(abs(Ce[cross])), 4), "\\n")'
      :'cat("Maximum absolute correlation between different attributes:", round(max(abs(Ce[cross])), 4), "\\n")');
  return L.join('\n')+'\n';
}
