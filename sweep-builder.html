<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}
// =================================================================

// ===================== i18n dictionary =====================
Object.assign(I18N.en,{
  barTitle:"Sweep Builder", disc1:"Yuki Toyoda Laboratory, Graduate School of Innovation Management, Hosei University", disc2:"This is a learning tool. It may contain calculation errors, so please verify the results with other software before using them in research or business.",
  title:"Sweep Builder",
  desc:"Turn a single-threshold QCA setup into ready-to-run ThSQCA sweep code.",
  eyebrow:"ThSQCA · sweep builder",
  h1:"Turn a fixed-threshold QCA setup into sweep code",
  lead:"This app builds ThSQCA (threshold-sweep QCA) code, which runs QCA while sweeping the threshold used to dichotomize a variable into 0 or 1. It assumes that an ordinary QCA with one fixed threshold (<code class=\"mono\">QCA::truthTable()</code> / <code class=\"mono\">minimize()</code>) already works. Before you sweep, confirm that the ordinary analysis runs. For dichotomized data, <a href=\"qca-quickstart.html\">QCA Quickstart</a> can build the code for that check. <br><br>Pick a sweep type, enter the variables and thresholds you already use, and copy the matching <code class=\"mono\">ThSQCA</code> call.",
  sec1:"Sweep type",
  tabOt:"Outcome", tabCts:"Single condition", tabCtm:"Multi condition", tabDt:"Dual",
  tabDesc_ot:"Fix all condition thresholds, vary only the outcome threshold. Use this to see whether the sufficiency solution changes as the target level of the outcome rises.",
  tabDesc_cts:"Fix the outcome threshold and all conditions but one; vary that single condition's threshold. Use this to test how sensitive the solution is to one calibration choice.",
  tabDesc_ctm:"Fix the outcome threshold; vary several condition thresholds at once across a grid. Use this to explore the joint threshold space of multiple conditions.",
  tabDesc_dt:"Vary the outcome threshold and one or more condition thresholds simultaneously. The most general sweep: a two-dimensional map of target level x judgment criteria.",
  sec2:"Data & variables",
  lblDat:"Data object <span class=\"hint\">R variable name</span>",
  lblOutcome:"Outcome <span class=\"hint\">column name</span>",

  tabGuideBody:"<ul><li><b>Outcome</b>: when you want to vary the level at which the outcome counts as present. Condition thresholds stay fixed.</li><li><b>Single condition</b>: when you want to vary the threshold of one condition only. The other conditions and the outcome stay fixed.</li><li><b>Multi condition</b>: when you want to vary the thresholds of several conditions at once, across a grid. The outcome stays fixed.</li><li><b>Dual</b>: when you want to vary the outcome threshold and condition thresholds together. This is the most general form, and the number of combinations grows.</li></ul>To begin with, varying only one thing makes the changes in the results easier to read.",
  noteAdv:"<b>extract_mode</b>: how to handle multiple solutions (M1, M2, and so on). <b>first</b> (default) returns only the first solution (M1). <b>all</b> returns all solutions concatenated. <b>essential</b> returns the terms common to all solutions (essential terms), plus the selective terms (terms that differ between solutions) and the number of solutions.<br><b>pri.cut</b>: the cutoff for PRI (proportional reduction in inconsistency). At 0 (default), PRI does not narrow the results. With data dichotomized to 0/1, PRI equals consistency, so a value at or below incl.cut changes nothing. A value above incl.cut makes the criterion stricter, and the solution may change.",

f=\"https://doi.org/10.1007/s11135-026-03092-3\" target=\"_blank\" rel=\"noopener\">DOI</a></li><li>Krogslund, C., Choi, D. D., &amp; Poertner, M. (2015). Fuzzy sets on shaky ground: Parameter sensitivity and confirmation bias in fsQCA. <i>Political Analysis, 23</i>(1), 21&ndash;41. <a href=\"https://doi.org/10.1093/pan/mpu016\" target=\"_blank\" rel=\"noopener\">DOI</a></li></ul><a href=\"https://im-research-yt.github.io/posts/reading-list-basics/\" target=\"_blank\" rel=\"noopener\">See the reading list (basics) on the blog &rarr;</a></div>",

(function(){
  "use strict";

  var state = { tab: "ot", conds: [] };

  var TAB_META = {
    ot:  { fn:"otSweep()"  },
    cts: { fn:"ctSweepS()" },
    ctm: { fn:"ctSweepM()" },
    dt:  { fn:"dtSweep()"  }
  };

  function $(id){ return document.getElementById(id); }

  function parseConditions(raw){
    return raw.split(",").map(function(s){return s.trim();}).filter(Boolean);
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ---- condition table -------------------------------------------------

  function rebuildCondTable(){
    var raw = $("conditions").value;
    var names = parseConditions(raw);
    var table = $("condTable");

    // preserve existing per-condition state where names persist
    var prev = {};
    state.conds.forEach(function(c){ prev[c.name] = c; });

    state.conds = names.map(function(name){
      var old = prev[name];
      return old || { name:name, mode:"fixed", value:"7", lo:"6", hi:"9", dir:"-", precal:false };
    });

    rebuildDirTable();

    if (names.length === 0){
      table.innerHTML = '<div class="empty-note">'+t('emptyConds')+'</div>';
      renderCode();
      return;
    }

    var showModeToggle = (state.tab === "ctm" || state.tab === "dt");
    var isCts = (state.tab === "cts");

    var html = state.conds.map(function(c, i){
      var modeHtml = "";
      if (c.precal){
        modeHtml = '<div class="cond-mode"><span class="precal-note">'+t('fuzzyNoThr')+'</span></div>';
      } else if (isCts){
        modeHtml = '<div class="cond-mode"><span style="font-size:11px;color:var(--text-muted);">&mdash;</span></div>';
      } else if (showModeToggle){
        modeHtml =
          '<div class="cond-mode">'+
            '<button type="button" class="mode-btn '+(c.mode==="fixed"?"on":"")+'" data-ci="'+i+'" data-mode="fixed">'+t('modeFixed')+'</button>'+
            '<button type="button" class="mode-btn '+(c.mode==="range"?"on":"")+'" data-ci="'+i+'" data-mode="range">'+t('modeSweep')+'</button>'+
          '</div>';
      } else {
        modeHtml = '<div class="cond-mode"><span style="font-size:11px;color:var(--text-muted);">'+t('fixedThr')+'</span></div>';
      }

      var valsHtml;
      if (c.precal){
        valsHtml = '<div class="cond-vals"><span class="precal-note">'+t('alreadyFuzzy')+'</span></div>';
      } else if (isCts){
        valsHtml = '<div class="cond-vals"><span class="precal-note">'+t('usesDefault')+'</span></div>';
      } else if (showModeToggle && c.mode === "range"){
        valsHtml =
          '<div class="cond-vals">'+
            '<input type="text" data-ci="'+i+'" data-field="lo" value="'+escapeHtml(c.lo)+'" placeholder="'+t('phLow')+'">'+
            '<input type="text" data-ci="'+i+'" data-field="hi" value="'+escapeHtml(c.hi)+'" placeholder="'+t('phHigh')+'">'+
          '</div>';
      } else {
        valsHtml =
          '<div class="cond-vals">'+
            '<input type="text" data-ci="'+i+'" data-field="value" value="'+escapeHtml(c.value)+'" placeholder="'+t('phThr')+'">'+
          '</div>';
      }

      var precalHtml =
        '<label class="precal-toggle">'+
          '<input type="checkbox" data-ci="'+i+'" data-field="precal" '+(c.precal?"checked":"")+'>'+
          t('fuzzyLabel')+
        '</label>';

      return '<div class="cond-row">'+
               '<span class="cname">'+escapeHtml(c.name)+'</span>'+
               modeHtml+
               valsHtml+
               precalHtml+
             '</div>';
    }).join("");

    table.innerHTML = html;

    table.querySelectorAll(".mode-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var i = +btn.getAttribute("data-ci");
        state.conds[i].mode = btn.getAttribute("data-mode");
        rebuildCondTable();
      });
    });
    table.querySelectorAll('input[data-field="precal"]').forEach(function(cb){
      cb.addEventListener("change", function(){
        var i = +cb.getAttribute("data-ci");
        state.conds[i].precal = cb.checked;
        if (cb.checked) state.conds[i].mode = "fixed";
        rebuildCondTable();
      });
    });
    table.querySelectorAll('input:not([data-field="precal"])').forEach(function(inp){
      inp.addEventListener("input", function(){
        var i = +inp.getAttribute("data-ci");
        var field = inp.getAttribute("data-field");
        state.conds[i][field] = inp.value;
        renderCode();
      });
    });

    renderCode();
  }

  // ---- directional-expectation table ------------------------------------

  var DIR_OPTIONS = [
    { value:"-", key:"dirNone" },
    { value:"1", key:"dirFavors" },
    { value:"0", key:"dirDisfavors" }
  ];

  function rebuildDirTable(){
    var table = $("dirTable");
    if (!table) return;
    if (state.conds.length === 0){
      table.innerHTML = '<div class="empty-note">'+t('emptyConds')+'</div>';
      return;
    }
    table.innerHTML = state.conds.map(function(c, i){
      var opts = DIR_OPTIONS.map(function(o){
        return '<option value="'+o.value+'"'+(c.dir===o.value?" selected":"")+'>'+t(o.key)+'</option>';
      }).join("");
      return '<div class="dir-row">'+
               '<span class="cname">'+escapeHtml(c.name)+'</span>'+
               '<select data-ci="'+i+'">'+opts+'</select>'+
             '</div>';
    }).join("");
    table.querySelectorAll("select").forEach(function(sel){
      sel.addEventListener("change", function(){
        var i = +sel.getAttribute("data-ci");
        state.conds[i].dir = sel.value;
        renderCode();
      });
    });
  }

  function rDirExpVec(conds){
    var toks = conds.map(function(c){ return c.dir || "-"; });
    if (toks.every(function(t){ return t === "-"; })) return null;
    return "c(" + toks.map(function(t){
      return isNumericToken(t) ? t : '"' + t + '"';
    }).join(", ") + ")";
  }

  // ---- UI: field visibility per tab ------------------------------------

  var SOLUTION_META = {
    conservative: { include:"",  useDir:false },
    parsimonious: { include:"?", useDir:false },
    intermediate: { include:"?", useDir:true  },
    liberal:      { include:"1", useDir:false }
  };

  function updateSolutionHelp(){
    var v = $("solutionType").value;
    if (!SOLUTION_META[v]) v = "intermediate";
    var m = SOLUTION_META[v];
    var hint = t("solHint_"+v);
    $("solutionHelp").innerHTML = '<span class="soltype">'+t("solLabel_"+v)+'</span>' +
      (hint ? ' <span class="solhint">'+hint+'</span>' : '') + t("solSep") + t("solText_"+v);
    $("dirExpSection").style.display = m.useDir ? "" : "none";
  }

  function updateFieldVisibility(){
    var tabKey = state.tab;
    $("thrYField").style.display  = (tabKey === "cts" || tabKey === "ctm") ? "" : "none";
    $("sweepRangeField").style.display = (tabKey === "ot" || tabKey === "dt") ? "" : "none";
    document.querySelectorAll(".tab").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === tabKey);
    });
    var meta = TAB_META[tabKey];
    $("tabDesc").textContent = t("tabDesc_"+tabKey);
    $("codeTitle").textContent = t("codeTitle", meta.fn);
  }

  // ---- R vector / list helpers ------------------------------------------

  function isNumericToken(s){
    return /^-?\d+(\.\d+)?$/.test(s.trim());
  }
  function rScalar(s){
    s = (s||"").trim();
    if (s === "") return '""';
    if (isNumericToken(s)) return s;
    // treat bare 6:9-style ranges or c(...) as literal R code
    if (/^\d+\s*:\s*\d+$/.test(s) || /^c\(.*\)$/.test(s)) return s;
    return '"' + s.replace(/"/g,'\\"') + '"';
  }
  function rNamedVector(pairs){
    // pairs: [[name, valueTokenAsRLiteral], ...]
    return "c(" + pairs.map(function(p){ return p[0] + " = " + p[1]; }).join(", ") + ")";
  }
  function rNamedList(pairs){
    if (pairs.length === 0) return "list()";
    return "list(\n" + pairs.map(function(p){ return "    " + p[0] + " = " + p[1]; }).join(",\n") + "\n  )";
  }
  function rRangeLiteral(lo, hi){
    lo = (lo||"").trim(); hi = (hi||"").trim();
    if (lo === "" || hi === "") return "6:9";
    return lo + ":" + hi;
  }
  function rConditionsVec(names){
    return "c(" + names.map(function(n){ return '"' + n + '"'; }).join(", ") + ")";
  }
  // ---- code generation ---------------------------------------------------

  function renderCode(){
    var dat = $("dat").value.trim() || "dat";
    var outcome = $("outcome").value.trim() || "Y";
    var condNames = state.conds.map(function(c){ return c.name; });
    var inclCut = $("inclCut").value.trim() || "0.8";
    var nCut = $("nCut").value.trim() || "1";
    var solMeta = SOLUTION_META[$("solutionType").value] || SOLUTION_META.intermediate;
    var include = solMeta.include;
    var extractMode = $("extractMode").value;
    var priCut = $("priCut").value.trim() || "0";
    var precalNames = state.conds.filter(function(c){ return c.precal; }).map(function(c){ return c.name; });
    var precalLine = precalNames.length ? "pre_calibrated = " + rConditionsVec(precalNames) : null;
    var dirExp = solMeta.useDir ? rDirExpVec(state.conds) : null;
    var thrY = $("thrY").value.trim() || "7";
    var sweepRange = $("sweepRange").value.trim() || "6:9";

    var lines = [];
    var varName = "res";
    var fnName = "";

    var commonTail = [];
    commonTail.push("incl.cut = " + inclCut);
    commonTail.push("n.cut = " + nCut);
    commonTail.push('include = "' + include + '"');
    if (dirExp) commonTail.push("dir.exp = " + dirExp);

    if (condNames.length === 0){
      $("codeOut").innerHTML = '<span style="color:var(--text-muted)">' +
        t("codeEmpty") + "</span>";
      return;
    }

    if (state.tab === "ot"){
      varName = "res_ots";
      var thrXPairs = state.conds.filter(function(c){ return !c.precal; })
        .map(function(c){ return [c.name, rScalar(c.value)]; });
      lines.push(varName + " <- otSweep(");
      lines.push("  dat = " + dat + ",");
      lines.push('  outcome = "' + outcome + '",');
      lines.push("  conditions = " + rConditionsVec(condNames) + ",");
      lines.push("  sweep_range = " + sweepRange + ",");
      lines.push("  thrX = " + rNamedVector(thrXPairs) + ",");
      if (precalLine) lines.push("  " + precalLine + ",");
      commonTail.forEach(function(l){ lines.push("  " + l + ","); });
      lines.push("  pri.cut = " + priCut + ",");
      lines.push('  extract_mode = "' + extractMode + '",');
      lines.push("  return_details = TRUE");
      lines.push(")");
    }

    if (state.tab === "cts"){
      varName = "res_cts";
      var sweepVarSel = $("sweepVarSelect") ? $("sweepVarSelect").value : condNames[0];
      var thrXDefault = $("thrXDefault") ? $("thrXDefault").value.trim() : "7";
      var swept = state.conds.find(function(c){ return c.name === sweepVarSel; }) || state.conds[0];
      lines.push(varName + " <- ctSweepS(");
      lines.push("  dat = " + dat + ",");
      lines.push('  outcome = "' + outcome + '",');
      lines.push("  conditions = " + rConditionsVec(condNames) + ",");
      lines.push('  sweep_var = "' + swept.name + '",');
      lines.push("  sweep_range = " + rRangeLiteral(swept.lo, swept.hi) + ",");
      lines.push("  thrY = " + rScalar(thrY) + ",");
      lines.push("  thrX_default = " + (thrXDefault || "7") + ",");
      if (precalLine) lines.push("  " + precalLine + ",");
      commonTail.forEach(function(l){ lines.push("  " + l + ","); });
      lines.push("  pri.cut = " + priCut + ",");
      lines.push('  extract_mode = "' + extractMode + '",');
      lines.push("  return_details = TRUE");
      lines.push(")");
    }

    if (state.tab === "ctm"){
      varName = "res_mcts";
      var pairsM = state.conds.filter(function(c){ return !c.precal; }).map(function(c){
        return [c.name, c.mode === "range" ? rRangeLiteral(c.lo, c.hi) : rScalar(c.value)];
      });
      lines.push(varName + " <- ctSweepM(");
      lines.push("  dat = " + dat + ",");
      lines.push('  outcome = "' + outcome + '",');
      lines.push("  conditions = " + rConditionsVec(condNames) + ",");
      lines.push("  sweep_list = " + rNamedList(pairsM) + ",");
      lines.push("  thrY = " + rScalar(thrY) + ",");
      if (precalLine) lines.push("  " + precalLine + ",");
      commonTail.forEach(function(l){ lines.push("  " + l + ","); });
      lines.push("  pri.cut = " + priCut + ",");
      lines.push('  extract_mode = "' + extractMode + '",');
      lines.push("  return_details = TRUE");
      lines.push(")");
    }

    if (state.tab === "dt"){
      varName = "res_dts";
      var pairsD = state.conds.filter(function(c){ return !c.precal; }).map(function(c){
        return [c.name, c.mode === "range" ? rRangeLiteral(c.lo, c.hi) : rScalar(c.value)];
      });
      lines.push(varName + " <- dtSweep(");
      lines.push("  dat = " + dat + ",");
      lines.push('  outcome = "' + outcome + '",');
      lines.push("  conditions = " + rConditionsVec(condNames) + ",");
      lines.push("  sweep_list_X = " + rNamedList(pairsD) + ",");
      lines.push("  sweep_range_Y = " + sweepRange + ",");
      if (precalLine) lines.push("  " + precalLine + ",");
      commonTail.forEach(function(l){ lines.push("  " + l + ","); });
      lines.push("  pri.cut = " + priCut + ",");
      lines.push('  extract_mode = "' + extractMode + '",');
      lines.push("  return_details = TRUE");
      lines.push(")");
    }

    lines.push("");
    lines.push("summary(" + varName + ")");

    $("codeOut").innerHTML = highlight(lines.join("\n"));
  }

  function highlight(code){
    var esc = escapeHtml(code);
    esc = esc.replace(/(&quot;|"[^"\n]*")/g, function(m){ return m; }); // no-op placeholder
    // strings
    esc = esc.replace(/"([^"\\]|\\.)*"/g, function(m){ return '<span class="s">'+m+'</span>'; });
    // numbers / ranges
    esc = esc.replace(/\b(\d+(\.\d+)?(:\d+)?)\b/g, function(m){ return '<span class="nnum">'+m+'</span>'; });
    // keywords / function names
    esc = esc.replace(/\b(otSweep|ctSweepS|ctSweepM|dtSweep|summary|TRUE|FALSE|list|c)\b(?=\()/g, function(m){ return '<span class="k">'+m+'</span>'; });
    esc = esc.replace(/\b(TRUE|FALSE)\b/g, function(m){ return '<span class="k">'+m+'</span>'; });
    return esc;
  }

  // ---- sweep_var selector for ctSweepS tab (injected into DOM) ---------

  function ensureCtsExtras(){
    var section = $("condSection");
    var existing = document.getElementById("ctsExtras");
    var created = false;
    if (state.tab !== "cts"){
      if (existing) existing.remove();
      return;
    }
    if (!existing){
      var div = document.createElement("div");
      div.id = "ctsExtras";
      div.className = "row2";
      div.style.marginTop = "10px";
      div.innerHTML =
        '<div class="field">'+
          '<label data-i="lblSweepVar">'+t('lblSweepVar')+'</label>'+
          '<select id="sweepVarSelect"></select>'+
        '</div>'+
        '<div class="field">'+
          '<label data-ih="lblCtsRange">'+t('lblCtsRange')+'</label>'+
          '<div style="display:flex;gap:6px;">'+
            '<input type="text" id="sweepVarLo" value="6">'+
            '<input type="text" id="sweepVarHi" value="9">'+
          '</div>'+
        '</div>'+
        '<div class="field">'+
          '<label data-ih="lblThrDefault">'+t('lblThrDefault')+'</label>'+
          '<input type="text" id="thrXDefault" value="7">'+
        '</div>';
      section.parentNode.insertBefore(div, section);
      created = true;

      // Listeners are bound once, when the controls are created.
      $("sweepVarSelect").addEventListener("change", function(){
        var c = sweptCond();
        if (c){ $("sweepVarLo").value = c.lo; $("sweepVarHi").value = c.hi; }
        renderCode();
      });
      $("sweepVarLo").addEventListener("input", function(){
        var c = sweptCond();
        if (c) c.lo = $("sweepVarLo").value;
        renderCode();
      });
      $("sweepVarHi").addEventListener("input", function(){
        var c = sweptCond();
        if (c) c.hi = $("sweepVarHi").value;
        renderCode();
      });
      $("thrXDefault").addEventListener("input", renderCode);
    }

    var sel = $("sweepVarSelect");
    var prevVal = sel.value;   // remember the current choice before rebuilding options
    var names = state.conds.filter(function(c){ return !c.precal; }).map(function(c){ return c.name; });
    if (names.length === 0){
      sel.innerHTML = '<option value="">'+t('noSweepable')+'</option>';
    } else {
      sel.innerHTML = names.map(function(n){ return '<option value="'+escapeHtml(n)+'">'+escapeHtml(n)+'</option>'; }).join("");
      if (names.indexOf(prevVal) >= 0) sel.value = prevVal;   // restore the choice
    }

    // Sync the range inputs when the controls were just created or the selection had to change.
    if (created || sel.value !== prevVal){
      var cur = sweptCond();
      if (cur){ $("sweepVarLo").value = cur.lo; $("sweepVarHi").value = cur.hi; }
    }
  }

  function sweptCond(){
    var sel = $("sweepVarSelect");
    if (!sel) return null;
    return state.conds.find(function(x){ return x.name === sel.value; }) || null;
  }

  // patch renderCode's ctSweepS branch to read the injected controls
  var _origRenderCode = renderCode;
  renderCode = function(){
    ensureCtsExtras();
    _origRenderCode();
  };

  // ---- wire up top-level controls --------------------------------------

  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.tab = btn.getAttribute("data-tab");
      updateFieldVisibility();
      rebuildCondTable();
    });
  });

  ["dat","outcome","thrY","sweepRange","inclCut","nCut","extractMode","priCut"].forEach(function(id){
    var el = $(id);
    el.addEventListener("input", renderCode);
    el.addEventListener("change", renderCode);
  });
  $("solutionType").addEventListener("change", function(){ updateSolutionHelp(); renderCode(); });
  $("conditions").addEventListener("input", rebuildCondTable);

  $("copyBtn").addEventListener("click", function(){
    var text = $("codeOut").textContent;
    var btn = $("copyBtn");
    function done(){
      btn.textContent = t("copied");
      btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = t("copy"); btn.classList.remove("copied"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });
  function fallbackCopy(text, cb){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    cb();
  }

  window.onLangChange = function(){
    $("metaDesc").setAttribute("content", t("desc"));
    updateFieldVisibility();
    updateSolutionHelp();
    rebuildCondTable();
  };
  LANG = detectLang();
  applyI18n();
})();
</script>
