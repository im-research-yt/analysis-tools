<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweep Builder</title>
<script data-goatcounter="https://yuki-toyoda.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<meta id="metaDesc" name="description" content="Turn a single-threshold QCA setup into ready-to-run ThSQCA sweep code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1ef;
    --surface:#ffffff;
    --surface-2:#e3e8e6;
    --border:#c9d1ce;
    --text:#16211f;
    --text-muted:#57655f;
    --accent:#c1601a;
    --accent-ink:#ffffff;
    --accent-2:#1f6f78;
    --accent-2-tint:#e2eeee;
    --code-bg:#151b1a;
    --code-text:#e7ece9;
    --code-key:#e08a3e;
    --code-str:#8fd0c4;
    --code-num:#d7c48a;
    --shadow: 0 1px 2px rgba(20,30,28,.06), 0 8px 24px -12px rgba(20,30,28,.18);
    color-scheme: light;
  }
  /* Light theme only, to match the other tools */

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", system-ui, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    padding-inline:16px;
    padding-block:0 64px;
  }
  .wrap{max-width:1080px; margin:0 auto;}
  code, pre, .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}

  .hbar{background:#233A9A;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;margin-inline:-16px;}
  .hbar-title{font-size:17px;font-weight:600;}
  .hbar-badge{background:#F28018;color:#1a2332;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
  .hbar .langsw{position:static;margin-left:auto;}
  .hbar .langsw button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);}
  .hbar .langsw button.on{background:#fff;color:#233A9A;border-color:#fff;font-weight:700;}
  .disc{background:#F28018;color:#1a2332;font-weight:700;font-size:12px;line-height:1.6;padding:10px 24px;margin-inline:-16px;}
  .wrap{margin-top:24px;}
  header.top{margin-bottom:22px;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent-2); background:var(--accent-2-tint);
    border:1px solid var(--border);
    padding:3px 10px; border-radius:999px;
    margin-bottom:12px;
  }
  h1{
    font-size:clamp(22px, 3.4vw, 30px);
    line-height:1.2; margin:0 0 8px; text-wrap:balance;
    font-weight:700;
  }
  header.top p{
    color:var(--text-muted); max-width:62ch; margin:0;
    font-size:14.5px; line-height:1.55;
  }

  .layout{
    display:grid; grid-template-columns: 1.15fr 1fr; gap:20px;
    align-items:start;
  }
  @media (max-width: 860px){
    .layout{grid-template-columns: 1fr;}
  }

  .panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow);
    padding:20px;
  }
  .panel + .panel{margin-top:16px;}

  .section-title{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-muted); font-weight:600; margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title .n{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background:var(--surface-2); color:var(--text);
    font-size:10.5px; font-family:"IBM Plex Mono",monospace;
  }

  .tabs{
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
    margin-bottom:14px;
  }
  @media (max-width:560px){ .tabs{grid-template-columns:repeat(2,1fr);} }
  .tab{
    border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); border-radius:10px; padding:9px 6px;
    font-size:12px; font-weight:600; cursor:pointer; text-align:center;
    line-height:1.3; transition:background .12s, border-color .12s, color .12s;
  }
  .tab .fn{display:block; font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:10.5px; margin-top:2px; opacity:.75;}
  .tab:hover{border-color:var(--accent-2);}
  .tab.active{
    background:var(--accent-2); border-color:var(--accent-2); color:#fff;
  }
  .tab.active .fn{opacity:.9;}

  .tab-desc{
    font-size:13px; color:var(--text-muted); margin:0 0 16px;
    padding:10px 12px; background:var(--accent-2-tint);
    border:1px solid var(--border); border-radius:9px;
  }

  label{
    display:block; font-size:12.5px; font-weight:600; margin-bottom:5px;
  }
  label .hint{font-weight:400; color:var(--text-muted); font-size:11.5px;}
  .field{margin-bottom:14px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:480px){ .row2,.row3{grid-template-columns:1fr;} }

  input[type="text"], input[type="number"], select{
    width:100%; border:1px solid var(--border); background:var(--surface);
    color:var(--text); border-radius:8px; padding:8px 10px;
    font-size:13.5px; font-family:"IBM Plex Mono", monospace;
  }
  input:focus, select:focus{outline:2px solid var(--accent-2); outline-offset:1px;}

  .cond-table{border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .cond-row{
    display:grid; grid-template-columns: 1fr .95fr 1.15fr .95fr; gap:8px;
    padding:9px 10px; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .precal-toggle{
    display:flex; align-items:center; gap:5px; font-size:10.5px;
    color:var(--text-muted); white-space:nowrap; cursor:pointer;
  }
  .precal-toggle input{width:auto; margin:0;}
  .precal-note{font-size:11px; color:var(--text-muted); font-style:italic;}
  .cond-row:last-child{border-bottom:none;}
  .cond-row:nth-child(odd){background:var(--surface-2);}
  .cond-row .cname{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600;}
  .cond-mode{display:flex; gap:4px;}
  .mode-btn{
    flex:1; border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); border-radius:6px; padding:5px 4px;
    font-size:10.5px; cursor:pointer; font-weight:600;
  }
  .mode-btn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .cond-vals{display:flex; gap:6px;}
  .cond-vals input{padding:6px 8px; font-size:12.5px;}
  .empty-note{padding:14px; color:var(--text-muted); font-size:12.5px; text-align:center;}

  .dir-row{
    display:grid; grid-template-columns: 1.2fr 1.8fr; gap:10px;
    padding:9px 10px; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .dir-row:last-child{border-bottom:none;}
  .dir-row:nth-child(odd){background:var(--surface-2);}
  .dir-row select{padding:6px 8px; font-size:12.5px;}

  .note-box{
    font-size:12px; line-height:1.55; color:var(--text-muted);
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:9px; padding:9px 11px; margin:-4px 0 14px;
  }
  .note-box b{color:var(--text); font-weight:600;}
  .note-box .soltype{
    display:inline-block; font-weight:700; color:var(--accent);
    font-family:"IBM Plex Mono",monospace; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.04em;
  }

  .adv{
    border:1px dashed var(--border); border-radius:10px; padding:12px;
    margin-top:4px;
  }
  .adv summary{cursor:pointer; font-size:12.5px; font-weight:600; color:var(--text-muted);}
  .adv[open] summary{margin-bottom:10px;}

  .code-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; gap:10px; flex-wrap:wrap;
  }
  .code-head h2{font-size:13px; margin:0; font-weight:600;}
  .copy-btn{
    border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
    border-radius:8px; padding:7px 13px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:"IBM Plex Sans",sans-serif;
    display:inline-flex; align-items:center; gap:6px;
  }
  .copy-btn:active{transform:translateY(1px);}
  .copy-btn.copied{background:var(--accent-2); border-color:var(--accent-2);}

  pre.codebox{
    background:var(--code-bg); color:var(--code-text);
    border-radius:10px; padding:16px 14px; font-size:12.5px; line-height:1.6;
    overflow-x:auto; margin:0; white-space:pre;
  }
  .k{color:var(--code-key);}
  .s{color:var(--code-str);}
  .nnum{color:var(--code-num);}

  .trust{
    margin-top:14px; font-size:12px; line-height:1.55; color:var(--text-muted);
    border-top:1px solid var(--border); padding-top:12px;
  }
  .trust b{color:var(--text);}

  footer{
    margin-top:22px; font-size:12px; color:var(--text-muted);
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  }
  footer a{color:var(--accent-2); text-decoration:none; font-weight:600;}
  footer a:hover{text-decoration:underline;}
  .dot{opacity:.5;}

  /* ---- language toggle + footer (i18n) ---- */
  header.top{position:relative;}
  .langsw{position:absolute; top:0; right:0; display:flex; gap:4px;}
  .langsw button{
    background:transparent; color:var(--text-muted); border:1px solid var(--border);
    border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .langsw button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
  .solhint{font-size:11.5px; color:var(--text-muted);}
  .foot{margin-top:14px; font-size:11px; color:var(--text-muted);}
</style>

<header class="hbar"><span class="hbar-title" data-i="barTitle"></span><span class="hbar-badge">ThSQCA</span><div class="langsw"><button type="button" data-lang="ja" onclick="setLang('ja')">日本語</button><button type="button" data-lang="en" onclick="setLang('en')">English</button></div></header>
<div class="disc"><span data-i="disc1"></span><br><span data-i="disc2"></span></div>
<div class="wrap">
  <header class="top">
    <span class="eyebrow" data-i="eyebrow"></span>
    <h1 data-i="h1"></h1>
    <p data-ih="lead"></p>
  </header>

  <div class="layout">
    <div class="left">
      <div class="panel">
        <p class="section-title"><span class="n">1</span><span data-i="sec1"></span></p>
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="ot"><span data-i="tabOt"></span><span class="fn">otSweep()</span></button>
          <button class="tab" data-tab="cts"><span data-i="tabCts"></span><span class="fn">ctSweepS()</span></button>
          <button class="tab" data-tab="ctm"><span data-i="tabCtm"></span><span class="fn">ctSweepM()</span></button>
          <button class="tab" data-tab="dt"><span data-i="tabDt"></span><span class="fn">dtSweep()</span></button>
        </div>
        <p class="tab-desc" id="tabDesc"></p>

        <p class="section-title"><span class="n">2</span><span data-i="sec2"></span></p>
        <div class="row3">
          <div class="field">
            <label data-ih="lblDat"></label>
            <input type="text" id="dat" value="dat">
          </div>
          <div class="field">
            <label data-ih="lblOutcome"></label>
            <input type="text" id="outcome" value="Y">

          <div class="field" id="thrYField">

        <div id="condSection">

          <p class="note-box" data-ih="noteThr"></p>
          <div class="cond-table" id="condTable"></div>

        <p class="section-title" style="margin-top:16px;"><span class="n">4</span><span data-i="sec4"></span></p>
        <div class="row3">
          <div class="field">
            <label data-ih="lblIncl"></label>
            <input type="text" id="inclCut" value="0.8">
          </div>
          <div class="field">
            <label data-ih="lblN"></label>
            <input type="text" id="nCut" value="1">
          </div>
          <div class="field">
            <label data-i="lblSol"></label>
            <select id="solutionType">
              <option value="conservative" data-i="optConservative"></option>
              <option value="parsimonious" data-i="optParsimonious"></option>
              <option value="intermediate" selected data-i="optIntermediate"></option>
              <option value="liberal" data-i="optLiberal"></option>
            </select>
          </div>
        </div>
        <p class="note-box" id="solutionHelp"></p>

        <div id="dirExpSection">
          <p class="section-title"><span class="n">5</span><span data-i="sec5"></span><span class="hint" data-i="sec5h"></span></p>
          <div class="cond-table" id="dirTable"></div>
          <p class="note-box" data-ih="noteDir"></p>
        </div>
        <details class="adv" id="advBlock">
          <summary data-i="adv"></summary>
          <div class="row3">
            <div class="field">
              <label>extract_mode</label>
              <select id="extractMode">
                <option value="first" selected>first</option>
                <option value="all">all</option>
                <option value="essential">essential</option>
              </select>
            </div>
            <div class="field">
              <label>pri.cut</label>
              <input type="text" id="priCut" value="0">
            </div>
          </div>
        </details>
      </div>
    </div>

    <div class="right">
      <div class="panel" style="position:sticky; top:16px;">
        <div class="code-head">
          <h2 id="codeTitle"></h2>
          <button class="copy-btn" id="copyBtn" data-i="copy"></button>
        </div>
        <pre class="codebox"><code id="codeOut"></code></pre>
        <p class="trust" data-ih="trust"></p>
      </div>
    </div>
  </div>

  <footer>
    <span>install.packages("ThSQCA")</span>
    <span class="dot">&middot;</span>
    <span data-i="ftCode"></span>
    <span class="dot">&middot;</span>
    <a href="https://github.com/im-research-yt/ThSQCA" target="_blank" rel="noopener">github.com/im-research-yt/ThSQCA</a>
    <span class="dot">&middot;</span>
    <a href="qca-quickstart.html" data-i="ftQs"></a>
    <span class="dot">&middot;</span>
    <span data-i="ftAuthor"></span>
  </footer>
  <div class="foot" data-i="foot"></div>
</div>

<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}
// =================================================================

// ===================== i18n dictionary =====================
Object.assign(I18N.en,{
  barTitle:"Sweep Builder", disc1:"Yuki Toyoda Laboratory, Graduate School of Innovation Management, Hosei University", disc2:"This is a learning tool. It may contain calculation errors, so please verify the results with other software before using them in research or business.",
  title:"Sweep Builder",
  desc:"Turn a single-threshold QCA setup into ready-to-run ThSQCA sweep code.",
  eyebrow:"ThSQCA · sweep builder",
  h1:"Turn a fixed-threshold QCA setup into sweep code",
  lead:"Already have a working <code class=\"mono\">QCA::truthTable()</code> / <code class=\"mono\">minimize()</code> analysis? Pick a sweep type, fill in the same variables and thresholds you already use, and copy out the equivalent <code class=\"mono\">ThSQCA</code> call.",
  sec1:"Sweep type",
  tabOt:"Outcome", tabCts:"Single condition", tabCtm:"Multi condition", tabDt:"Dual",
  tabDesc_ot:"Fix all condition thresholds, vary only the outcome threshold. Use this to see whether the sufficiency solution changes as the target level of the outcome rises.",
  tabDesc_cts:"Fix the outcome threshold and all conditions but one; vary that single condition's threshold. Use this to test how sensitive the solution is to one calibration choice.",
  tabDesc_ctm:"Fix the outcome threshold; vary several condition thresholds at once across a grid. Use this to explore the joint threshold space of multiple conditions.",
  tabDesc_dt:"Vary the outcome threshold and one or more condition thresholds simultaneously. The most general sweep: a two-dimensional map of target level x judgment criteria.",
  sec2:"Data & variables",
  lblDat:"Data object <span class=\"hint\">R variable name</span>",
  lblOutcome:"Outcome <span class=\"hint\">column name</span>",
  lblThrY:"Outcome threshold <span class=\"hint\">fixed value</span>",
  lblRange:"Outcome threshold range <span class=\"hint\">e.g. 6:9</span>",
  lblConds:"Condition variables <span class=\"hint\">comma-separated column names</span>",
  sec3:"Condition thresholds",
  noteThr:"Most conditions are on their raw scale and get dichotomized at a threshold. If one is already calibrated to fuzzy-set membership scores in [0, 1], check <b>fuzzy 0&ndash;1</b> for it; it is then passed straight through (via <code class=\"mono\">pre_calibrated</code>) with no threshold, and won't be offered as a variable to sweep.",
  fuzzyLabel:"fuzzy 0&ndash;1",
  fuzzyNoThr:"fuzzy, no threshold",
  alreadyFuzzy:"already 0&ndash;1 membership",
  fixedThr:"fixed threshold",
  usesDefault:"uses thrX_default",
  modeFixed:"Fixed", modeSweep:"Sweep",
  phLow:"low", phHigh:"high", phThr:"threshold",
  emptyConds:"Enter at least one condition variable above.",
  sec4:"Analysis settings",
  lblIncl:"incl.cut <span class=\"hint\">consistency</span>",
  lblN:"n.cut <span class=\"hint\">frequency</span>",
  lblSol:"Solution type",
  optConservative:"Complex",
  optParsimonious:"Parsimonious",
  optIntermediate:"Intermediate",
  optLiberal:"Most liberal",
  solSep:"; ",
  solLabel_conservative:"Complex solution",
  solHint_conservative:"(= conservative in some texts)",
  solText_conservative:"Only observed configurations are used for minimization. Logical remainders (configurations with no or too few cases) are not used to simplify the solution further. This gives the least reduced, and typically the most complex, of the three solution types.",

  ftCode:"Code targets ThSQCA 2.0.8 (CRAN)",
  ftQs:"QCA Quickstart",
  ftAuthor:"Yuki Toyoda, Hosei University",
  foot:"This tool was developed with the assistance of Claude (Anthropic)."

// ===========================================================

(function(){
  "use strict";

  var state = { tab: "ot", conds: [] };

  var TAB_META = {
    ot:  { fn:"otSweep()"  },
    cts: { fn:"ctSweepS()" },
    ctm: { fn:"ctSweepM()" },
    dt:  { fn:"dtSweep()"  }
  };

  function $(id){ return document.getElementById(id); }

  function parseConditions(raw){
    return raw.split(",").map(function(s){return s.trim();}).filter(Boolean);
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ---- condition table -------------------------------------------------

  function rebuildCondTable(){
    var raw = $("conditions").value;
    var names = parseConditions(raw);
    var table = $("condTable");

    // preserve existing per-condition state where names persist
    var prev = {};
    state.conds.forEach(function(c){ prev[c.name] = c; });

    state.conds = names.map(function(name){
      var old = prev[name];
      return old || { name:name, mode:"fixed", value:"7", lo:"6", hi:"9", dir:"-", precal:false };
    });

    rebuildDirTable();

    if (names.length === 0){
      table.innerHTML = '<div class="empty-note">'+t('emptyConds')+'</div>';
      renderCode();
      return;
    }

    var showModeToggle = (state.tab === "ctm" || state.tab === "dt");
    var isCts = (state.tab === "cts");

    var html = state.conds.map(function(c, i){
      var modeHtml = "";
      if (c.precal){
        modeHtml = '<div class="cond-mode"><span class="precal-note">'+t('fuzzyNoThr')+'</span></div>';
      } else if (isCts){
        modeHtml = '<div class="cond-mode"><span style="font-size:11px;color:var(--text-muted);">&mdash;</span></div>';
      } else if (showModeToggle){
        modeHtml =
          '<div class="cond-mode">'+
            '<button type="button" class="mode-btn '+(c.mode==="fixed"?"on":"")+'" data-ci="'+i+'" data-mode="fixed">'+t('modeFixed')+'</button>'+
            '<button type="button" class="mode-btn '+(c.mode==="range"?"on":"")+'" data-ci="'+i+'" data-mode="range">'+t('modeSweep')+'</button>'+
          '</div>';
      } else {
        modeHtml = '<div class="cond-mode"><span style="font-size:11px;color:var(--text-muted);">'+t('fixedThr')+'</span></div>';
      }

      var valsHtml;
      if (c.precal){
        valsHtml = '<div class="cond-vals"><span class="precal-note">'+t('alreadyFuzzy')+'</span></div>';
      } else if (isCts){
        valsHtml = '<div class="cond-vals"><span class="precal-note">'+t('usesDefault')+'</span></div>';
      } else if (showModeToggle && c.mode === "range"){
        valsHtml =
          '<div class="cond-vals">'+
            '<input type="text" data-ci="'+i+'" data-field="lo" value="'+escapeHtml(c.lo)+'" placeholder="'+t('phLow')+'">'+
            '<input type="text" data-ci="'+i+'" data-field="hi" value="'+escapeHtml(c.hi)+'" placeholder="'+t('phHigh')+'">'+
          '</div>';
      } else {
        valsHtml =
          '<div class="cond-vals">'+
            '<input type="text" data-ci="'+i+'" data-field="value" value="'+escapeHtml(c.value)+'" placeholder="'+t('phThr')+'">'+
          '</div>';
      }

      var precalHtml =
        '<label class="precal-toggle">'+
          '<input type="checkbox" data-ci="'+i+'" data-field="precal" '+(c.precal?"checked":"")+'>'+
          t('fuzzyLabel')+
        '</label>';

      return '<div class="cond-row">'+
               '<span class="cname">'+escapeHtml(c.name)+'</span>'+
               modeHtml+
               valsHtml+
               precalHtml+
             '</div>';
    }).join("");

    table.innerHTML = html;

    table.querySelectorAll(".mode-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var i = +btn.getAttribute("data-ci");
        state.conds[i].mode = btn.getAttribute("data-mode");
        rebuildCondTable();
      });
    });
    table.querySelectorAll('input[data-field="precal"]').forEach(function(cb){
      cb.addEventListener("change", function(){
        var i = +cb.getAttribute("data-ci");
        state.conds[i].precal = cb.checked;
        if (cb.checked) state.conds[i].mode = "fixed";
        rebuildCondTable();
      });
    });
    table.querySelectorAll('input:not([data-field="precal"])').forEach(function(inp){
      inp.addEventListener("input", function(){
        var i = +inp.getAttribute("data-ci");
        var field = inp.getAttribute("data-field");
        state.conds[i][field] = inp.value;
        renderCode();
      });
    });

    renderCode();
  }

  // ---- directional-expectation table ------------------------------------

  var DIR_OPTIONS = [
    { value:"-", key:"dirNone" },
    { value:"1", key:"dirFavors" },
    { value:"0", key:"dirDisfavors" }
  ];

  function rebuildDirTable(){
    var table = $("dirTable");
    if (!table) return;
    if (state.conds.length === 0){
      table.innerHTML = '<div class="empty-note">'+t('emptyConds')+'</div>';
      return;
    }
    table.innerHTML = state.conds.map(function(c, i){
      var opts = DIR_OPTIONS.map(function(o){
        return '<option value="'+o.value+'"'+(c.dir===o.value?" selected":"")+'>'+t(o.key)+'</option>';
      }).join("");
      return '<div class="dir-row">'+
               '<span class="cname">'+escapeHtml(c.name)+'</span>'+
               '<select data-ci="'+i+'">'+opts+'</select>'+
             '</div>';
    }).join("");
    table.querySelectorAll("select").forEach(function(sel){
      sel.addEventListener("change", function(){
        var i = +sel.getAttribute("data-ci");
        state.conds[i].dir = sel.value;
        renderCode();
      });
    });
  }

  function rDirExpVec(conds){
    var toks = conds.map(function(c){ return c.dir || "-"; });
    if (toks.every(function(t){ return t === "-"; })) return null;
    return "c(" + toks.map(function(t){
      return isNumericToken(t) ? t : '"' + t + '"';
    }).join(", ") + ")";
  }

  // ---- UI: field visibility per tab ------------------------------------

  var SOLUTION_META = {
    conservative: { include:"",  useDir:false },
    parsimonious: { include:"?", useDir:false },
    intermediate: { include:"?", useDir:true  },
    liberal:      { include:"1", useDir:false }
  };

  function updateSolutionHelp(){
    var v = $("solutionType").value;
    if (!SOLUTION_META[v]) v = "intermediate";
    var m = SOLUTION_META[v];
    var hint = t("solHint_"+v);
    $("solutionHelp").innerHTML = '<span class="soltype">'+t("solLabel_"+v)+'</span>' +
      (hint ? ' <span class="solhint">'+hint+'</span>' : '') + t("solSep") + t("solText_"+v);
    $("dirExpSection").style.display = m.useDir ? "" : "none";
  }

  function updateFieldVisibility(){
    var tabKey = state.tab;
    $("thrYField").style.display  = (tabKey === "cts" || tabKey === "ctm") ? "" : "none";
    $("sweepRangeField").style.display = (tabKey === "ot" || tabKey === "dt") ? "" : "none";
    document.querySelectorAll(".tab").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === tabKey);
    });
    var meta = TAB_META[tabKey];
    $("tabDesc").textContent = t("tabDesc_"+tabKey);
    $("codeTitle").textContent = t("codeTitle", meta.fn);
  }

  // ---- R vector / list helpers ------------------------------------------

  function isNumericToken(s){
    return /^-?\d+(\.\d+)?$/.test(s.trim());
  }
  function rScalar(s){
    s = (s||"").trim();
    if (s === "") return '""';
    if (isNumericToken(s)) return s;
    // treat bare 6:9-style ranges or c(...) as literal R code
    if (/^\d+\s*:\s*\d+$/.test(s) || /^c\(.*\)$/.test(s)) return s;
    return '"' + s.replace(/"/g,'\\"') + '"';
  }
  function rNamedVector(pairs){
    // pairs: [[name, valueTokenAsRLiteral], ...]
    return "c(" + pairs.map(function(p){ return p[0] + " = " + p[1]; }).join(", ") + ")";
  }
  function rNamedList(pairs){
    if (pairs.length === 0) return "list()";
    return "list(\n" + pairs.map(function(p){ return "    " + p[0] + " = " + p[1]; }).join(",\n") + "\n  )";
  }
  function rRangeLiteral(lo, hi){
    lo = (lo||"").trim(); hi = (hi||"").trim();
    if (lo === "" || hi === "") return "6:9";
    return lo + ":" + hi;
  }
  function rConditionsVec(names){
    return "c(" + names.map(function(n){ return '"' + n + '"'; }).join(", ") + ")";
  }
  // ---- code generation ---------------------------------------------------

  function renderCode(){
    var dat = $("dat").value.trim() || "dat";
    var outcome = $("outcome").value.trim() || "Y";
    var condNames = state.conds.map(function(c){ return c.name; });
    var inclCut = $("inclCut").value.trim() || "0.8";
    var nCut = $("nCut").value.trim() || "1";
    var solMeta = SOLUTION_META[$("solutionType").value] || SOLUTION_META.intermediate;
    var include = solMeta.include;
    var extractMode = $("extractMode").value;
    var priCut = $("priCut").value.trim() || "0";
    var precalNames = state.conds.filter(function(c){ return c.precal; }).map(function(c){ return c.name; });
    var precalLine = precalNames.length ? "pre_calibrated = " + rConditionsVec(precalNames) : null;
    var dirExp = solMeta.useDir ? rDirExpVec(state.conds) : null;
    var thrY = $("thrY").value.trim() || "7";
    var sweepRange = $("sweepRange").value.trim() || "6:9";

    var lines = [];
    var varName = "res";
    var fnName = "";

    var commonTail = [];
    commonTail.push("incl.cut = " + inclCut);
    commonTail.push("n.cut = " + nCut);
    commonTail.push('include = "' + include + '"');
    if (dirExp) commonTail.push("dir.exp = " + dirExp);

    if (condNames.length === 0){
      $("codeOut").innerHTML = '<span style="color:var(--text-muted)">' +
        t("codeEmpty") + "</span>";
      return;
    }

    if (state.tab === "ot"){
      varName = "res_ots";
      var thrXPairs = state.conds.filter(function(c){ return !c.precal; })
        .map(function(c){ return [c.name, rScalar(c.value)]; });
      lines.push(varName + " <- otSweep(");
      lines.push("  dat = " + dat + ",");
      lines.push('  outcome = "' + outcome + '",');
      lines.push("  conditions = " + rConditionsVec(condNames) + ",");
      lines.push("  sweep_range = " + sweepRange + ",");
      lines.push("  thrX = " + rNamedVector(thrXPairs) + ",");
      if (precalLine) lines.push("  " + precalLine + ",");
      commonTail.forEach(function(l){ lines.push("  " + l + ","); });
      lines.push("  return_details = TRUE");
      lines.push(")");
    }

    if (state.tab === "cts"){
      varName = "res_cts";
      var sweepVarSel = $("sweepVarSelect") ? $("sweepVarSelect").value : condNames[0];
      var thrXDefault = $("thrXDefault") ? $("thrXDefault").value.trim() : "7";
      var swept = state.conds.find(function(c){ return c.name === sweepVarSel; }) || state.conds[0];
      lines.push(varName + " <- ctSweepS(");
      lines.push("  dat = " + dat + ",");
      lines.push('  outcome = "' + outcome + '",');
      lines.push("  conditions = " + rConditionsVec(condNames) + ",");
      lines.push('  sweep_var = "' + swept.name + '",');
      lines.push("  sweep_range = " + rRangeLiteral(swept.lo, swept.hi) + ",");
      lines.push("  thrY = " + rScalar(thrY) + ",");
      lines.push("  thrX_default = " + (thrXDefault || "7") + ",");
      if (precalLine) lines.push("  " + precalLine + ",");
      commonTail.forEach(function(l){ lines.push("  " + l + ","); });
      lines.push("  pri.cut = " + priCut + ",");
      lines.push('  extract_mode = "' + extractMode + '",');
      lines.push("  return_details = TRUE");
      lines.push(")");
    }

    if (state.tab === "ctm"){
      varName = "res_mcts";
      var pairsM = state.conds.filter(function(c){ return !c.precal; }).map(function(c){
        return [c.name, c.mode === "range" ? rRangeLiteral(c.lo, c.hi) : rScalar(c.value)];
      });
      lines.push(varName + " <- ctSweepM(");
      lines.push("  dat = " + dat + ",");
      lines.push('  outcome = "' + outcome + '",');
      lines.push("  conditions = " + rConditionsVec(condNames) + ",");
      lines.push("  sweep_list = " + rNamedList(pairsM) + ",");
      lines.push("  thrY = " + rScalar(thrY) + ",");
      if (precalLine) lines.push("  " + precalLine + ",");
      commonTail.forEach(function(l){ lines.push("  " + l + ","); });
      lines.push("  pri.cut = " + priCut + ",");
      lines.push('  extract_mode = "' + extractMode + '",');
      lines.push("  return_details = TRUE");
      lines.push(")");
    }

    if (state.tab === "dt"){
      varName = "res_dts";
      var pairsD = state.conds.filter(function(c){ return !c.precal; }).map(function(c){
        return [c.name, c.mode === "range" ? rRangeLiteral(c.lo, c.hi) : rScalar(c.value)];
      });
      lines.push(varName + " <- dtSweep(");
      lines.push("  dat = " + dat + ",");
      lines.push('  outcome = "' + outcome + '",');
      lines.push("  conditions = " + rConditionsVec(condNames) + ",");
      lines.push("  sweep_list_X = " + rNamedList(pairsD) + ",");
      lines.push("  sweep_range_Y = " + sweepRange + ",");
      if (precalLine) lines.push("  " + precalLine + ",");
      commonTail.forEach(function(l){ lines.push("  " + l + ","); });
      lines.push("  pri.cut = " + priCut + ",");
      lines.push('  extract_mode = "' + extractMode + '",');
      lines.push("  return_details = TRUE");
      lines.push(")");
    }

    lines.push("");
    lines.push("summary(" + varName + ")");

    $("codeOut").innerHTML = highlight(lines.join("\n"));
  }

  function highlight(code){
    var esc = escapeHtml(code);
    esc = esc.replace(/(&quot;|"[^"\n]*")/g, function(m){ return m; }); // no-op placeholder
    // strings
    esc = esc.replace(/"([^"\\]|\\.)*"/g, function(m){ return '<span class="s">'+m+'</span>'; });
    // numbers / ranges
    esc = esc.replace(/\b(\d+(\.\d+)?(:\d+)?)\b/g, function(m){ return '<span class="nnum">'+m+'</span>'; });
    // keywords / function names
    esc = esc.replace(/\b(otSweep|ctSweepS|ctSweepM|dtSweep|summary|TRUE|FALSE|list|c)\b(?=\()/g, function(m){ return '<span class="k">'+m+'</span>'; });
    esc = esc.replace(/\b(TRUE|FALSE)\b/g, function(m){ return '<span class="k">'+m+'</span>'; });
    return esc;
  }

  // ---- sweep_var selector for ctSweepS tab (injected into DOM) ---------

  function ensureCtsExtras(){
    var section = $("condSection");
    var existing = document.getElementById("ctsExtras");
    var created = false;
    if (state.tab !== "cts"){
      if (existing) existing.remove();
      return;
    }
    if (!existing){
      var div = document.createElement("div");
      div.id = "ctsExtras";
      div.className = "row2";
      div.style.marginTop = "10px";
      div.innerHTML =
        '<div class="field">'+
          '<label data-i="lblSweepVar">'+t('lblSweepVar')+'</label>'+
          '<select id="sweepVarSelect"></select>'+
        '</div>'+
        '<div class="field">'+
          '<label data-ih="lblCtsRange">'+t('lblCtsRange')+'</label>'+
          '<div style="display:flex;gap:6px;">'+
            '<input type="text" id="sweepVarLo" value="6">'+
            '<input type="text" id="sweepVarHi" value="9">'+
          '</div>'+
        '</div>'+
        '<div class="field">'+
          '<label data-ih="lblThrDefault">'+t('lblThrDefault')+'</label>'+
          '<input type="text" id="thrXDefault" value="7">'+
        '</div>';
      section.parentNode.insertBefore(div, section);
      created = true;

      // Listeners are bound once, when the controls are created.
      $("sweepVarSelect").addEventListener("change", function(){
        var c = sweptCond();
        if (c){ $("sweepVarLo").value = c.lo; $("sweepVarHi").value = c.hi; }
        renderCode();
      });
      $("sweepVarLo").addEventListener("input", function(){
        var c = sweptCond();
        if (c) c.lo = $("sweepVarLo").value;
        renderCode();
      });
      $("sweepVarHi").addEventListener("input", function(){
        var c = sweptCond();
        if (c) c.hi = $("sweepVarHi").value;
        renderCode();
      });
      $("thrXDefault").addEventListener("input", renderCode);
    }

    var sel = $("sweepVarSelect");
    var prevVal = sel.value;   // remember the current choice before rebuilding options
    var names = state.conds.filter(function(c){ return !c.precal; }).map(function(c){ return c.name; });
    if (names.length === 0){
      sel.innerHTML = '<option value="">'+t('noSweepable')+'</option>';
    } else {
      sel.innerHTML = names.map(function(n){ return '<option value="'+escapeHtml(n)+'">'+escapeHtml(n)+'</option>'; }).join("");
      if (names.indexOf(prevVal) >= 0) sel.value = prevVal;   // restore the choice
    }

    // Sync the range inputs when the controls were just created or the selection had to change.
    if (created || sel.value !== prevVal){
      var cur = sweptCond();
      if (cur){ $("sweepVarLo").value = cur.lo; $("sweepVarHi").value = cur.hi; }
    }
  }

  function sweptCond(){
    var sel = $("sweepVarSelect");
    if (!sel) return null;
    return state.conds.find(function(x){ return x.name === sel.value; }) || null;
  }

  // patch renderCode's ctSweepS branch to read the injected controls
  var _origRenderCode = renderCode;
  renderCode = function(){
    ensureCtsExtras();
    _origRenderCode();
  };

  // ---- wire up top-level controls --------------------------------------

  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.tab = btn.getAttribute("data-tab");
      updateFieldVisibility();
      rebuildCondTable();
    });
  });

  ["dat","outcome","thrY","sweepRange","inclCut","nCut","extractMode","priCut"].forEach(function(id){
    var el = $(id);
    el.addEventListener("input", renderCode);
    el.addEventListener("change", renderCode);
  });
  $("solutionType").addEventListener("change", function(){ updateSolutionHelp(); renderCode(); });
  $("conditions").addEventListener("input", rebuildCondTable);

  $("copyBtn").addEventListener("click", function(){
    var text = $("codeOut").textContent;
    var btn = $("copyBtn");
    function done(){
      btn.textContent = t("copied");
      btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = t("copy"); btn.classList.remove("copied"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });
  function fallbackCopy(text, cb){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    cb();
  }

  window.onLangChange = function(){
    $("metaDesc").setAttribute("content", t("desc"));
    updateFieldVisibility();
    updateSolutionHelp();
    rebuildCondTable();
  };
  LANG = detectLang();
  applyI18n();
})();
</script>
