// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}

// ─── CSV解析 ───
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) throw new Error(t('errMin2'));
  const sep=lines[0].includes('\t')?'\t':',';
  const rows=[];
  let skipped=0;
  for(let i=1;i<lines.length;i++){
    const vals=lines[i].split(sep).map(v=>v.trim());
    if(vals.length<5) continue;
    const id=vals[0];
    const [c1,c2,c3,c4]=vals.slice(1,5).map(v=>+v);
    if([c1,c2,c3,c4].some(isNaN)) continue;
    if(!(c1<c2&&c2<c3&&c3<c4)){skipped++;continue;} // 逆転除外
    rows.push({id,c1,c2,c3,c4});
  }
  return {rows, skipped};
}

// ─── PSM計算（Rパッケージ pricesensitivitymeter と同じ定義・手順） ───
// 曲線: ①安すぎる=1-ECDF(①)、②安い=1-ECDF(②)、③高い=ECDF(③)、④高すぎる=ECDF(④)
//       安くない=1-②安い、高くない=1-③高い
// 価格軸: 4つの質問に現れた価格の重複なし昇順（刻み幅は使わない）
function calcPSM(rows, method){
  const n=rows.length;
  const colv=k=>rows.map(r=>r[k]);
  const prices=[...new Set(rows.flatMap(r=>[r.c1,r.c2,r.c3,r.c4]))].sort((a,b)=>a-b);
  // R の ecdf() と同じ（≦）。端は pricesensitivitymeter と同じく、最大値以上は1、最小値以下は0にそろえる
  const ecdfAt=(vals,p)=>{
    const mx=Math.max(...vals), mn=Math.min(...vals);
    if(p>=mx) return 1;
    if(p<=mn) return 0;
    return vals.filter(v=>v<=p).length/n;
  };
  const v1=colv('c1'),v2=colv('c2'),v3=colv('c3'),v4=colv('c4');
  const cumData=prices.map(p=>{
    const tc=1-ecdfAt(v1,p), ch=1-ecdfAt(v2,p), ex=ecdfAt(v3,p), te=ecdfAt(v4,p);
    return {p, tc, ch, ex, te, nc:1-ch, ne:1-ex};
  });
  // 交点: 差(var1-var2)の符号が変わる区間ごとに線形補間で価格を求め、複数あるときは method(min/max/mean)で1つにする
  function identify(f1,f2){
    const d=cumData.map(x=>x[f1]-x[f2]);
    const sg=d.map(Math.sign);
    const cand=[];
    for(let i=0;i<sg.length-1;i++){
      if(sg[i+1]-sg[i]!==0){
        const x1=cumData[i].p, x2=cumData[i+1].p, y1=d[i], y2=d[i+1];
        cand.push(y2!==y1 ? x1 - y1*(x2-x1)/(y2-y1) : (x1+x2)/2);
      }
    }
    if(!cand.length) return null;
    if(cand.length===1) return cand[0];
    if(method==='max') return Math.max(...cand);
    if(method==='mean') return cand.reduce((s,v)=>s+v,0)/cand.length;
    return Math.min(...cand);
  }
  const points={
    PMC:identify('nc','tc'),   // 安すぎる × 安くない
    PME:identify('te','ne'),   // 高すぎる × 高くない
    IPP:identify('ex','ch'),   // 安い × 高い
    OPP:identify('te','tc')    // 安すぎる × 高すぎる
  };
  return {priceRange:prices, cumData, points, overlapWarnings:[]};
}


// ─── メイン実行 ───
function runPSM(){
  clearErr();
  const text=document.getElementById('csv-input').value;
  if(!text.trim()){showErr(t('errNoData'));return;}
  let parsed;
  try{parsed=parseCSV(text);}catch(e){showErr(e.message);return;}
  const {rows,skipped}=parsed;
  if(rows.length<3){showErr(t('errMin3'));return;}

  const method=document.getElementById('interp-method').value;
  const {priceRange,cumData,points}=calcPSM(rows,method);

  G={rows,priceRange,cumData,points,skipped,method};
  HAS_RESULT=true;
  document.getElementById('overlap-warn').style.display='none';
  document.getElementById('result-card').style.display='block';
  switchTab('graph');
  renderResultTexts();
  document.getElementById('result-card').scrollIntoView({behavior:'smooth'});
}
function renderResultTexts(){
  if(!HAS_RESULT) return;
  const {rows,priceRange,skipped,method}=G;
  document.getElementById('result-info').innerHTML=t('info',rows.length,priceRange.length,t('mlabel')[method],skipped);
  renderPoints();
  renderTable();
}

// ─── グラフ描画 ───
function drawChart(){
  const canvas=document.getElementById('psm-canvas');
  const W=canvas.parentElement.clientWidth-20||800;
  canvas.width=W; canvas.height=420;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,420);

  const {cumData,points,priceRange}=G;
  if(!cumData||!cumData.length) return;

  const PAD={top:30,bottom:60,left:60,right:30};
  const pW=W-PAD.left-PAD.right;
  const pH=420-PAD.top-PAD.bottom;

  const pMin=priceRange[0], pMax=priceRange[priceRange.length-1];
  const toX=p=>PAD.left+(p-pMin)/(pMax-pMin)*pW;
  const toY=v=>PAD.top+(1-v)*pH;

  ctx.strokeStyle='#edf0f4'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const y=toY(i/5);
    ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(W-PAD.right,y); ctx.stroke();
    ctx.fillStyle='#777'; ctx.font='10px sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText((i*20)+'%',PAD.left-4,y);
  }

  const {PMC,PME}=points;
  if(PMC!=null&&PME!=null&&PMC<PME){
    ctx.fillStyle='rgba(24,95,165,0.08)';
    ctx.fillRect(toX(PMC),PAD.top,toX(PME)-toX(PMC),pH);
  }

  const curves=[
    {key:'tc',color:'#e05c2a',dash:[]},
    {key:'ch',color:'#185FA5',dash:[]},
    {key:'ex',color:'#0e7c5a',dash:[]},
    {key:'te',color:'#8e44ad',dash:[]},
    {key:'nc',color:'#185FA5',dash:[6,4]},
    {key:'ne',color:'#0e7c5a',dash:[6,4]}
  ];
  curves.forEach(({key,color,dash})=>{
    ctx.strokeStyle=color; ctx.lineWidth=dash.length?1.5:2.5;
    ctx.setLineDash(dash);
    ctx.beginPath();
    cumData.forEach((d,i)=>{
      const x=toX(d.p), y=toY(d[key]);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke(); ctx.setLineDash([]);
  });

  // 交点の縦線・ラベル（近い交点のラベルが重ならないよう、段をずらす）
  const ptDefs=[
    {key:'PMC',color:'#e05c2a',label:'PMC'},
    {key:'OPP',color:'#f39c12',label:'OPP'},
    {key:'IPP',color:'#185FA5',label:'IPP'},
    {key:'PME',color:'#8e44ad',label:'PME'},
  ];
  const act=ptDefs.filter(d=>points[d.key]!=null).map(d=>({...d,x:toX(points[d.key]),px:points[d.key]})).sort((a,b)=>a.x-b.x);
  let lastX=-1e9, lvl=0;
  act.forEach(d=>{ if(d.x-lastX<46){ lvl=(lvl+1)%3; } else { lvl=0; } d.lvl=lvl; lastX=d.x; });
  act.forEach(({color,label,x,px,lvl})=>{
    ctx.strokeStyle=color; ctx.lineWidth=1.5;
    ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(x,PAD.top-4-lvl*13); ctx.lineTo(x,PAD.top+pH+14+lvl*13); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color; ctx.font='bold 11px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(label, x, PAD.top-6-lvl*13);
    ctx.textBaseline='top';
    ctx.fillText(fmtU(px), x, PAD.top+pH+16+lvl*13);
  });

  ctx.strokeStyle='#ccc'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PAD.left,PAD.top+pH); ctx.lineTo(W-PAD.right,PAD.top+pH); ctx.stroke();

  for(let i=0;i<=8;i++){
    const p=pMin+(pMax-pMin)*i/8, x=toX(p);
    ctx.fillStyle='#777'; ctx.font='10px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(fmt(Math.round(p)), x, PAD.top+pH+3);
  }

  ctx.fillStyle='#555'; ctx.font='12px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(t('axisX'), PAD.left+pW/2, 420-2);
  ctx.save(); ctx.translate(14, PAD.top+pH/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(t('axisY'),0,0); ctx.restore();
}

function nearestIdx(p){
  if(p==null||isNaN(p)) return -1;
  let bi=0,bd=Infinity;
  G.cumData.forEach((d,i)=>{const x=Math.abs(d.p-p); if(x<bd){bd=x;bi=i;}});
  return bi;
}
function renderTable(){
  const {cumData}=G;
  let html=`<table><thead><tr>
    <th>${t('thP')}</th><th>${t('th1')}</th><th>${t('th2')}</th><th>${t('th3')}</th><th>${t('th4')}</th><th>${t('thN2')}</th><th>${t('thN3')}</th>
  </tr></thead><tbody>`;
  const {PMC,PME,IPP,OPP}=G.points;
  const marks={};
  [['PMC',PMC],['PME',PME],['IPP',IPP],['OPP',OPP]].forEach(([k,v])=>{const i=nearestIdx(v); if(i>=0){(marks[i]=marks[i]||[]).push(k);}});
  const f=v=>(v*100).toFixed(1)+'%';
  cumData.forEach((d,i)=>{
    const hi=marks[i]||[];
    const bg=hi.length?'background:#fff9e6':'';
    html+=`<tr style="${bg}">
      <td><b>${fmt(d.p)}</b>${hi.length?` <span style="font-size:10px;color:#e05c2a">${t('near')}${hi.join('/')}</span>`:''}</td>
      <td>${f(d.tc)}</td><td>${f(d.ch)}</td><td>${f(d.ex)}</td><td>${f(d.te)}</td>
      <td>${f(d.nc)}</td><td>${f(d.ne)}</td>
    </tr>`;
  });
  html+='</tbody></table>';
  document.getElementById('table-wrap').innerHTML=html;
}

  const h=t('glossHead'), g=t('gloss');
  let html='<table><thead><tr>'+h.map(x=>`<th class="left">${x}</th>`).join('')+'</tr></thead><tbody>';
  g.forEach(r=>{ html+=`<tr><td class="left"><b>${r[0]}</b></td><td class="left">${r[1]}</td><td class="left">${r[2]}</td></tr>`; });
  html+='</tbody></table>';
  document.getElementById('gloss-wrap').innerHTML=html;
}

function downloadCSV(){
  const {cumData,points}=G;
  const rows=[t('csvHead')];
  cumData.forEach(d=>{
    const f=v=>(v*100).toFixed(2);
    rows.push([d.p,f(d.tc),f(d.ch),f(d.ex),f(d.te),f(d.nc),f(d.ne)].join(','));
  });
  rows.push('');
  rows.push(`${t('csvPMC')},${points.PMC}`);
  rows.push(`${t('csvOPP')},${points.OPP}`);
  rows.push(`${t('csvIPP')},${points.IPP}`);
  rows.push(`${t('csvPME')},${points.PME}`);
  const b64=btoa(unescape(encodeURIComponent('﻿'+rows.join('\n'))));
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8;base64,'+b64;
  a.download='psm_result.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// 言語が切り替わったときの再描画
function onLangChange(){
  renderGlossary();
  // 例題がそのまま入っているときは、見出し行だけ言語に合わせる
  const ta=document.getElementById('csv-input');
  if(ta.value.indexOf(CSV1_JA)===0) ta.value=(LANG==='ja'?CSV1_JA:CSV1_EN)+ta.value.slice(CSV1_JA.length);
  else if(ta.value.indexOf(CSV1_EN)===0) ta.value=(LANG==='ja'?CSV1_JA:CSV1_EN)+ta.value.slice(CSV1_EN.length);
  renderResultTexts();
  if(HAS_RESULT && document.getElementById('tab-graph').classList.contains('active')) drawChart();
}

// ───────── Rスクリプト出力（検算用） ─────────
function rsRaw(text){
  let d='---';
  while(text.indexOf(')'+d+'"')>=0) d+='-';
  return 'r"'+d+'(\n'+text.replace(/\r\n?/g,'\n').replace(/\s+$/,'')+'\n)'+d+'"';
}
const RS_FAIL={ja:'# スクリプトを作成できませんでした',en:'# Could not create the script'};
function rsHeader(title, pkgLines){
  const L=(LANG==='ja')?[
    '# =====================================================================',
    '# '+title,
    '# このスクリプトは、アプリに入力したデータと設定をそのまま埋め込んであります。',
    '# RStudioに貼り付けて、上から順に実行してください。',
    '# 日本語が文字化けするときは、RStudioの File > Reopen with Encoding > UTF-8 で開き直してください。',
    '# ====================================================================='
  ]:[
    '# =====================================================================',
    '# '+title,
    '# This script embeds the data and settings you entered in the app.',
    '# Paste it into RStudio and run it from top to bottom.',
    '# =====================================================================' 
  ];
  if(pkgLines&&pkgLines.length){ L.push('',(LANG==='ja'?'# 初回だけ、必要なパッケージをインストールしてください（先頭の # を外して実行）':'# Install the required package once (remove the leading # and run)')); pkgLines.forEach(p=>L.push(p)); }
  return L;
}
function rsMake(){
  const ta=document.getElementById('rs-text');
  try{ ta.value=buildRScript(); }
  catch(e){ ta.value=RS_FAIL[LANG]+': '+e.message; }
}
function rsFailed(v){ return v.indexOf(RS_FAIL.ja)===0||v.indexOf(RS_FAIL.en)===0; }
function rsCopy(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(()=>{}); }
  const b=document.getElementById('rs-copy-btn'); const old=b.textContent;
  b.textContent=t('copied'); setTimeout(()=>{b.textContent=t('rsCopy');},1500);
}
function rsDownload(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  const b64=btoa(unescape(encodeURIComponent('﻿'+ta.value)));
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8;base64,'+b64;
  a.download=RS_FILENAME;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
const RS_FILENAME='psm_check.R';
function buildRScript(){
  const text=document.getElementById('csv-input').value.trim();
  if(!text) throw new Error(t('errNoData'));
  const method=document.getElementById('interp-method').value;
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const sepc=lines[0].includes('\t')?'\t':',';
  lines[0]=['id','too_cheap','cheap','expensive','too_expensive'].join(sepc);
  const ja=(LANG==='ja');
  const L=rsHeader(ja?'PSM分析（Van Westendorp）: アプリ(psm.html)と同じ計算をRで行う':'PSM analysis (Van Westendorp): the same calculation as the app (psm.html), in R',
    ['# install.packages("pricesensitivitymeter")']);
  L.push('',
    'library(pricesensitivitymeter)',
    '',
    ja?'# 1. データ（アプリに入力した内容。列は 回答者ID, ①安すぎる, ②安い, ③高い, ④高すぎる の順）'
      :'# 1. Data (as entered in the app; columns: respondent ID, too cheap, cheap, expensive, too expensive)',
    'dat <- read.csv(text = '+rsRaw(lines.join('\n'))+',',
    '                sep = "'+(sepc==='\t'?'\\t':',')+'", header = TRUE)',
    '',
    ja?'# 2. 分析':'# 2. Analysis',
    ja?'#    validate = TRUE: ①<②<③<④ が成り立たない回答者を除く（アプリと同じ）'
      :'#    validate = TRUE: drops respondents who do not satisfy too cheap < cheap < expensive < too expensive (as in the app)',
    ja?'#    交点は、曲線の差の符号が変わる区間を線形補間して求め、複数あるときは "'+method+'" を採用'
      :'#    Each intersection is found by linear interpolation where the sign of the curve difference changes; if there are several, "'+method+'" is used',
    'res <- psm_analysis(',
    '  toocheap     = dat$too_cheap,',
    '  cheap        = dat$cheap,',
    '  expensive    = dat$expensive,',
    '  tooexpensive = dat$too_expensive,',
    '  validate = TRUE,',
    '  interpolate = FALSE,',
    '  intersection_method = "'+method+'"',
    ')',
    '',
    ja?'# 3. 結果（アプリの「交点・価格帯」タブと比べてください）':'# 3. Results (compare with the "Intersections & range" tab of the app)',
    ja?'cat("有効回答数                 :", res$total_sample - res$invalid_cases, "\\n")':'cat("Valid responses               :", res$total_sample - res$invalid_cases, "\\n")',
    ja?'cat("PMC（安すぎる x 安くない）  :", res$pricerange_lower, "\\n")':'cat("PMC (too cheap x not cheap)     :", res$pricerange_lower, "\\n")',
    ja?'cat("PME（高すぎる x 高くない）  :", res$pricerange_upper, "\\n")':'cat("PME (too expensive x not exp.)  :", res$pricerange_upper, "\\n")',
    ja?'cat("IPP（安い x 高い）          :", res$idp, "\\n")':'cat("IPP (cheap x expensive)         :", res$idp, "\\n")',
    ja?'cat("OPP（安すぎる x 高すぎる）  :", res$opp, "\\n")':'cat("OPP (too cheap x too expensive) :", res$opp, "\\n")',
    '',
    ja?'# 4. 曲線のデータ（アプリの「累積集計表」に対応）と、グラフ':'# 4. The curve data (corresponds to the "Cumulative table" tab) and the plot',
    'head(res$data_vanwestendorp)',
    'psm_plot(res)');
  return L.join('\n')+'\n';
}
