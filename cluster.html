<style>

.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
label{display:block;font-size:12px;font-weight:600;color:#555;
      margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
select,input[type=number],input[type=text]{
  width:100%;padding:7px 10px;border:1px solid #d0d5dd;
  border-radius:6px;font-size:13px;color:#1a2332;background:#fff;outline:none}
select:focus,input:focus{border-color:#185FA5;
  box-shadow:0 0 0 2px rgba(24,95,165,.15)}
textarea{width:100%;padding:10px;border:1px solid #d0d5dd;
         border-radius:6px;font-size:12px;font-family:monospace;

textarea:focus{border-color:#185FA5;box-shadow:0 0 0 2px rgba(24,95,165,.15)}
.btn-primary{background:#1a2332;color:#fff;border:none;padding:9px 22px;
             border-radius:6px;font-size:13px;font-weight:600;

.btn-primary:hover{background:#2d3d52}
.btn-secondary{background:#fff;color:#1a2332;border:1px solid #d0d5dd;
               padding:7px 16px;border-radius:6px;font-size:12px;

.btn-secondary:hover{border-color:#1a2332}

table{width:100%;border-collapse:collapse;font-size:13px}

td{padding:6px 10px;border-bottom:1px solid #edf0f4;text-align:center}

.stat-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.stat{text-align:center}
.stat-val{font-size:22px;font-weight:700;color:#185FA5}

<header><a class="backlink bl-ja" href="https://im-research-yt.github.io/ja/tools.html">← 分析ツール</a><a class="backlink bl-en" href="https://im-research-yt.github.io/tools.html">← Analysis tools</a><a class="backlink-home bl-ja" href="https://im-research-yt.github.io/ja/">ブログのトップ</a><a class="backlink-home bl-en" href="https://im-research-yt.github.io/">Blog home</a>
  <h1 data-i="h1"></h1>

<div style="background:#F28018;border-bottom:0;padding:10px 24px;margin-bottom:20px;font-size:12px;color:#1a2332;font-weight:700;line-height:1.6">
  <span data-i="disc1"></span><br><span data-i="disc2"></span>
</div>

<div class="container">

<!-- data input -->
<div class="card">
  <h2 data-i="cardData"></h2>
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn-secondary" onclick="loadExample(1)" data-i="ex1"></button>
    <button class="btn-secondary" onclick="loadExample(2)" data-i="ex2"></button>

    </label>
  </div>
  <label data-i="csvLabel"></label>
  <textarea id="csv-input" rows="10" data-ip="csvPh"></textarea>
  <div id="err-msg" class="err"></div>
</div>

<!-- settings -->
<div class="card">
  <h2 data-i="cardSet"></h2>

  <div class="row">
    <div>
      <label data-i="lblDist"></label>
      <select id="dist-method">
        <option value="euclidean" data-i="dEuc"></option>
        <option value="euclidean2" data-i="dEuc2"></option>
        <option value="manhattan" data-i="dMan"></option>

    <div>

        <option value="zscore" data-i="sZ"></option>

    </div>
    <div>
      <label data-i="lblK"></label>
      <select id="n-clusters">

        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>

          <option value="760">760px</option>

      <canvas id="dendro-canvas"></canvas>
    </div>
  </div>

    <div style="margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="downloadCSV()" data-i="dlMem"></button>
      <span id="auto-k-note" style="font-size:12px;color:#185FA5"></span>
    </div>
    <div id="membership-wrap"></div>
  </div>

    <div id="distance-wrap"></div>
  </div>

  <div class="panel" id="tab-glossary">
    <div class="tbl-wrap" id="gloss-wrap"></div>
  </div>
</div>

</div>

  </div>
</div>

<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}

function loadCSVFile(event){
  const file=event.target.files[0]; if(!file) return;
  const tryRead=enc=>{
    const r=new FileReader();
    r.onload=e=>{
      let t=e.target.result.replace(/^\uFEFF/,'');
      if(enc==='UTF-8'&&(t.match(/\uFFFD/g)||[]).length>3){tryRead('Shift-JIS');return;}
      document.getElementById('csv-input').value=t;
    };
    r.readAsText(file,enc);
  };
  tryRead('UTF-8'); event.target.value='';
}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<3) throw E('errRows3');
  const sep=lines[0].includes('\t')?'\t':',';
  const headers=lines[0].split(sep).map(h=>h.trim());
  if(headers.length<3) throw E('errCols3');
  const varNames=headers.slice(1);
  const cases=[], rawData=[];
  for(let i=1;i<lines.length;i++){
    const row=lines[i].split(sep).map(v=>v.trim());
    if(row.length!==headers.length) throw E('errColMismatch',i+1);
    const vals=row.slice(1).map((v,ci)=>{
      const n=+v;
      if(isNaN(n)) throw E('errNaN',i+1,varNames[ci],v);
      return n;
    });
    cases.push(row[0]); rawData.push(vals);
  }
  return {cases, varNames, rawData};
}

// ─── 標準化 ───
function standardize(data, method){
  const n=data.length, m=data[0].length;
  if(method==='none') return data.map(r=>[...r]);
  const result=data.map(r=>[...r]);
  for(let j=0;j<m;j++){
    const col=data.map(r=>r[j]);
    const mean=col.reduce((a,b)=>a+b,0)/n;
    if(method==='zscore'){
      const sd=Math.sqrt(col.reduce((a,v)=>a+(v-mean)**2,0)/(n-1))||1;  // Rのscale()と同じ（n-1で割る）
      for(let i=0;i<n;i++) result[i][j]=(data[i][j]-mean)/sd;
    } else { // minmax
      const mn=Math.min(...col), mx=Math.max(...col), rng=mx-mn||1;
      for(let i=0;i<n;i++) result[i][j]=(data[i][j]-mn)/rng;
    }
  }
  return result;
}

// ─── 距離行列 ───
function calcDist(data, method){
  const n=data.length;
  const mat=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    let d=0;
    if(method==='euclidean'){
      d=Math.sqrt(data[i].reduce((s,v,k)=>s+(v-data[j][k])**2,0));
    } else if(method==='euclidean2'){
      d=data[i].reduce((s,v,k)=>s+(v-data[j][k])**2,0);
    } else if(method==='manhattan'){
      d=data[i].reduce((s,v,k)=>s+Math.abs(v-data[j][k]),0);
    } else if(method==='cosine'){
      const dot=data[i].reduce((s,v,k)=>s+v*data[j][k],0);
      const ni=Math.sqrt(data[i].reduce((s,v)=>s+v*v,0));
      const nj=Math.sqrt(data[j].reduce((s,v)=>s+v*v,0));
      d=1-(ni&&nj?dot/(ni*nj):0);
    }
    mat[i][j]=mat[j][i]=d;
  }
  return mat;
}

// ─── 階層クラスタリング（Lance-Williams公式） ───
function hierarchicalCluster(distMat, method, sq){
  const n=distMat.length;
  // 作業用距離行列（クラスターサイズも管理）
  let D=distMat.map(r=>[...r]);
  let sizes=new Array(n).fill(1);
  let active=Array.from({length:n},(_,i)=>i);
  const merges=[], heights=[];

  // クラスターIDを管理（初期はケースインデックス）
  // mergeは [clusterA, clusterB, height, newSize]
  let nextId=n;
  let clusterOf=Array.from({length:n},(_,i)=>i); // 現在のクラスターID
  const clusterMap=new Map(); // clusterId → [original indices]
  for(let i=0;i<n;i++) clusterMap.set(i,[i]);

  for(let step=0;step<n-1;step++){
    // 最小距離ペアを探す
    let minD=Infinity, minI=-1, minJ=-1;
    for(let ii=0;ii<active.length;ii++)
      for(let jj=ii+1;jj<active.length;jj++){
        const a=active[ii],b=active[jj];
        if(D[a][b]<minD){minD=D[a][b];minI=a;minJ=b;}
      }

    const na=sizes[minI], nb=sizes[minJ];
    const newId=nextId++;
    const newSize=na+nb;
    clusterMap.set(newId,[...(clusterMap.get(minI)||[minI]),
                          ...(clusterMap.get(minJ)||[minJ])]);

    // 新距離をLance-Williams公式で計算
    const newRow=new Array(nextId).fill(Infinity);
    for(const k of active){
      if(k===minI||k===minJ) continue;
      const nk=sizes[k];
      let d;
      if(method==='single'){
        d=Math.min(D[minI][k],D[minJ][k]);
      } else if(method==='complete'){
        d=Math.max(D[minI][k],D[minJ][k]);
      } else if(method==='average'){
        d=(na*D[minI][k]+nb*D[minJ][k])/(na+nb);
      } else if(method==='centroid'){
        d=(na*D[minI][k]+nb*D[minJ][k])/(na+nb)
          -na*nb*(D[minI][k]-D[minJ][k])**2/((na+nb)**2); // 修正重心法
        // 単純重心法
        d=(na/(na+nb))*D[minI][k]+(nb/(na+nb))*D[minJ][k]
          -(na*nb/(na+nb)**2)*D[minI][minJ];
      } else if(method==='ward' && sq){
        // 入力が「距離の2乗」のときはそのままLance-Williams（Ward.D）
        d=((nk+na)*D[minI][k]+(nk+nb)*D[minJ][k]-nk*D[minI][minJ])/(nk+na+nb);
      } else if(method==='ward'){
        d=Math.sqrt(
          ((nk+na)*D[minI][k]**2+(nk+nb)*D[minJ][k]**2-nk*D[minI][minJ]**2)
          /(nk+na+nb)
        );
        // Ward: 増加分ベース
        d=Math.sqrt(
          (nk+na)/(nk+na+nb)*D[minI][k]**2+
          (nk+nb)/(nk+na+nb)*D[minJ][k]**2-
          nk/(nk+na+nb)*D[minI][minJ]**2
        );
      }
      // D配列を拡張
      while(D.length<=newId){D.push([]);sizes.push(0);}
      while(D[newId].length<=Math.max(k,newId)) D[newId].push(Infinity);
      while(D[k].length<=newId) D[k].push(Infinity);
      D[newId][k]=D[k][newId]=d;
    }
    while(D.length<=newId){D.push([]);sizes.push(0);}
    sizes[newId]=newSize;

    merges.push({
      a:minI, b:minJ, height:minD,
      newId, members:clusterMap.get(newId)
    });
    heights.push(minD);

    // active を更新
    active=active.filter(x=>x!==minI&&x!==minJ);
    active.push(newId);
  }
  return {merges, heights};
}

// ─── クラスター割り当て ───
function assignClusters(merges, n, nClusters){
  // mergesをたどってnClustersのクラスターに分割
  if(nClusters>=n) return Array.from({length:n},(_,i)=>i);
  // 後ろから (n-nClusters) ステップを無効化
  const cutAt=n-nClusters;
  const parent=Array.from({length:merges.length+n},(_,i)=>i);
  for(let s=0;s<cutAt;s++){
    const {a,b,newId}=merges[s];
    parent[a]=newId; parent[b]=newId;
  }
  // 各ケースのrootを見つける
  function root(x){
    while(parent[x]!==x&&parent[parent[x]]!==parent[x]) x=parent[x];
    return parent[x]===x?x:parent[parent[x]];
  }
  const roots=[...new Set(Array.from({length:n},(_,i)=>root(i)))];
  return Array.from({length:n},(_,i)=>roots.indexOf(root(i)));
}

// ─── メイン ───
function runClustering(opts){
  const keep=!!(opts&&opts.keep);
  clearErr();
  const text=document.getElementById('csv-input').value;
  if(!text.trim()){showErr(E('errNoData'));return;}
  let parsed;
  try{parsed=parseCSV(text);}
  catch(e){showErr(e);return;}

  const {cases,varNames,rawData}=parsed;
  const stdMethod=document.getElementById('standardize').value;
  const distMethod=document.getElementById('dist-method').value;
  const linkageMethod=document.getElementById('linkage-method').value;
  const stdData=standardize(rawData,stdMethod);
  const nClustVal=document.getElementById('n-clusters').value;

  function autoDetectK(merges){
    const n=merges.length; // = nCases - 1
    if(n<2) return 2;
    const diffs=merges.map((m,i)=>i===0?m.height:m.height-merges[i-1].height);
    // i=1以降で最大増加量を探す（i=0は初期値なので除外）
    let maxDiff=-Infinity, maxIdx=n-1;
    for(let i=1;i<n;i++){
      if(diffs[i]>maxDiff){maxDiff=diffs[i];maxIdx=i;}
    }
    // stepIdx (0-based) で結合するとクラスター数が (n+1-stepIdx-1) = n-stepIdx になる
    // その結合を「しない」→ 推奨k = n+1 - maxIdx
    // 例: n=19, maxIdx=17 → k = 19+1-17 = 3
    return Math.max(2, n + 1 - maxIdx);
  }

  const {merges:tmpMerges}=hierarchicalCluster(
    calcDist(stdData, distMethod), linkageMethod, distMethod==='euclidean2'
  );
  const autoK=autoDetectK(tmpMerges);
  G.nClusters=nClustVal==='auto'?autoK:Math.max(2,Math.min(+nClustVal,cases.length-1));
  const distMat=calcDist(stdData,distMethod);
  const {merges,heights}=hierarchicalCluster(distMat,linkageMethod,distMethod==='euclidean2');
  // autoK をUIに反映
  if(nClustVal==='auto'){
    document.getElementById('n-clusters').value='auto';
  }
  const clusters=assignClusters(merges,cases.length,G.nClusters);

  G.cases=cases; G.varNames=varNames; G.rawData=rawData;
  G.stdData=stdData; G.distMat=distMat;
  G.merges=merges; G.heights=heights;
  G.clusters=clusters;

  document.getElementById('result-card').style.display='block';
  if(keep){
    renderMembership();
    renderDistMatrix();
    if(document.getElementById('tab-dendrogram').classList.contains('active')) drawDendrogram();
  } else {
    switchTab('dendrogram');
    renderMembership();
    renderDistMatrix();
    document.getElementById('result-card').scrollIntoView({behavior:'smooth'});
  }
}

function redrawAll(){
  drawDendrogram();
}

// ─── デンドログラム ───
function drawDendrogram(){
  const canvas=document.getElementById('dendro-canvas');
  const H=+(document.getElementById('dendro-height')?.value||520);
  canvas.height=H;
  const W=canvas.parentElement.clientWidth||800;
  canvas.width=W;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  const n=G.cases.length;
  const merges=G.merges;
  if(!merges||merges.length===0) return;

  const maxH=Math.max(...merges.map(m=>m.height));
  const PAD={top:20,bottom:60,left:50,right:20};
  const plotW=W-PAD.left-PAD.right;
  // ラベルが隣と重なるときは斜めに回転し、下の余白を広げる
  const showLbl=!!document.getElementById('show-labels')?.checked;
  let rotLbl=false;
  if(showLbl){
    ctx.font='bold 12px sans-serif';
    const maxW=Math.max(...G.cases.map(c=>ctx.measureText(String(c)).width));
    if(maxW>plotW/n-4){rotLbl=true; PAD.bottom=Math.min(H*0.45,Math.ceil(maxW*Math.SQRT1_2)+24);}
  }
  const plotH=H-PAD.top-PAD.bottom;

  // 葉の順序を決める（デンドログラムの左から右）
  const order=[];
  function getOrder(id){
    if(id<n){order.push(id);return;}
    const merge=merges.find(m=>m.newId===id);
    if(!merge) return;
    getOrder(merge.a); getOrder(merge.b);
  }
  getOrder(merges[merges.length-1].newId);

  const xPos={};
  order.forEach((id,i)=>{xPos[id]=(i+0.5)/n*plotW+PAD.left;});

  // クラスター割り当て
  const nClusters=G.nClusters;
  const cutMergeIdx=n-nClusters; // この結合以降がカット後
  // カットラインは「カット直前の結合高さ」と「カット直後の結合高さ」の中間に引く
  const cutHeightBelow=cutMergeIdx>0?merges[cutMergeIdx-1].height:0;
  const cutHeightAbove=cutMergeIdx<merges.length?merges[cutMergeIdx].height:maxH;
  const cutHeight=cutMergeIdx>0?(cutHeightBelow+cutHeightAbove)/2:cutHeightAbove/2;

  // クラスターカラーをマージから取得
  const clusterColor={};
  G.cases.forEach((_,i)=>clusterColor[i]=G.clusterColors[G.clusters[i]%G.clusterColors.length]);

  // 各マージ点のx座標（左右の中点）
  function getMergeX(id){
    if(id<n) return xPos[id];
    const merge=merges.find(m=>m.newId===id);
    if(!merge) return PAD.left;
    return (getMergeX(merge.a)+getMergeX(merge.b))/2;
  }

  // y座標（高さ → 画面）
  const toY=h=>PAD.top+plotH*(1-h/maxH);

  // 描画
  function drawMerge(id, parentColor){
    if(id<n){
      // 葉：ラベル
      if(document.getElementById('show-labels')?.checked){
        ctx.fillStyle='#333';
        ctx.font='bold 12px sans-serif';
        if(rotLbl){
          ctx.save();
          ctx.translate(xPos[id], H-PAD.bottom+8);
          ctx.rotate(-Math.PI/4);
          ctx.textAlign='right'; ctx.textBaseline='middle';
          ctx.fillText(G.cases[id], 0, 0);
          ctx.restore();
        } else {
          ctx.textAlign='center';
          ctx.textBaseline='top';
          ctx.fillText(G.cases[id], xPos[id], H-PAD.bottom+6);
        }
      }
      // クラスターの色バー
      ctx.fillStyle=G.clusterColors[G.clusters[id]%G.clusterColors.length];
      ctx.fillRect(xPos[id]-6,H-PAD.bottom-8,12,8);
      return;
    }
    const merge=merges.find(m=>m.newId===id);
    if(!merge) return;

    const mergeIdx=merges.indexOf(merge);
    const isCut=mergeIdx>=cutMergeIdx;
    const color=isCut?'#aaa':(parentColor||'#1a2332');

    const ax=getMergeX(merge.a);
    const bx=getMergeX(merge.b);
    const mx=(ax+bx)/2;
    const myY=toY(merge.height);
    const ayY=merge.a<n?H-PAD.bottom:toY(merges.find(m=>m.newId===merge.a)?.height||0);
    const byY=merge.b<n?H-PAD.bottom:toY(merges.find(m=>m.newId===merge.b)?.height||0);

    ctx.strokeStyle=color;
    ctx.lineWidth=isCut?1.5:2;
    ctx.beginPath();
    // 水平線
    ctx.moveTo(ax,myY); ctx.lineTo(bx,myY);
    // 左垂直線
    ctx.moveTo(ax,myY); ctx.lineTo(ax,ayY);
    // 右垂直線
    ctx.moveTo(bx,myY); ctx.lineTo(bx,byY);
    ctx.stroke();

    // 高さラベル
    if(!isCut){
      ctx.fillStyle='#555';
      ctx.font='10px sans-serif';
      ctx.textAlign='left';
      ctx.textBaseline='middle';
      ctx.fillText(merge.height.toFixed(3),mx+3,myY);
    }

    drawMerge(merge.a, color);
    drawMerge(merge.b, color);
  }

  drawMerge(merges[merges.length-1].newId, null);

  // Y軸
  ctx.strokeStyle='#ccc'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(PAD.left,PAD.top); ctx.lineTo(PAD.left,H-PAD.bottom);
  ctx.stroke();
  const ticks=5;
  for(let i=0;i<=ticks;i++){
    const h=maxH*i/ticks;
    const y=toY(h);
    ctx.fillStyle='#555'; ctx.font='10px sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(h.toFixed(2),PAD.left-4,y);
    ctx.strokeStyle='#eee'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(W-PAD.right,y); ctx.stroke();
  }

  // カットライン
  if(document.getElementById('show-cut')?.checked&&cutMergeIdx>0){
    const cy=toY(cutHeight);
    ctx.strokeStyle='#e05c2a'; ctx.lineWidth=2;
    ctx.setLineDash([6,3]);
    ctx.beginPath(); ctx.moveTo(PAD.left,cy); ctx.lineTo(W-PAD.right,cy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#e05c2a'; ctx.font='bold 11px sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(t('cutLbl',nClusters),PAD.left+4,cy-2);
  }

  // 軸ラベル
  ctx.save();
  ctx.translate(12,H/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillStyle='#555'; ctx.font='12px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(t('axisH'),0,0);
  ctx.restore();
}

// ─── 所属テーブル ───
function renderMembership(){
  const autoNote=document.getElementById('auto-k-note');
  if(autoNote && document.getElementById('n-clusters').value==='auto'){
    autoNote.textContent=t('autoK',G.nClusters);
  } else if(autoNote){
    autoNote.textContent='';
  }
  const clusterGroups={};
  G.cases.forEach((c,i)=>{
    const ci=G.clusters[i];
    if(!clusterGroups[ci]) clusterGroups[ci]=[];
    clusterGroups[ci].push({name:c, idx:i});
  });

  let html='<div class="stat-row">';
  Object.keys(clusterGroups).sort((a,b)=>+a-+b).forEach(ci=>{
    html+=`<div class="stat">
      <div class="stat-val" style="color:${G.clusterColors[+ci%G.clusterColors.length]}">${clusterGroups[ci].length}</div>
      <div class="stat-lbl">${t('clusterN',+ci+1)}</div></div>`;
  });
  html+='</div>';

  // テーブル
  html+='<div class="tbl-wrap"><table><thead><tr><th>'+t('thCase')+'</th>';
  G.varNames.forEach(v=>html+=`<th>${v}</th>`);
  html+='<th>'+t('thCluster')+'</th></tr></thead><tbody>';

  // クラスター順に並べる
  const sorted=[...Array(G.cases.length).keys()].sort((a,b)=>G.clusters[a]-G.clusters[b]||a-b);
  sorted.forEach(i=>{
    const ci=G.clusters[i];
    const color=G.clusterColors[ci%G.clusterColors.length];
    html+=`<tr><td class="left">${G.cases[i]}</td>`;
    G.rawData[i].forEach(v=>html+=`<td>${v}</td>`);
    html+=`<td><span class="cluster-badge" style="background:${color}">C${ci+1}</span></td></tr>`;
  });
  html+='</tbody></table></div>';

  // クラスター別平均
  html+='<h3 style="margin-top:16px;margin-bottom:8px;font-size:13px;font-weight:700">'+t('avgH')+'</h3>';
  html+='<div class="tbl-wrap"><table><thead><tr><th>'+t('thCluster')+'</th><th>n</th>';
  G.varNames.forEach(v=>html+=`<th>${v}</th>`);
  html+='</tr></thead><tbody>';
  Object.keys(clusterGroups).sort((a,b)=>+a-+b).forEach(ci=>{
    const members=clusterGroups[ci];
    const color=G.clusterColors[+ci%G.clusterColors.length];
    html+=`<tr><td><span class="cluster-badge" style="background:${color}">C${+ci+1}</span></td>`;
    html+=`<td>${members.length}</td>`;
    G.varNames.forEach((_,k)=>{
      const avg=members.reduce((s,m)=>s+G.rawData[m.idx][k],0)/members.length;
      html+=`<td>${avg.toFixed(2)}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';

  document.getElementById('membership-wrap').innerHTML=html;
}

// ─── 距離行列 ───
function renderDistMatrix(){
  const n=G.cases.length;
  const D=G.distMat;
  const maxD=Math.max(...D.flat().filter(v=>v>0));

  let html='<div class="tbl-wrap"><table><thead><tr><th></th>';
  G.cases.forEach(c=>html+=`<th>${c}</th>`);
  html+='</tr></thead><tbody>';
  for(let i=0;i<n;i++){
    html+=`<tr><td class="left" style="font-weight:700">${G.cases[i]}</td>`;
    for(let j=0;j<n;j++){
      const v=D[i][j];
      const intensity=maxD>0?v/maxD:0;
      const bg=i===j?'#f4f6f9':`rgba(24,95,165,${(intensity*0.6).toFixed(2)})`;
      const fg=intensity>0.5?'#fff':'#333';
      html+=`<td style="background:${bg};color:${fg}">${i===j?t('dash'):v.toFixed(3)}</td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  document.getElementById('distance-wrap').innerHTML=html;
}

// ─── CSVダウンロード ───
function downloadCSV(){
  if(!G.cases||G.cases.length===0) return;
  const rows=[];
  // ヘッダー
  rows.push([t('thCase'),...G.varNames,t('thCluster'),t('thClusterNo')].join(','));
  // データ
  G.cases.forEach((name,i)=>{
    const ci=G.clusters[i];
    rows.push([
      name,
      ...G.rawData[i],
      `C${ci+1}`,
      ci+1
    ].join(','));
  });
  const bom='﻿';
  const blob=new Blob([bom+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='cluster_result.csv';
  a.click(); URL.revokeObjectURL(url);
}






function renderGlossary(){
  const h=t('glossHead'), g=t('gloss');
  let html='<table><thead><tr>'+h.map(x=>`<th class="left">${x}</th>`).join('')+'</tr></thead><tbody>';
  g.forEach(r=>{ html+=`<tr><td class="left"><b>${r[0]}</b></td><td class="left">${r[1]}</td></tr>`; });
  html+='</tbody></table>';
  document.getElementById('gloss-wrap').innerHTML=html;
}

// re-render after a language switch (results are rebuilt from G; nothing is recomputed unless an example text was swapped)
function onLangChange(){
  renderGlossary();
  const ta=document.getElementById('csv-input');
  const ei=exampleIndex(ta.value);
  const hasResult=G.cases&&G.cases.length>0;
  let reran=false;
  if(ei&&ta.value!==exText(ei)){
    ta.value=exText(ei);
    if(hasResult){ runClustering({keep:true}); reran=true; }
  }
  paintErr();
  if(hasResult&&!reran){
    renderMembership();
    renderDistMatrix();
    if(document.getElementById('tab-dendrogram').classList.contains('active')) drawDendrogram();
  }
  const rt=document.getElementById('rs-text');
  if(rt&&rt.value) rsMake();
}

// ───────── R script output (check) ─────────
function rsRaw(text){
  let d='---';
  while(text.indexOf(')'+d+'"')>=0) d+='-';
  return 'r"'+d+'(\n'+text.replace(/\r\n?/g,'\n').replace(/\s+$/,'')+'\n)'+d+'"';
}
const RS_FAIL={ja:'# スクリプトを作成できませんでした',en:'# Could not create the script'};
function rsHeader(title, pkgLines){
  const L=(LANG==='ja')?[
    '# =====================================================================',
    '# '+title,
    '# このスクリプトは、アプリに入力したデータと設定をそのまま埋め込んであります。',
    '# RStudioに貼り付けて、上から順に実行してください。',
    '# 日本語が文字化けするときは、RStudioの File > Reopen with Encoding > UTF-8 で開き直してください。',
    '# ====================================================================='
  ]:[
    '# =====================================================================',
    '# '+title,
    '# This script embeds the data and settings you entered in the app.',
    '# Paste it into RStudio and run it from top to bottom.',
    '# ====================================================================='
  ];
  if(pkgLines&&pkgLines.length){ L.push('',(LANG==='ja'?'# 初回だけ、必要なパッケージをインストールしてください（先頭の # を外して実行）':'# Install the required package once (remove the leading # and run)')); pkgLines.forEach(p=>L.push(p)); }
  return L;
}
function rsMake(){
  const ta=document.getElementById('rs-text');
  try{ ta.value=buildRScript(); }
  catch(e){ ta.value=RS_FAIL[LANG]+': '+e.message; }
}
function rsFailed(v){ return v.indexOf(RS_FAIL.ja)===0||v.indexOf(RS_FAIL.en)===0; }
function rsCopy(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(()=>{}); }
  const b=document.getElementById('rs-copy-btn');
  b.textContent=t('copied'); setTimeout(()=>{b.textContent=t('rsCopy');},1500);
}
function rsDownload(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  const b64=btoa(unescape(encodeURIComponent('﻿'+ta.value)));
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8;base64,'+b64;
  a.download=RS_FILENAME;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
const RS_FILENAME='cluster_check.R';
function buildRScript(){
  const text=document.getElementById('csv-input').value;
  if(!text.trim()) throw E('errRsNoData');
  const parsed=parseCSV(text);
  const dist=document.getElementById('dist-method').value;
  const link=document.getElementById('linkage-method').value;
  const std=document.getElementById('standardize').value;
  const nclVal=document.getElementById('n-clusters').value;
  const rawLines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  const sepc=rawLines[0].includes('\t')?'\t':',';
  const p=parsed.varNames.length;
  rawLines[0]=['case'].concat(parsed.varNames.map((_,i)=>'v'+(i+1))).join(sepc);
  const method= link==='ward' ? (dist==='euclidean2'?'ward.D':'ward.D2') : link;
  const ja=(LANG==='ja');
  const distCode={
    euclidean:'dist(X, method = "euclidean")',
    euclidean2:'dist(X, method = "euclidean")^2',
    manhattan:'dist(X, method = "manhattan")',
    cosine:'as.dist(1 - tcrossprod(X) / outer(sqrt(rowSums(X^2)), sqrt(rowSums(X^2))))'
  }[dist];
  const stdCode={
    none:ja?'# 標準化なし':'# No standardization',
    zscore:'X <- scale(X)   '+(ja?'# Zスコア（平均0、標準偏差1。n-1で割る）':'# Z-score (mean 0, SD 1; divides by n - 1)'),
    minmax:'X <- apply(X, 2, function(v) (v - min(v)) / (max(v) - min(v)))   '+(ja?'# Min-Max（0〜1）':'# Min-max (0 to 1)')
  }[std];
  const L=rsHeader(ja?'階層クラスター分析: アプリ(cluster.html)と同じ計算をRで行う（標準関数 hclust のみ）'
                     :'Hierarchical clustering: the same calculation as the app (cluster.html), in R (base function hclust only)');
  L.push('',
    (ja?'# 変数の対応: ':'# Variable mapping: ')+parsed.varNames.map((v,i)=>'v'+(i+1)+'='+v).join(', '),
    '',
    ja?'# 1. データ（1列目はケース名）':'# 1. Data (column 1 holds the case names)',
    'dat <- read.csv(text = '+rsRaw(rawLines.join('\n'))+',',
    '                sep = "'+(sepc==='\t'?'\\t':',')+'", header = TRUE, row.names = 1)',
    'X <- as.matrix(dat)',
    '',
    ja?'# 2. 標準化と距離':'# 2. Standardization and distance',
    stdCode,
    'D <- '+distCode,
    '',
    ja?'# 3. 階層クラスタリング（結合法: '+link+' → hclust の method = "'+method+'"）'
      :'# 3. Hierarchical clustering (linkage: '+link+' -> hclust method = "'+method+'")',
    'hc <- hclust(D, method = "'+method+'")',
    '');
  if(nclVal==='auto'){
    L.push(ja?'# 4. クラスター数: アプリの「自動（最大段差）」と同じ規則':'# 4. Number of clusters: the same rule as "Auto (largest gap)" in the app',
      ja?'#    併合高さの増加量が最大になる直前でカット（最小2）':'#    Cut just before the largest increase in merge height (minimum 2)',
      'nm  <- length(hc$height)',
      'dif <- c(hc$height[1], diff(hc$height))',
      'k   <- if (nm < 2) 2 else max(2, nm + 1 - which.max(dif[-1]))');
  } else {
    L.push(ja?'# 4. クラスター数（アプリで指定した値）':'# 4. Number of clusters (the value set in the app)',
      'k <- '+Math.max(2,Math.min(+nclVal,parsed.cases.length-1)));
  }
  L.push('',
    'cl <- cutree(hc, k = k)',
    '',
    ja?'# 5. 結果（アプリの「デンドログラム」「所属」タブと比べてください）':'# 5. Results (compare with the "Dendrogram" and "Cluster membership" tabs of the app)',
    ja?'cat("クラスター数 k =", k, "\\n")':'cat("Number of clusters k =", k, "\\n")',
    ja?'cat("併合の高さ:\\n"); print(round(hc$height, 4))':'cat("Merge heights:\\n"); print(round(hc$height, 4))',
    'print(data.frame(case = rownames(X), cluster = cl))',
    'print(table(cl))',
    '',
    ja?'# 6. デンドログラム':'# 6. Dendrogram',
    'plot(hc, hang = -1)',
    'rect.hclust(hc, k = k)');
  return L.join('\n')+'\n';
}
