<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjoint Analysis Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Sans','Meiryo',sans-serif;
     background:#f4f6f9;color:#1a2332;font-size:14px;line-height:1.6}
header{background:#233A9A;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;font-weight:600}
.badge{background:#F28018;color:#1a2332;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.disclaimer{background:#F28018;border-bottom:0;padding:10px 24px;margin-bottom:20px;
            font-size:12px;color:#1a2332;font-weight:700;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.card{background:#fff;border-radius:8px;border:1px solid #e0e4ea;padding:20px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:700;color:#1a2332;margin-bottom:14px;
         padding-bottom:8px;border-bottom:2px solid #e05c2a;display:inline-block}
.step-badge{display:inline-block;background:#e05c2a;color:#fff;font-size:11px;font-weight:700;
            padding:2px 10px;border-radius:10px;margin-right:8px;vertical-align:middle}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;
      text-transform:uppercase;letter-spacing:.4px}
select,input[type=number],input[type=text]{width:100%;padding:7px 10px;border:1px solid #d0d5dd;
  border-radius:6px;font-size:13px;color:#1a2332;background:#fff;outline:none}
select:focus,input:focus{border-color:#1a2332;box-shadow:0 0 0 2px rgba(26,35,50,.12)}
textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:6px;
         font-size:12px;font-family:monospace;resize:vertical;outline:none;min-height:120px}
textarea:focus{border-color:#1a2332;box-shadow:0 0 0 2px rgba(26,35,50,.12)}
.btn-primary{background:#1a2332;color:#fff;border:none;padding:9px 22px;
             border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:#2d3d52}
.btn-secondary{background:#fff;color:#1a2332;border:1px solid #d0d5dd;
               padding:7px 16px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-secondary:hover{border-color:#1a2332}
.btn-dl{background:#0e7c5a;color:#fff;border:none;padding:7px 16px;
        border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
.btn-dl:hover{background:#0a5c42}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.err{color:#c0392b;font-size:12px;padding:8px 12px;background:#fdf0ee;
     border:1px solid #f5c6c0;border-radius:6px;margin-top:8px;display:none}
.info{font-size:12px;color:#185FA5;padding:8px 12px;background:#e8f0fd;
      border:1px solid #c5d8f9;border-radius:6px;margin:8px 0}
.note{font-size:11px;color:#777;margin-top:6px;line-height:1.6}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#1a2332;color:#fff;padding:7px 10px;text-align:center;
   font-weight:600;font-size:11px;white-space:nowrap}
th.left{text-align:left}
td{padding:6px 10px;border-bottom:1px solid #edf0f4;text-align:center;white-space:nowrap}
td.left{text-align:left}
tr:nth-child(even) td{background:#f8fafc}
.stat-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.stat{text-align:center}
.stat-val{font-size:22px;font-weight:700;color:#185FA5}
.stat-lbl{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.4px}
.tabs{display:flex;gap:0;border-bottom:2px solid #e0e4ea;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
     color:#777;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#1a2332;border-bottom-color:#e05c2a}
.panel{display:none}.panel.active{display:block}
.attr-block{background:#f8fafc;border:1px solid #e0e4ea;border-radius:6px;padding:12px;
            flex:1;min-width:200px}
.attr-block h3{font-size:12px;font-weight:700;color:#1a2332;margin-bottom:8px}
.level-input{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.level-input input{flex:1;min-width:0}
.level-input .lbl{font-size:11px;color:#777;white-space:nowrap;min-width:40px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:10px}
.profile-card{border:1.5px solid #1a2332;border-radius:8px;padding:12px;background:#fff}
.profile-card .num{font-size:11px;font-weight:700;color:#e05c2a;margin-bottom:6px}
.profile-card table{font-size:12px}
.profile-card td{padding:3px 6px;border-bottom:1px solid #f0f0f0;text-align:left;white-space:normal}
.profile-card td:first-child{color:#555;width:45%}
.bar-wrap{height:16px;background:#edf0f4;border-radius:4px;overflow:hidden}
.bar{height:100%;border-radius:4px}
canvas{max-width:100%}
.respondent-select{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
@media print{
  header,.card:not(#result-card),.btn-row,.tabs{display:none}
  .panel{display:block!important}#tab-cards{display:block!important}
  .card-grid{grid-template-columns:repeat(4,1fr)}
}

.langsw{margin-left:auto;display:flex;gap:4px}
.langsw button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;
  padding:3px 10px;font-size:12px;cursor:pointer}
.langsw button.on{background:#fff;color:#233A9A;font-weight:700}
.foot{max-width:1100px;margin:0 auto;padding:0 16px 28px;font-size:11px;color:#777}
</style>
<script data-goatcounter="https://yuki-toyoda.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <h1 data-i="h1"></h1>
  <span class="badge">Conjoint Analysis</span>
  <div class="langsw"><button type="button" data-lang="ja" onclick="setLang('ja')">日本語</button><button type="button" data-lang="en" onclick="setLang('en')">English</button></div>
</header>
<div class="disclaimer"><span data-i="disc1"></span><br><span data-i="disc2"></span></div>

<div class="container">

<div class="card" id="card-step1">
  <h2><span class="step-badge">Step 1</span><span data-i="step1T"></span></h2>
  <div class="row" style="margin-bottom:14px">
    <div>
      <label data-i="nAttr"></label>
      <select id="n-attr" onchange="buildAttrInputs()">
        <option value="2">2</option><option value="3">3</option>
        <option value="4" selected>4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option>
      </select>
    </div>
    <div style="display:flex;align-items:flex-end;gap:8px">
      <button class="btn-secondary" onclick="loadExample(1)" data-i="ex1"></button>
      <button class="btn-secondary" onclick="loadExample(2)" data-i="ex2"></button>
      <button class="btn-secondary" onclick="resetDesign()" style="color:#c0392b;border-color:#c0392b" data-i="reset"></button>
    </div>
  </div>
  <div id="attr-inputs"></div>
  <div class="btn-row">
    <button class="btn-primary" onclick="generateDesign()" data-i="gen"></button>
  </div>
  <div id="design-err" class="err"></div>

  <div id="design-result" style="display:none;margin-top:16px">
    <div id="design-info" class="info" style="margin-bottom:10px"></div>
    <div class="tabs" id="design-tabs">
      <div class="tab active" onclick="switchDesignTab('profiles')" data-i="tabProf"></div>
      <div class="tab" onclick="switchDesignTab('ortho')" data-i="tabOrtho"></div>
      <div class="tab" onclick="switchDesignTab('cards')" data-i="tabCards"></div>
    </div>
    <div class="panel active" id="dtab-profiles">
      <div class="btn-row">
        <button class="btn-dl" onclick="downloadDesignCSV('profiles')" data-i="dlProf"></button>
        <button class="btn-dl" onclick="downloadDesignCSV('dummy')" data-i="dlDummy"></button>
      </div>
      <div class="tbl-wrap" id="profile-table-wrap"></div>
    </div>
    <div class="panel" id="dtab-ortho">
      <div id="ortho-wrap"></div>
    </div>
    <div class="panel" id="dtab-cards">
      <div class="btn-row">
        <button class="btn-secondary" onclick="window.print()" data-i="print"></button>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </div>
  </div>
</div>

<div class="card" id="card-step2">
  <h2><span class="step-badge">Step 2</span><span data-i="step2T"></span></h2>
  <div class="row" style="margin-bottom:10px">
    <div>
      <label data-i="respType"></label>
      <select id="response-type">
        <option value="score" data-i="optScore"></option>
        <option value="rank" data-i="optRank"></option>
      </select>
    </div>
    <div style="display:flex;align-items:flex-end;gap:8px">
      <label class="btn-secondary" style="cursor:pointer;display:inline-flex;align-items:center">
        <span data-i="openCsv"></span>
        <input type="file" accept=".csv,.txt" style="display:none" onchange="loadSurveyCSV(event)">
      </label>
      <button class="btn-secondary" onclick="loadSurveyExample()" data-i="sample"></button>
    </div>
  </div>
  <label data-i="surveyLbl"></label>
  <textarea id="survey-input" data-ip="surveyPh"></textarea>
  <div class="note" data-ih="surveyNote"></div>
  <div id="survey-err" class="err"></div>
  <div class="btn-row">
    <button class="btn-primary" onclick="runAnalysis()" data-i="run"></button>
  </div>
</div>

<div class="card" id="card-result" style="display:none">
  <h2><span class="step-badge">Step 3</span><span data-i="step3T"></span></h2>
  <div id="result-info" class="info" style="margin-bottom:12px"></div>
  <div class="tabs">
    <div class="tab active" onclick="switchResultTab('utility')" data-i="tabUtil"></div>
    <div class="tab" onclick="switchResultTab('importance')" data-i="tabImp"></div>
    <div class="tab" onclick="switchResultTab('average')" data-i="tabAvg"></div>
    <div class="tab" onclick="switchResultTab('individual')" data-i="tabInd"></div>
    <div class="tab" onclick="switchResultTab('cluster')" data-i="tabCl"></div>
  </div>

  <div class="panel active" id="rtab-utility">
    <div class="btn-row"><button class="btn-dl" onclick="downloadResult('utility')" data-i="dlUtil"></button></div>
    <div class="tbl-wrap" id="utility-wrap"></div>
    <div class="note" style="margin-top:8px" data-i="utilNote"></div>
  </div>

  <div class="panel" id="rtab-importance">
    <div class="btn-row"><button class="btn-dl" onclick="downloadResult('importance')" data-i="dlImp"></button></div>
    <div class="tbl-wrap" id="importance-wrap"></div>
  </div>

  <div class="panel" id="rtab-average">
    <div id="average-wrap"></div>
  </div>

  <div class="panel" id="rtab-individual">
    <div class="respondent-select">
      <label style="text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;margin:0" data-i="respLbl"></label>
      <select id="respondent-select" onchange="renderIndividual()" style="width:auto;min-width:150px"></select>
    </div>
    <div id="individual-wrap"></div>
  </div>

  <div class="panel" id="rtab-cluster">
    <p style="font-size:13px;margin-bottom:12px" data-i="clP"></p>
    <div class="btn-row">
      <button class="btn-dl" onclick="downloadResult('cluster-utility')" data-i="dlCU"></button>
      <button class="btn-dl" onclick="downloadResult('cluster-importance')" data-i="dlCI"></button>
      <button class="btn-dl" onclick="downloadResult('cluster-raw')" data-i="dlCR"></button>
    </div>
    <div class="note" style="margin-top:10px" data-ih="clNote"></div>
  </div>
</div>

</div><!-- /container -->

<div id="rscript-wrap" style="max-width:1100px;margin:0 auto;padding:0 16px 24px">
  <div style="background:#fff;border:1px solid #d0d5dd;border-radius:10px;padding:16px 18px">
    <div style="font-weight:700;font-size:15px;margin-bottom:6px" data-i="rsTitle"></div>
    <div style="font-size:12px;color:#555;line-height:1.7;margin-bottom:10px" data-i="rsDesc"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button type="button" onclick="rsMake()" data-i="rsMake" style="padding:8px 14px;border:none;border-radius:6px;background:#1a2332;color:#fff;font-size:13px;font-weight:600;cursor:pointer"></button>
      <button type="button" id="rs-copy-btn" onclick="rsCopy()" data-i="rsCopy" style="padding:8px 14px;border:1px solid #d0d5dd;border-radius:6px;background:#fff;color:#1a2332;font-size:13px;cursor:pointer"></button>
      <button type="button" onclick="rsDownload()" data-i="rsSave" style="padding:8px 14px;border:1px solid #d0d5dd;border-radius:6px;background:#fff;color:#1a2332;font-size:13px;cursor:pointer"></button>
    </div>
    <textarea id="rs-text" readonly spellcheck="false" data-ip="rsPh" style="width:100%;height:300px;box-sizing:border-box;font-family:Consolas,Menlo,monospace;font-size:12px;line-height:1.5;padding:10px;border:1px solid #d0d5dd;border-radius:6px;background:#fafbfc;white-space:pre;overflow:auto"></textarea>
  </div>
</div>
<div class="foot" data-i="foot"></div>

<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}
// =================================================================

// ───────── 辞書 ─────────
const EXD_JA=[
 [{name:'タイプ',levels:['和食','洋食']},{name:'席のタイプ',levels:['テーブル席','座敷席']},{name:'デザート',levels:['なし','あり']},{name:'価格',levels:['3000円','4000円']}],
 [{name:'タイプ',levels:['和食','洋食','フレンチ']},{name:'席のタイプ',levels:['テーブル席','座敷席','カウンター席']},{name:'デザート',levels:['なし','あり']},{name:'価格',levels:['3000円','4000円']}]
];
const EXD_EN=[
 [{name:'Cuisine',levels:['Japanese','Western']},{name:'Seating',levels:['Table','Tatami']},{name:'Dessert',levels:['No','Yes']},{name:'Price',levels:['3000','4000']}],
 [{name:'Cuisine',levels:['Japanese','Western','French']},{name:'Seating',levels:['Table','Tatami','Counter']},{name:'Dessert',levels:['No','Yes']},{name:'Price',levels:['3000','4000']}]
];
Object.assign(I18N.ja,{
 title:'コンジョイント分析ツール', h1:'コンジョイント分析ツール',
 disc1:'法政大学経営大学院イノベーション･マネジメント研究科 豊田裕貴研究室',
 disc2:'学習用のツールです。計算に誤りが含まれる可能性があるため、研究やビジネスでの利用は、結果を別の方法で確認したうえで、慎重にお願いします。',
 step1T:'直交計画の作成', step2T:'調査データの入力', step3T:'分析結果',
 nAttr:'属性の数', ex1:'例題：飲み会（2×2×2×2）', ex2:'例題：飲み会（3×3×2×2）', reset:'↺ リセット', gen:'▶ 直交計画を生成',
 tabProf:'プロファイル表', tabOrtho:'直交性チェック', tabCards:'プロファイルカード',
 dlProf:'⬇ プロファイル表をCSVでダウンロード', dlDummy:'⬇ ダミー変数表をCSVでダウンロード（Step2で再利用可）',
 print:'🖨 印刷',
 respType:'回答形式', optScore:'得点（数値）', optRank:'順位（1位・2位・…）',
 openCsv:'📂 CSVを読み込む', sample:'サンプルデータを入力',
 surveyLbl:'調査データ（行=回答者、列=各プロファイルへの評価）',
 surveyPh:'回答者名,プロファイル1,プロファイル2,...\n田中,8,3,6,7,2,5,4,1\n鈴木,7,4,5,8,1,6,3,2\n...',
 surveyNote:'※ 1行目：ヘッダー（1列目=回答者名、2列目以降=各プロファイルへの評価）<br>※ 列の順番はStep 1で生成したプロファイル表と対応させてください<br>※ 順位の場合：1位が最も好む（得点に自動変換します）',
 run:'▶ 分析を実行',
 tabUtil:'効用値一覧', tabImp:'重要度一覧', tabAvg:'全体平均', tabInd:'個人別詳細', tabCl:'cluster.html用CSV',
 dlUtil:'⬇ 効用値CSVをダウンロード', dlImp:'⬇ 重要度CSVをダウンロード',
 utilNote:'※ 効用値は、属性ごとに合計が0になるよう表示しています（Rの conjoint パッケージ、SPSSと同じ表示）。重要度は「各属性の効用値の幅 ÷ 全属性の幅の合計」です。',
 respLbl:'回答者：',
 clP:'以下の3種類のCSVを cluster.html に貼り付けてクラスター分析を実行できます。',
 dlCU:'⬇ ①効用値（cluster用）', dlCI:'⬇ ②重要度（cluster用）', dlCR:'⬇ ③生データ（cluster用）',
 clNote:'※ ①効用値：各水準の効用値でクラスタリング（「何を重視するか」の絶対的な差を捉える）<br>※ ②重要度：属性の重要度でクラスタリング（「何を重視するか」の構造を捉える）<br>※ ③生データ：プロファイルへの得点でクラスタリング（モデルを仮定しない）',
 rsTitle:'Rで同じ計算をする（検算用スクリプト）',
 rsDesc:'いま入力しているデータと設定を埋め込んだRスクリプトを作ります。RStudioに貼り付けて実行すると、このアプリと同じ計算をRの標準的な関数で行い、結果を並べて確かめられます。',
 rsMake:'Rスクリプトを作成', rsCopy:'コピー', rsSave:'.Rファイルを保存', rsPh:'「Rスクリプトを作成」を押すと、ここに表示されます', copied:'コピーしました',
 foot:'このツールは、Claude（Anthropic）の支援を受けて開発しました。',
 attrH:(n)=>`属性 ${n}`, attrName:'属性名', nLvlLbl:'水準数', nLvlOpt:(n)=>`${n}水準`, lvlLbl:(n)=>`水準${n}`,
 phAttr:'例：タイプ', phLvl:'例：和食',
 defAttr:(i)=>`属性${String.fromCharCode(65+i)}`, defLvl:(j)=>`水準${j}`,
 defAttrRe:/^属性([A-G])$/, defLvlRe:/^水準([1-9])$/,
 exD:EXD_JA,
 names:['田中','鈴木','佐藤','高橋','伊藤','渡辺','山本','中村','小林','加藤'],
 respHdr:'回答者', profHdr:(i)=>`プロファイル${i}`, profHdrRe:/^プロファイル(\d+)$/,
 respN:(i)=>`回答者${i}`, respNRe:/^回答者(\d+)$/,
 // エラー
 errNoOA:'この属性・水準の組み合わせには対応する直交配列が見つかりません。',
 errNeedDesign:'先にStep 1で直交計画を生成してください。', errNoSurvey:'調査データを入力してください。',
 errNeedDesignR:'先にStep 1で直交計画を生成してください', errNoSurveyR:'調査データを入力してください',
 errMin2:'2行以上（ヘッダー+1名以上）必要です',
 errNaN:(row,v)=>`${row}行目の値が数値ではありません（${v}）`,
 errMismatch:(n,k,np)=>`「${n}」の評価数（${k}件）がプロファイル数（${np}件）と合いません。`,
 errMismatchR:(n,k,np)=>`「${n}」の評価数（${k}件）がプロファイル数（${np}件）と合いません`,
 errRows:'行数が不足しています', errNeedDummy:'ダミー変数表CSVを読み込んでください（プロファイル表ではありません）',

  const from=LANG==='en'?XJ2E:XE2J, re=LANG==='en'?I18N.ja:I18N.en;
  if(Object.prototype.hasOwnProperty.call(from,v)) return from[v];
  let m;
  if((m=re.defAttrRe.exec(v))) return t('defAttr',m[1].charCodeAt(0)-65);
  if((m=re.defLvlRe.exec(v))) return t('defLvl',+m[1]);
  return v;
}
function trName(v){
  const re=LANG==='en'?I18N.ja:I18N.en;
  const k=re.names.indexOf(v);
  if(k>=0) return t('names')[k];
  const m=re.respNRe.exec(v);
  if(m) return t('respN',m[1]);
  return v;
}

  const re=LANG==='en'?I18N.ja:I18N.en;

  if(m) return t('profHdr',m[1]);
  return c;
}

function switchDesignTab(name){
  ['profiles','ortho','cards'].forEach(n=>{
    document.getElementById('dtab-'+n).classList.toggle('active',n===name);
  });
  document.querySelectorAll('#design-tabs .tab').forEach((tb,i)=>{
    tb.classList.toggle('active',['profiles','ortho','cards'][i]===name);
  });
  if(name==='ortho') renderOrthoCheck();
}
function switchResultTab(name){
  ['utility','importance','average','individual','cluster'].forEach(n=>{
    document.getElementById('rtab-'+n).classList.toggle('active',n===name);
  });
  document.querySelectorAll('#card-result .tabs .tab').forEach((tb,i)=>{
    tb.classList.toggle('active',['utility','importance','average','individual','cluster'][i]===name);
  });
  if(name==='individual') renderIndividual();
  if(name==='average') renderAverage();
}

function selectOA(attrs){
  const lc=attrs.map(a=>a.levels.length);
  const maxL=Math.max(...lc); const n=attrs.length;
  const n2=lc.filter(l=>l===2).length; const n3=lc.filter(l=>l===3).length;
  if(maxL===2){
    if(n<=3) return {oa:'L4',type:'pure2'};
    if(n<=7) return {oa:'L8',type:'pure2'};
    if(n<=11) return {oa:'L12',type:'pure2'};
    if(n<=15) return {oa:'L16',type:'pure2'};
    return null;
  }
  if(maxL===3&&n2===0){
    if(n<=4) return {oa:'L9',type:'pure3'};
    if(n<=13) return {oa:'L27',type:'pure3'};
    return null;
  }
  if(maxL===3){
    if(n3===1&&n2<=3) return {oa:'OA12_3_2x3',type:'prebuilt'};
    if(n3===1&&n2<=4) return {oa:'OA12_3_2x4',type:'prebuilt'};
    if(n<=4) return {oa:'L9',type:'mixed'};
    if(n2<=1&&n3<=7) return {oa:'L18',type:'L18mix'};
    if(n<=8) return {oa:'L18',type:'L18mod'};
    return null;
  }
  if(maxL===4 && lc.every(l=>l===2||l===4) && 3*lc.filter(l=>l===4).length+n2<=15) return {oa:'L16',type:'pseudo4'};
  return null;
}


function mkDummies(attrs,profiles){
  const dummyHeaders=[];
  for(let i=0;i<attrs.length;i++)
    for(let j=1;j<attrs[i].levels.length;j++)
      dummyHeaders.push(t('dummyHdr',attrs[i].name,attrs[i].levels[j]));
  const dummies=profiles.map(p=>{
    const row=[];
    for(let i=0;i<attrs.length;i++)
      for(let j=1;j<attrs[i].levels.length;j++) row.push(p[i]===j?1:0);
    return row;
  });
  return {dummyHeaders,dummies};
}

// 配列の選び方・列の割り当ては、元のツールと同じ(そのままコピー)
function computeProfiles(attrs,sel){
  const {oa:oaKey,type:oaType}=sel;
  const baseOA=OA[oaKey];
  let profiles=[];

  if(oaType==='prebuilt'){
    const sorted=[...attrs.map((a,i)=>({...a,origIdx:i}))].sort((a,b)=>b.levels.length-a.levels.length);
    const colMap=new Array(attrs.length);
    sorted.forEach((a,col)=>colMap[a.origIdx]=col);
    for(const row of baseOA.array){
      const p=new Array(attrs.length);
      attrs.forEach((_,i)=>p[i]=row[colMap[i]]);
      profiles.push(p);
    }
  } else if(oaType==='pure2'||oaType==='pure3'){
    const cols=Array.from({length:attrs.length},(_,i)=>i);
    for(const row of baseOA.array) profiles.push(cols.map((c,i)=>row[c]%attrs[i].levels.length));
  } else if(oaType==='mixed'){
    const sorted=[...attrs.map((a,i)=>({...a,origIdx:i}))].sort((a,b)=>b.levels.length-a.levels.length);
    const colMap=new Array(attrs.length);
    sorted.forEach((a,col)=>colMap[a.origIdx]=col);
    for(const row of baseOA.array){
      const p=new Array(attrs.length);
      attrs.forEach((_,i)=>p[i]=row[colMap[i]]%attrs[i].levels.length);
      profiles.push(p);
    }
  } else if(oaType==='L18mix'){
    let c2=0,c3=1;
    const cols=attrs.map(a=>a.levels.length===2?c2++:c3++);
    for(const row of baseOA.array) profiles.push(cols.map((c,i)=>row[c]%attrs[i].levels.length));
  } else if(oaType==='L18mod'){
    const sorted=[...attrs.map((a,i)=>({...a,origIdx:i}))].sort((a,b)=>b.levels.length-a.levels.length);
    const colMap=new Array(attrs.length);
    let c3=1,c2=0,usedC0=false;
    for(const a of sorted){
      if(a.levels.length===3){colMap[a.origIdx]=c3++;}
      else if(!usedC0){colMap[a.origIdx]=0;usedC0=true;}
      else {colMap[a.origIdx]=c3++;}
    }
    for(const row of baseOA.array) profiles.push(colMap.map((c,i)=>row[c]%attrs[i].levels.length));
  } else if(oaType==='pseudo4'){
    // 4水準属性は L16 の独立な2列(j1,j2)と、その交互作用列(j1 xor j2)の3列を専有する（完全直交）
    const used=new Set(), attrCols=new Array(attrs.length);
    const n4idx=attrs.map((a,i)=>a.levels.length===4?i:-1).filter(i=>i>=0);
    const lines=[];
    (function dfs(t){
      if(t===n4idx.length) return true;
      for(let j1=1;j1<=15;j1++) for(let j2=j1+1;j2<=15;j2++){
        const j3=j1^j2;
        if(used.has(j1)||used.has(j2)||used.has(j3)) continue;
        used.add(j1);used.add(j2);used.add(j3); lines[t]=[j1,j2];
        if(dfs(t+1)) return true;
        used.delete(j1);used.delete(j2);used.delete(j3);
      }
      return false;
    })(0);
    n4idx.forEach((ai,t)=>attrCols[ai]=lines[t]);
    let nextCol=1;
    attrs.forEach((a,i)=>{ if(a.levels.length===2){ while(used.has(nextCol)) nextCol++; used.add(nextCol); attrCols[i]=[nextCol]; } });
    for(const row of baseOA.array){
      profiles.push(attrCols.map(cs=> cs.length===2 ? row[cs[0]-1]*2+row[cs[1]-1] : row[cs[0]-1]));
    }
  }

  return profiles;
}

  attrs.forEach((attr,i)=>{
    const counts=new Array(attr.levels.length).fill(0);
    profiles.forEach(p=>counts[p[i]]++);
    const exp=profiles.length/attr.levels.length;
    attr.levels.forEach((lv,j)=>{
      const ok=Math.abs(counts[j]-exp)<0.5;
      html+=`<tr><td class="left">${j===0?`<b>${esc(attr.name)}</b>`:''}</td>
        <td class="left">${esc(lv)}</td><td>${counts[j]}</td>
        <td>${exp%1===0?exp:exp.toFixed(2)}</td>
        <td style="color:${ok?'#0e7c5a':'#c0392b'};font-weight:700">${ok?t('okMark'):t('unbal')}</td></tr>`;
    });
  });
  html+=`</tbody></table></div>`;
  html+=`<h3 style="font-size:12px;font-weight:700;margin:16px 0 8px">${t('h2Cross')}</h3>`;
  let allOK=dupes.length===0;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const cross={};
    attrs[i].levels.forEach((_,li)=>attrs[j].levels.forEach((_,lj)=>{cross[`${li}-${lj}`]=0;}));
    profiles.forEach(p=>cross[`${p[i]}-${p[j]}`]++);
    const vals=Object.values(cross); const diff=Math.max(...vals)-Math.min(...vals);
    if(diff>1) allOK=false;
    const sc=diff===0?'#0e7c5a':diff<=1?'#185FA5':diff<=2?'#e05c2a':'#c0392b';
    const st=diff===0?t('stFull'):diff<=1?t('stOrth1'):diff<=2?t('stApprox'):t('stNon',diff);
    html+=`<div style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:center">
        <span>${esc(attrs[i].name)} × ${esc(attrs[j].name)}</span>
        <span style="color:${sc}">${st}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th></th>`;
    attrs[j].levels.forEach(lv=>html+=`<th>${esc(lv)}</th>`);
    html+=`</tr></thead><tbody>`;
    attrs[i].levels.forEach((lvi,li)=>{
      html+=`<tr><td class="left"><b>${esc(lvi)}</b></td>`;
      attrs[j].levels.forEach((_,lj)=>{
        const v=cross[`${li}-${lj}`];
        html+=`<td style="background:${diff<=1?'#e8f5f0':'#fdf0ee'};font-weight:600">${v}</td>`;
      });
      html+=`</tr>`;
    });
    html+=`</tbody></table></div></div>`;
  }
  const sc=allOK?'#0e7c5a':'#e05c2a';
  const bg=allOK?'#e8f5f0':'#fff3e0';
  const msg=allOK?t('sumOK'):t('sumNG');
  document.getElementById('ortho-wrap').innerHTML=
    `<div style="padding:10px 16px;background:${bg};border-radius:6px;border-left:4px solid ${sc};margin-bottom:14px;font-size:13px;font-weight:600;color:${sc}">${msg}</div>`+html;
}

function restoreDesignFromCSV(text){
  const sep2=text.indexOf('\t')>-1&&text.indexOf('\t')<text.indexOf(',') ? '\t' : ',';
  const lines=[];
  for(const l of text.split('\n')){const s=l.replace(/\r$/,'');if(s.trim()) lines.push(s);}
  if(lines.length<3) throw new Error(t('errRows'));
  const sep=lines[0].includes('\t')?'\t':',';
  if(!lines[0].startsWith('#META')) throw new Error(t('errNeedDummy'));
  const metaCols=lines[0].split(sep).slice(1);
  const attrs=metaCols.map(m=>{
    const idx=m.indexOf(':');
    const name=m.slice(0,idx);
    const levels=m.slice(idx+1).split('|');
    return {name,levels};
  });
  const dummyHeaders=lines[1].split(sep).slice(1);
  const dummies=[];
  const profiles=[];
  for(let i=2;i<lines.length;i++){
    const vals=lines[i].split(sep);
    const row=vals.slice(1).map(v=>+v);
    dummies.push(row);
    let ci=0;
    const p=attrs.map(attr=>{
      const lvlDummies=[];
      for(let j=1;j<attr.levels.length;j++) lvlDummies.push(row[ci++]);
      const idx=lvlDummies.indexOf(1);
      return idx===-1?0:idx+1;
    });
    profiles.push(p);
  }
  G.attrs=attrs; G.profiles=profiles; G.dummies=dummies; G.dummyHeaders=dummyHeaders;
  const info=document.getElementById('design-loaded-info');
  info.innerHTML=t('loadedInfo',attrs.map(a=>a.name).join(' / '),profiles.length,attrs.map(a=>a.levels.length).join('×'));
  info.style.display='block';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// OLS回帰（最小二乗法）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function ols(X, y){
  // X: n×k, y: n×1 → coef: k×1
  const n=X.length, k=X[0].length;
  // XtX
  const XtX=Array.from({length:k},(_,i)=>Array.from({length:k},(_,j)=>
    X.reduce((s,r)=>s+r[i]*r[j],0)));
  // Xty
  const Xty=Array.from({length:k},(_,i)=>X.reduce((s,r,ri)=>s+r[i]*y[ri],0));
  // XtXの逆行列（ガウス消去法）
  const aug=XtX.map((row,i)=>[...row,...Array.from({length:k},(_,j)=>i===j?1:0)]);
  for(let col=0;col<k;col++){
    let maxRow=col;
    for(let row=col+1;row<k;row++) if(Math.abs(aug[row][col])>Math.abs(aug[maxRow][col])) maxRow=row;
    [aug[col],aug[maxRow]]=[aug[maxRow],aug[col]];
    const pivot=aug[col][col];
    if(Math.abs(pivot)<1e-12) continue;
    for(let j=0;j<2*k;j++) aug[col][j]/=pivot;
    for(let row=0;row<k;row++){
      if(row===col) continue;
      const factor=aug[row][col];
      for(let j=0;j<2*k;j++) aug[row][j]-=factor*aug[col][j];
    }
  }
  const inv=aug.map(row=>row.slice(k));
  // coef = inv @ Xty
  return Array.from({length:k},(_,i)=>inv[i].reduce((s,v,j)=>s+v*Xty[j],0));
}

function calcUtilityAndImportance(scores, dummies, attrs){
  const n=scores.length; const k=dummies[0].length;
  // X行列（切片込み）
  const X=dummies.map(row=>[1,...row]);
  const coefs=ols(X, scores);
  const intercept=coefs[0];
  const dummyCoefs=coefs.slice(1); // ダミー変数の係数

  // 各属性・水準の効用値（Rのconjointパッケージと同じ：属性ごとに合計0の効果コーディング）
  // ダミー変数回帰（基準水準=0）の係数を、属性内の水準の平均で中心化すると同じモデルになる
  let ci=0;
  const utilities=[];
  const gaps=[];
  const importances=[];
  let interceptZS=intercept;
  for(const attr of attrs){
    const raw=[0];
    for(let j=1;j<attr.levels.length;j++){
      raw.push(dummyCoefs[ci++]);
    }
    const mean=raw.reduce((s,v)=>s+v,0)/raw.length;
    const lvlUtils=raw.map(v=>v-mean);
    interceptZS+=mean;
    const gap=Math.max(...lvlUtils)-Math.min(...lvlUtils);
    utilities.push(lvlUtils);
    gaps.push(gap);
  }
  const totalGap=gaps.reduce((s,g)=>s+g,0)||1;
  for(const g of gaps) importances.push(g/totalGap);

  return {intercept, interceptZS, dummyCoefs, utilities, gaps, importances};
}

// Step 3: 分析実行
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function runAnalysis(){
  clearErr('survey-err');
  if(!G.profiles||!G.profiles.length){
    showErr('survey-err',()=>t('errNeedDesign'));return;
  }
  const text=document.getElementById('survey-input').value;
  if(!text.trim()){showErr('survey-err',()=>t('errNoSurvey'));return;}
  let parsed;
  try{parsed=parseSurvey(text);}catch(e){showErr('survey-err',errFn(e));return;}
  const {respondents,data}=parsed;

  // プロファイル数チェック
  const np=G.profiles.length;
  for(let i=0;i<data.length;i++){
    if(data[i].length!==np){
      const nm=respondents[i], k=data[i].length;
      showErr('survey-err',()=>t('errMismatch',nm,k,np));
      return;
    }
  }

  // 順位→得点変換
  const responseType=document.getElementById('response-type').value;
  const processedData=data.map(scores=>{
    if(responseType==='rank'){
      // 順位1→np点、順位2→np-1点…
      return scores.map(r=>np+1-r);
    }
    return scores;
  });

  // 各回答者の効用値・重要度を計算
  const results=respondents.map((name,i)=>{
    const res=calcUtilityAndImportance(processedData[i], G.dummies, G.attrs);
    return {name, rawScores:processedData[i], ...res};
  });

  G.respondents=respondents; G.surveyData=processedData; G.results=results; G.rtype=responseType;

  renderResultInfo();

  document.getElementById('card-result').style.display='block';
  switchResultTab('utility');
  renderUtility(); renderImportanceTable();
  document.getElementById('card-result').scrollIntoView({behavior:'smooth'});
}

  document.getElementById('result-info').innerHTML=

}

function downloadResult(type){
  const {attrs,results}=G;
  let rows=[], fname='';

  if(type==='utility'){
    const cols=[];
    attrs.forEach(attr=>attr.levels.forEach(lv=>cols.push(t('colonJ',attr.name,lv))));
    rows=[[t('thResp'),...cols].join(',')];
    results.forEach(r=>{
      const vals=r.utilities.flatMap(u=>u);
      rows.push([r.name,...vals.map(v=>v.toFixed(4))].join(','));
    });
    fname='conjoint_utility.csv';

  } else if(type==='importance'){
    rows=[[t('thResp'),...attrs.map(a=>a.name)].join(',')];
    results.forEach(r=>{
      rows.push([r.name,...r.importances.map(v=>v.toFixed(4))].join(','));
    });
    fname='conjoint_importance.csv';

  } else if(type==='cluster-utility'){
    // 効用値（基準水準を除く）
    const cols=[];
    attrs.forEach(attr=>attr.levels.slice(1).forEach(lv=>cols.push(t('dummyHdr',attr.name,lv))));
    rows=[[t('caseH'),...cols].join(',')];
    results.forEach(r=>{
      const vals=r.utilities.flatMap(u=>u.slice(1));
      rows.push([r.name,...vals.map(v=>v.toFixed(4))].join(','));
    });
    fname='cluster_utility.csv';

  } else if(type==='cluster-importance'){
    rows=[[t('caseH'),...attrs.map(a=>a.name)].join(',')];
    results.forEach(r=>{
      rows.push([r.name,...r.importances.map(v=>v.toFixed(4))].join(','));
    });
    fname='cluster_importance.csv';

  } else if(type==='cluster-raw'){
    const hdrs=G.profiles.map((_,i)=>`P${i+1}`);
    rows=[[t('caseH'),...hdrs].join(',')];
    results.forEach(r=>{
      rows.push([r.name,...r.rawScores].join(','));
    });
    fname='cluster_raw.csv';
  }

  dl(rows.join('\n'), fname);
}

// ───────── Rスクリプト出力（検算用）の共通部品 ─────────
function rsRaw(text){
  // R 4.0以降の raw string: r"---( ... )---"
  let d='---';
  while(text.indexOf(')'+d+'"')>=0) d+='-';
  return 'r"'+d+'(\n'+text.replace(/\r\n?/g,'\n').replace(/\s+$/,'')+'\n)'+d+'"';
}
const RS_FAIL={ja:'# スクリプトを作成できませんでした',en:'# Could not create the script'};
function rsHeader(title, pkgLines){
  const L=(LANG==='ja')?[
    '# =====================================================================',
    '# '+title,
    '# このスクリプトは、アプリに入力したデータと設定をそのまま埋め込んであります。',
    '# RStudioに貼り付けて、上から順に実行してください。',
    '# 日本語が文字化けするときは、RStudioの File > Reopen with Encoding > UTF-8 で開き直してください。',
    '# ====================================================================='
  ]:[
    '# =====================================================================',
    '# '+title,
    '# This script embeds the data and settings you entered in the app.',
    '# Paste it into RStudio and run it from top to bottom.',
    '# ====================================================================='
  ];
  if(pkgLines&&pkgLines.length){ L.push('',(LANG==='ja'?'# 初回だけ、必要なパッケージをインストールしてください（先頭の # を外して実行）':'# Install the required package once (remove the leading # and run)')); pkgLines.forEach(p=>L.push(p)); }
  return L;
}
function rsMake(){
  const ta=document.getElementById('rs-text');
  try{ ta.value=buildRScript(); }
  catch(e){ ta.value=RS_FAIL[LANG]+': '+e.message; }
}
function rsFailed(v){ return v.indexOf(RS_FAIL.ja)===0||v.indexOf(RS_FAIL.en)===0; }
function rsCopy(){
  const ta=document.getElementById('rs-text');
  rsMake();   // 入力が変わっていてもよいよう、毎回作り直す
  if(rsFailed(ta.value)) return;
  ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(()=>{}); }
  const b=document.getElementById('rs-copy-btn');
  b.textContent=t('copied'); setTimeout(()=>{b.textContent=t('rsCopy');},1500);
}
function rsDownload(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  const b64=btoa(unescape(encodeURIComponent('﻿'+ta.value)));
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8;base64,'+b64;
  a.download=RS_FILENAME;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
const RS_FILENAME='conjoint_analysis_check.R';
function buildRScript(){
  const ja=(LANG==='ja');
  if(!G.profiles||!G.profiles.length) throw mkErr('errNeedDesignR');
  const text=document.getElementById('survey-input').value;
  if(!text.trim()) throw mkErr('errNoSurveyR');
  const parsed=parseSurvey(text);
  const np=G.profiles.length;
  parsed.data.forEach((d,i)=>{ if(d.length!==np) throw mkErr('errMismatchR',parsed.respondents[i],d.length,np); });
  const rtype=document.getElementById('response-type').value;
  const attrs=G.attrs, prof=G.profiles;
  const q=s=>'"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
  const yCsv=parsed.respondents.map((n,i)=>n+','+parsed.data[i].join(',')).join('\n');
  const L=rsHeader(ja?'コンジョイント分析: アプリ(conjoint_analysis.html)と同じ計算をRで行う（conjointパッケージ）'
                     :'Conjoint analysis: the same calculation as the app (conjoint_analysis.html), in R (conjoint package)',
    ['# install.packages("conjoint")']);
  L.push('',
    'library(conjoint)',
    '',
    ja?'# 1. 計画（プロファイル x 属性）。水準は 1, 2, 3, ... の番号で表す（アプリの水準の並び順と同じ）'
      :'# 1. Design (profiles x attributes). Levels are coded as 1, 2, 3, ... (the same order as the levels in the app)',
    'x <- data.frame(');
  attrs.forEach((a,i)=>{
    L.push('  a'+(i+1)+' = c('+prof.map(p=>p[i]+1).join(', ')+')'+(i<attrs.length-1?',':''));
  });
  L.push(')',
    (ja?'# 属性の対応: ':'# Attribute mapping: ')+attrs.map((a,i)=>'a'+(i+1)+'='+a.name).join(', '),
    ja?'# 水準の名前（効用値の表示用。アプリの並び順）':'# Level names (for labeling the part-worth utilities; same order as in the app)',
    'z <- c('+attrs.flatMap((a,i)=>a.levels.map(l=>q(a.name+":"+l))).join(', ')+')',
    '',
    ja?'# 2. 調査データ（行=回答者、列=プロファイル1, 2, ...。回答形式: '+(rtype==='rank'?'順位':'得点')+'）'
      :'# 2. Survey data (rows = respondents, columns = Profile 1, 2, .... Response format: '+(rtype==='rank'?'rank':'score')+')',
    'y <- as.matrix(read.csv(text = '+rsRaw(yCsv)+',',
    '                        header = FALSE, row.names = 1))');
  if(rtype==='rank') L.push(ja?'y <- caRankToScore(y)   # 順位を得点に変換（順位1 → プロファイル数、順位2 → プロファイル数-1 ...）'
                              :'y <- caRankToScore(y)   # convert ranks to scores (rank 1 -> number of profiles, rank 2 -> number of profiles - 1, ...)');
  L.push('',
    ja?'# 3. 回答者ごとの効用値（部分効用）。1列目=切片、続いて各水準。'
      :'# 3. Part-worth utilities for each respondent. Column 1 = intercept, followed by each level.',
    ja?'#    各属性の水準の合計が0になる効果コーディング（アプリの効用値と同じ）'
      :'#    Effect coding in which the levels of each attribute sum to 0 (same as the app)',
    'pu <- suppressWarnings(caPartUtilities(y, x, z))',
    ja?'colnames(pu) <- c("切片", z)':'colnames(pu) <- c("Intercept", z)',
    'rownames(pu) <- rownames(y)',
    'print(round(pu, 3))',
    '',
    ja?'# 4. 属性の重要度（%）。各回答者の「効用値の幅 / 全属性の幅の合計」を平均したもの（アプリの平均重要度）'
      :'# 4. Importance of the attributes (%). The mean over respondents of "range of the utilities / sum of the ranges of all attributes" (the average importance in the app)',
    'imp <- suppressWarnings(caImportance(y, x))',
    'names(imp) <- c('+attrs.map(a=>q(a.name)).join(', ')+')',
    'print(imp)',
    '',
    ja?'# 5. 参考: 1人目をlm()で直接計算しても同じ効用値になります（contr.sum = 効果コーディング）'
      :'# 5. For reference: computing the first respondent directly with lm() gives the same utilities (contr.sum = effect coding)',
    'old <- options(contrasts = c("contr.sum", "contr.poly"))',
    'fit <- lm(y[1, ] ~ ' + attrs.map((a,i)=>'factor(x$a'+(i+1)+')').join(' + ')+')',
    ja?'print(round(coef(fit), 3))   # 切片と、各属性の（最後の水準を除く）効用値'
      :'print(round(coef(fit), 3))   # the intercept and the utilities of each attribute (excluding the last level)',
    'options(old)');
  return L.join('\n')+'\n';
}

// ───────── 起動 ─────────
LANG=detectLang();
buildAttrInputs();
applyI18n();
</script>
