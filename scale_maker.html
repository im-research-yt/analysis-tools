<script>
// ===== scale builder: numerical core (no DOM). Used by scale_builder.html and by the tests. =====
// 主因子法(psych::fa の fm="pa" と同じ手順。収束条件のみ厳しくしてある)、varimax / promax(stats と同じ手順)、クロンバックのα。
'use strict';

// ---------- small matrix helpers (arrays of arrays, row-major) ----------
function matMul(A,B){
  const r=A.length, mid=B.length, c=B[0].length;
  const out=Array.from({length:r},()=>new Array(c).fill(0));
  for(let i=0;i<r;i++) for(let k=0;k<mid;k++){ const a=A[i][k]; if(a===0) continue; for(let j=0;j<c;j++) out[i][j]+=a*B[k][j]; }
  return out;
}
function matT(A){ return A[0].map((_,j)=>A.map(r=>r[j])); }
function matInv(A){
  const n=A.length;
  const M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>i===j?1:0)]);
  for(let col=0;col<n;col++){
    let p=col; for(let r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[p][col])) p=r;
    [M[col],M[p]]=[M[p],M[col]];
    const piv=M[col][col];
    if(Math.abs(piv)<1e-300) throw new Error('singular');
    for(let j=0;j<2*n;j++) M[col][j]/=piv;
    for(let r=0;r<n;r++){ if(r===col) continue; const f=M[r][col]; if(f===0) continue; for(let j=0;j<2*n;j++) M[r][j]-=f*M[col][j]; }
  }
  return M.map(r=>r.slice(n));
}

// ---------- symmetric eigen decomposition (cyclic Jacobi) ----------
// returns {values (descending, not clipped), vectors (vectors[k] = k-th eigenvector), converged}
function eigenSym(A){
  const n=A.length;
  if(n===1) return {values:[A[0][0]],vectors:[[1]],converged:true};
  const a=A.map(r=>r.slice());
  const V=Array.from({length:n},(_,i)=>{const r=new Array(n).fill(0); r[i]=1; return r;});
  let converged=false;
  for(let sweep=0;sweep<100;sweep++){
    let off=0, dg=0;
    for(let i=0;i<n;i++){ dg+=a[i][i]*a[i][i]; for(let j=i+1;j<n;j++) off+=a[i][j]*a[i][j]; }
    if(Math.sqrt(off)<=1e-15*Math.sqrt(dg)+1e-300){ converged=true; break; }
    for(let p=0;p<n-1;p++) for(let q=p+1;q<n;q++){
      const apq=a[p][q];
      if(apq===0) continue;
      const theta=(a[q][q]-a[p][p])/(2*apq);
      const t=(theta>=0?1:-1)/(Math.abs(theta)+Math.sqrt(theta*theta+1));
      const c=1/Math.sqrt(t*t+1), s=t*c;
      a[p][p]-=t*apq; a[q][q]+=t*apq; a[p][q]=0; a[q][p]=0;
      for(let r=0;r<n;r++){
        if(r===p||r===q) continue;
        const arp=a[r][p], arq=a[r][q];
        a[r][p]=c*arp-s*arq; a[p][r]=a[r][p];
        a[r][q]=s*arp+c*arq; a[q][r]=a[r][q];
      }
      for(let r=0;r<n;r++){
        const vp=V[r][p], vq=V[r][q];
        V[r][p]=c*vp-s*vq; V[r][q]=s*vp+c*vq;
      }
    }
  }
  const idx=Array.from({length:n},(_,i)=>i).sort((x,y)=>a[y][y]-a[x][x]);
  return {values:idx.map(i=>a[i][i]), vectors:idx.map(i=>V.map(r=>r[i])), converged};
}

// ---------- data summaries ----------
function colMeans(X){ const n=X.length,m=X[0].length; const mu=new Array(m).fill(0); for(const r of X) for(let j=0;j<m;j++) mu[j]+=r[j]; return mu.map(v=>v/n); }
function covMat(X){
  const n=X.length,m=X[0].length,mu=colMeans(X);
  const S=Array.from({length:m},()=>new Array(m).fill(0));
  for(const r of X) for(let i=0;i<m;i++){ const di=r[i]-mu[i]; for(let j=i;j<m;j++) S[i][j]+=di*(r[j]-mu[j]); }
  for(let i=0;i<m;i++) for(let j=i;j<m;j++){ S[i][j]/=(n-1); S[j][i]=S[i][j]; }
  return S;
}
function corMat(X){
  const S=covMat(X), m=S.length, sd=S.map((r,i)=>Math.sqrt(r[i]));
  return S.map((r,i)=>r.map((v,j)=>i===j?1:v/(sd[i]*sd[j])));
}

// ---------- principal axis factoring (psych::fa fm = "pa") ----------
// psych: 初期共通性 = SMC。縮約相関行列の固有値分解 → 上位k個から負荷量 → 共通性を更新、を、共通性の合計の変化が min.err 未満になるまで繰り返す。
// psych の既定は min.err = 0.001, max.iter = 50。このツールは min.err = 1e-8, max.iter = 1000 で収束させる。
function paFit(R,k,opt){
  opt=opt||{}; const tol=opt.tol!==undefined?opt.tol:1e-8, maxIter=opt.maxIter||1000;
  const m=R.length;
  const eg=eigenSym(R);
  if(!eg.converged) throw {code:'eigen'};
  const minEig=eg.values[m-1];
  if(!(minEig>1e-10)) throw {code:'singular',minEig};
  // SMC = 1 - 1/diag(R^-1);  diag(R^-1)_i = sum_k v_k[i]^2 / lambda_k
  let h=Array.from({length:m},(_,i)=>{let s=0; for(let q=0;q<m;q++) s+=eg.vectors[q][i]*eg.vectors[q][i]/eg.values[q]; return 1-1/s;});
  const smc=h.slice();
  let comm=h.reduce((x,y)=>x+y,0), err=comm, it=1, converged=true, negEig=false, L=null;
  while(err>tol){
    const rr=R.map((r,i)=>r.map((v,j)=>i===j?h[i]:v));
    const e=eigenSym(rr);
    if(!e.converged) throw {code:'eigen'};
    negEig=false;
    L=Array.from({length:m},()=>new Array(k).fill(0));
    for(let j=0;j<k;j++){
      const lam=e.values[j]; if(!(lam>0)) negEig=true;
      const sq=Math.sqrt(Math.max(lam,0));
      for(let i=0;i<m;i++) L[i][j]=e.vectors[j][i]*sq;
    }
    const nh=L.map(r=>r.reduce((s,v)=>s+v*v,0));
    const comm1=nh.reduce((x,y)=>x+y,0);
    err=Math.abs(comm-comm1); comm=comm1; h=nh; it++;
    if(it>maxIter){ converged=false; break; }
  }
  return {L,h2:h,smc,iter:it-1,converged,negEig,heywood:h.some(v=>v>=1),eigR:eg.values};
}

// ---------- rotations (same procedure as stats::varimax and stats::promax) ----------
function varimax(L){
  const m=L.length, nf=L[0].length;
  if(nf<2) return L.map(r=>r.slice());
  const eps=1e-5;
  const sc=L.map(r=>Math.sqrt(r.reduce((s,v)=>s+v*v,0)));
  const x=L.map((r,i)=>r.map(v=>sc[i]>0?v/sc[i]:v));       // Kaiser normalization
  let T=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>i===j?1:0));
  let d=0;
  for(let it=0;it<1000;it++){
    const z=matMul(x,T);
    const colSS=Array.from({length:nf},(_,j)=>z.reduce((s,r)=>s+r[j]*r[j],0));
    const Zm=z.map(r=>r.map((v,j)=>v*v*v-v*colSS[j]/m));
    const B=matMul(matT(x),Zm);
    const BtB=matMul(matT(B),B);
    const e=eigenSym(BtB);
    const lam=e.values.map(v=>Math.max(v,1e-300));
    const W=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>e.vectors.reduce((s,vec,q)=>s+vec[i]*vec[j]/Math.sqrt(lam[q]),0)));
    T=matMul(B,W);
    const dpast=d; d=lam.reduce((s,v)=>s+Math.sqrt(v),0);
    if(d<dpast*(1+eps)) break;
  }
  return matMul(x,T).map((r,i)=>r.map(v=>v*sc[i]));
}
function promaxFromVarimax(V,power){
  power=power||4;
  const m=V.length, nf=V[0].length;
  const Q=V.map(r=>r.map(v=>Math.sign(v)*Math.pow(Math.abs(v),power)));
  const Vt=matT(V);
  let U=matMul(matInv(matMul(Vt,V)),matMul(Vt,Q));
  const inv0=matInv(matMul(matT(U),U));
  U=U.map(r=>r.map((v,j)=>v*Math.sqrt(inv0[j][j])));
  const phi=matInv(matMul(matT(U),U));
  return {pattern:matMul(V,U),phi};
}

// ---------- unrotated -> final solution (orientation and ordering as in psych::fa) ----------
function colSignFlip(L){
  const k=L[0].length, sg=Array.from({length:k},(_,j)=>{const s=L.reduce((a,r)=>a+r[j],0); return s<0?-1:1;});
  return {M:L.map(r=>r.map((v,j)=>v*sg[j])),sg};
}
function solveFactors(L0,rotation){
  const m=L0.length, k=L0[0].length;
  const f0=colSignFlip(L0);            // 回転前の向き(psych: 合計が正)
  const L=f0.M;
  if(k<2) return {pattern:L,structure:L,phi:[[1]],rotation:'none',order:[0],ev:[L.reduce((a,r)=>a+r[0]*r[0],0)]};
  let P, phi=null;
  if(rotation==='varimax') P=varimax(L);
  else { const pr=promaxFromVarimax(varimax(L),4); P=pr.pattern; phi=pr.phi; }
  const f1=colSignFlip(P);             // 回転後の向き
  P=f1.M;
  if(phi) phi=phi.map((r,i)=>r.map((v,j)=>v*f1.sg[i]*f1.sg[j]));
  let ev;
  if(phi){ const PtP=matMul(matT(P),P); ev=Array.from({length:k},(_,j)=>phi[j].reduce((s,v,l)=>s+v*PtP[l][j],0)); }
  else ev=Array.from({length:k},(_,j)=>P.reduce((s,r)=>s+r[j]*r[j],0));
  const order=Array.from({length:k},(_,j)=>j).sort((a,b)=>ev[b]-ev[a]);
  P=P.map(r=>order.map(j=>r[j]));
  if(phi) phi=order.map(i=>order.map(j=>phi[i][j]));
  const structure=phi?matMul(P,phi):P.map(r=>r.slice());
  return {pattern:P,structure,phi:phi||Array.from({length:k},(_,i)=>Array.from({length:k},(_,j)=>i===j?1:0)),rotation,order,ev:order.map(j=>ev[j])};
}

// ---------- full factor analysis from a data matrix ----------
function factorAnalysis(X,k,rotation){
  const R=corMat(X);
  const fit=paFit(R,k);
  const sol=solveFactors(fit.L,rotation);
  return Object.assign({R,fit},sol,{h2:fit.h2});
}

// ---------- reliability ----------
function alphaStats(X){
  const n=X.length,k=X[0].length;
  const C=covMat(X), mu=colMeans(X);
  const sdv=C.map((r,i)=>Math.sqrt(r[i]));
  let sumDiag=0,sumAll=0,sumR=0;
  for(let i=0;i<k;i++){ sumDiag+=C[i][i]; for(let j=0;j<k;j++){ sumAll+=C[i][j]; if(i!==j) sumR+=C[i][j]/(sdv[i]*sdv[j]); } }
  const a=(kk,sd,sa)=>kk/(kk-1)*(1-sd/sa);
  const rbar=sumR/(k*(k-1));
  const items=[];
  for(let i=0;i<k;i++){
    let cov_it=0, var_rest=0;
    for(let j=0;j<k;j++){ if(j===i) continue; cov_it+=C[i][j]; for(let l=0;l<k;l++) if(l!==i) var_rest+=C[j][l]; }
    const rDrop=cov_it/Math.sqrt(C[i][i]*var_rest);
    let aDrop=NaN;
    if(k>2){ aDrop=a(k-1,sumDiag-C[i][i],sumAll-2*cov_it-C[i][i]); }
    items.push({mean:mu[i],sd:sdv[i],rDrop,alphaDrop:aDrop});
  }
  return {k,n,alpha:k>1?a(k,sumDiag,sumAll):NaN,alphaStd:k>1?k*rbar/(1+(k-1)*rbar):NaN,rbar,items};
}

// ---------- subscale scores (item means; reverse-coded items flipped with min+max-x) ----------
function subscaleScores(X,cols,reverse,min,max){
  return X.map(r=>{ let s=0; for(const j of cols) s+=reverse[j]?(min+max-r[j]):r[j]; return s/cols.length; });
}

// ===================== state =====================
const S={ids:[],names:[],rows:[],skipped:0,sel:[],selIdx:[],X:null,R:null,eig:null,err:null,warns:[],
  k:3,userK:false,qInit:3,rot:'promax',thr:0.40,fa:null,faErr:null,assign:[],rev:[],facNames:[],dirty:false,resetNote:false,min:1,max:5,loaded:false};
const $=id=>document.getElementById(id);
const fx=(v,d)=>Number.isFinite(v)?v.toFixed(d===undefined?3:d):'–';
function cleanName(x){ return (x||'').trim().replace(/[<>&"'`,\\]/g,'_'); }
function esc(x){ return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function facLabel(j){ return (S.facNames[j]&&S.facNames[j].trim())?S.facNames[j].trim():'F'+(j+1); }
function msg(cls,text){ return `<div class="msg ${cls}">${esc(text)}</div>`; }

// ===================== data input =====================
function loadExample(n){ $('csv').value=(n===3?EX3:n===2?EX2:EX)[LANG]; parseCSV(); }
function loadCSVFile(ev){
  const file=ev.target.files[0]; if(!file) return;
  const tryRead=enc=>{ const rd=new FileReader(); rd.onload=e=>{ let txt=e.target.result.replace(/^﻿/,''); if(enc==='UTF-8'&&(txt.match(/�/g)||[]).length>5){ tryRead('Shift-JIS'); return; } $('csv').value=txt; parseCSV(); }; rd.readAsText(file,enc); };
  tryRead('UTF-8'); ev.target.value='';
}
function parseCSV(){
  const txt=$('csv').value.trim();
  if(!txt){ S.rows=[]; S.names=[]; S.loaded=false; $('s1vars').style.display='none'; $('s1info').innerHTML=''; computeAll(); return; }
  const lines=txt.split('\n').map(l=>l.trim()).filter(l=>l);
  if(lines.length<3) return;
  const names=lines[0].split(',').slice(1).map(cleanName);
  S.names=names; S.ids=[]; S.rows=[]; S.skipped=0; const seen={};
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(',');
    const row=cols.slice(1,1+names.length).map(v=>parseFloat(v.trim()));
    if(row.length<names.length||row.some(isNaN)){ S.skipped++; continue; }
    let id=cleanName(cols[0]); if(seen[id]){ seen[id]++; id=id+'_'+seen[id]; } else seen[id]=1;
    S.ids.push(id); S.rows.push(row);
  }
  S.sel=names.map(()=>true); S.loaded=true;
  buildVarChecks(); computeAll();
}
$('csv').addEventListener('input',parseCSV);
function buildVarChecks(){
  $('s1vars').style.display='block';
  $('varchecks').innerHTML=S.names.map((v,i)=>`<label><input type="checkbox" value="${i}" ${S.sel[i]?'checked':''} onchange="onVarChange()"> ${esc(v)}</label>`).join('');
}
function onVarChange(){ S.sel=[...document.querySelectorAll('#varchecks input')].map(c=>c.checked); computeAll(); }
function selAll(v){ S.sel=S.names.map(()=>v); buildVarChecks(); computeAll(); }
function renderS1(){
  if(!S.loaded){ $('s1info').innerHTML=''; return; }
  $('s1info').innerHTML=msg('info',t('parsed',S.rows.length,S.names.length,S.skipped))+`<div class="note">${esc(t('s1note'))}</div>`;
  const n=S.rows.length;
  let h=`<table class="t"><thead><tr><th>${t('thItem')}</th><th>${t('thMean')}</th><th>${t('thSD')}</th><th>${t('thMin')}</th><th>${t('thMax')}</th></tr></thead><tbody>`;
  S.names.forEach((nm,j)=>{ const col=S.rows.map(r=>r[j]); const mu=col.reduce((a,b)=>a+b,0)/n; const sd=Math.sqrt(col.reduce((a,b)=>a+(b-mu)*(b-mu),0)/(n-1)); h+=`<tr style="${S.sel[j]?'':'color:#9aa3b2'}"><td>${esc(nm)}</td><td>${fx(mu,2)}</td><td>${fx(sd,2)}</td><td>${Math.min(...col)}</td><td>${Math.max(...col)}</td></tr>`; });
  $('s1sum').innerHTML=h+'</tbody></table>';
}

// ===================== pipeline =====================
function setStatus(n,state){
  const el=$('st'+n); el.className='st '+(state||''); el.textContent=state==='done'?t('stDone'):state==='check'?t('stCheck'):t('stWait');
  const a=$('pg'+n); if(a) a.className=state||'';
}
function validate(){
  S.err=null; S.warns=[]; S.selIdx=S.sel.map((b,i)=>b?i:-1).filter(i=>i>=0);
  if(!S.loaded||!S.rows.length){ S.err=['errLoad']; return; }
  const idx=S.selIdx; const m=idx.length;
  if(m<3){ S.err=['errVar3']; return; }
  const X=S.rows.map(r=>idx.map(j=>r[j])); S.X=X; const n=X.length;
  if(n<=m){ S.err=['errN',n,m]; return; }
  const C=covMat(X);
  const zero=idx.filter((_,i)=>C[i][i]<1e-10).map(j=>S.names[j]);
  if(zero.length){ S.err=['errZeroSd',zero.join(', ')]; return; }
  const pairs=[];
  for(let i=0;i<m;i++) for(let j=i+1;j<m;j++){ const r=C[i][j]/Math.sqrt(C[i][i]*C[j][j]); if(Math.abs(r)>0.9999) pairs.push([S.names[idx[i]],S.names[idx[j]],r.toFixed(4)]); }
  if(pairs.length){ S.err=['errPerfect',pairs]; return; }
  if(n<100||n<5*m) S.warns.push(['warnSmall',n,m]);
}
function computeAll(){
  S.userK=false; S.fa=null; S.faErr=null; S.dirty=false; S.resetNote=false; S.facNames=[];
  validate();
  if(!S.err){
    const R=corMat(S.X); const e=eigenSym(R);
    if(!e.converged){ S.err=['errEigen']; }
    else{
      S.R=R; S.eig=e.values; const m=S.selIdx.length;
      S.qInit=Math.max(1,Math.min(m-1,e.values.filter(v=>v>=1).length)); S.k=S.qInit;
      // scale range initial values from the selected items
      let mn=Infinity,mx=-Infinity,allInt=true;
      for(const r of S.X) for(const v of r){ if(v<mn) mn=v; if(v>mx) mx=v; if(!Number.isInteger(v)) allInt=false; }
      S.min=allInt?mn:Math.floor(mn); S.max=allInt?mx:Math.ceil(mx);
    }
  }
  renderS1(); renderMsgS1(); renderS2();
  if(!S.err) runFA(true); else { renderS3(); renderS4(); renderS5(); renderS6(); renderS7(); }
  renderProgressAll();
}
function renderMsgS1(){
  let h=''; if(S.err) h+=msg('err',t.apply(null,S.err)); S.warns.forEach(w=>{ h+=msg('warn',t.apply(null,w)); }); $('s1msg').innerHTML=h;
  setStatus(1,S.err?'check':(S.loaded?(S.warns.length?'check':'done'):''));
}
function runFA(initial){
  S.faErr=null; S.fa=null;
  try{ S.fa=factorAnalysis(S.X,S.k,S.rot); }
  catch(e){ S.faErr=(e&&e.code==='singular')?['errSingular',Number(e.minEig).toExponential(2)]:['errEigen']; }
  if(S.fa){
    const m=S.selIdx.length, k=S.k;
    S.assign=Array.from({length:m},(_,i)=>{ let b=0; for(let j=1;j<k;j++) if(Math.abs(S.fa.pattern[i][j])>Math.abs(S.fa.pattern[i][b])) b=j; return b; });
    S.rev=Array.from({length:m},()=>false);
    if(S.facNames.length!==k) S.facNames=Array.from({length:k},()=>'');
    if(!initial&&S.dirty) S.resetNote=true; else S.resetNote=false;
    S.dirty=false;
  }
  renderS2(); renderS3(); renderS4(); renderS5(); renderS6(); renderS7(); renderProgressAll();
}
function onK(v){ let k=Math.round(+v); const m=S.selIdx.length; if(!Number.isFinite(k)) k=S.qInit; k=Math.max(1,Math.min(m-1,k)); S.k=k; S.userK=true; S.facNames=[]; runFA(false); }
function onRot(v){ S.rot=v; runFA(false); }
function onThr(v){ const x=+v; if(Number.isFinite(x)&&x>0&&x<1){ S.thr=x; } renderS3(); renderS4(); }
function onAssign(i,v){ S.assign[i]=+v; S.dirty=true; updateCounts(); renderS5(); renderS6(); renderS7(); renderProgressAll(); }
function onName(j,v){ S.facNames[j]=cleanName(v); renderS5(); renderS6(); renderS7(); }
function onRev(i,c){ S.rev[i]=c; S.dirty=true; renderS6(); renderS7(); renderRangeWarn(); }
function onScale(which,v){ const x=+v; if(!Number.isFinite(x)) return; if(which==='min') S.min=x; else S.max=x; renderRangeWarn(); renderS6(); renderS7(); }

function blockedHtml(){ return `<div class="blocked">${esc(S.loaded?t('blocked'):t('blockedLoad'))}</div>`; }
function ready(){ return !!(S.loaded&&!S.err&&S.eig); }

// ---------- step 2 ----------
function screeSvg(eig,k){
  const m=eig.length, W=520, H=230, L=44, Rr=12, T=12, B=36;
  const mx=Math.max(1.2,Math.ceil(Math.max(...eig)*2)/2), X=i=>L+(m>1?i*(W-L-Rr)/(m-1):0), Y=v=>T+(H-T-B)*(1-v/mx);
  let s=`<svg class="scree" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('screeT'))}"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  for(let g=0;g<=mx+1e-9;g+=Math.max(0.5,Math.round(mx/5*2)/2)) s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(g)}" y2="${Y(g)}" stroke="#e6e9f0"/><text x="${L-6}" y="${Y(g)+4}" font-size="11" text-anchor="end" fill="#5b6577">${g}</text>`;
  s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(1)}" y2="${Y(1)}" stroke="#E24B4A" stroke-dasharray="6 4"/><text x="${W-Rr}" y="${Y(1)-4}" font-size="11" text-anchor="end" fill="#E24B4A">${esc(t('lgEig1'))}</text>`;
  s+=`<polyline fill="none" stroke="#233A9A" stroke-width="2" points="${eig.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
  eig.forEach((v,i)=>{ s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i<k?5.5:4}" fill="${i<k?'#233A9A':'#fff'}" stroke="#233A9A" stroke-width="2"/><text x="${X(i)}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="#5b6577">${i+1}</text>`; });
  s+=`<text x="${(L+W-Rr)/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="#5b6577">${esc(t('axNo'))}</text><text x="12" y="${(T+H-B)/2}" font-size="11" text-anchor="middle" fill="#5b6577" transform="rotate(-90 12 ${(T+H-B)/2})">${esc(t('axEig'))}</text></svg>`;
  return s;
}
function renderS2(){
  if(!ready()){ $('b2').innerHTML=blockedHtml(); setStatus(2,''); return; }
  const m=S.eig.length, tot=m; let cum=0;
  let h=`<h3>${t('s2eigT')}</h3><div class="ov"><table class="t"><thead><tr><th>${t('thNo')}</th><th>${t('thEig')}</th><th>${t('thProp')}</th><th>${t('thCum')}</th></tr></thead><tbody>`;
  S.eig.slice(0,Math.min(m,12)).forEach((v,i)=>{ cum+=v/tot; h+=`<tr><td>${i+1}</td><td class="${v>=1?'hi':''}">${fx(v,4)}</td><td>${fx(v/tot*100,2)}</td><td>${fx(cum*100,2)}</td></tr>`; });
  h+=`</tbody></table></div><h3>${t('screeT')}</h3><div class="scr-wrap">${screeSvg(S.eig,S.k)}</div>`;
  h+=`<div class="row"><div><label class="f">${t('lblK')}</label><input type="number" id="kin" min="1" max="${m-1}" step="1" value="${S.k}" onchange="onK(this.value)"></div><div class="note" style="margin:0 0 6px">${esc(t('kInit',S.qInit))}</div></div><div class="note">${esc(t('kNote'))}</div>`;
  $('b2').innerHTML=h; setStatus(2,'done');
}

// ---------- step 3 ----------
function renderS3(){
  if(!ready()){ $('b3').innerHTML=blockedHtml(); setStatus(3,''); return; }
  if(S.faErr){ $('b3').innerHTML=msg('err',t.apply(null,S.faErr)); setStatus(3,'check'); return; }
  const f=S.fa, m=S.selIdx.length, k=S.k, thr=S.thr, names=S.selIdx.map(j=>S.names[j]);
  let h=`<div class="row"><div class="note" style="margin:0 0 6px"><b>${esc(t('s3method'))}</b></div>
   <div><label class="f">${t('lblRot')}</label><select id="rotsel" onchange="onRot(this.value)"><option value="promax" ${S.rot==='promax'?'selected':''}>${esc(t('rotPm'))}</option><option value="varimax" ${S.rot==='varimax'?'selected':''}>${esc(t('rotVm'))}</option></select></div>
   <div><label class="f">${t('lblThr')}</label><input type="number" min="0.1" max="0.9" step="0.05" value="${thr.toFixed(2)}" onchange="onThr(this.value)"></div></div>`;
  const title=k<2?t('loadNone'):(S.rot==='promax'?t('loadPm'):t('loadVm'));
  h+=`<h3>${title}</h3><div class="ov"><table class="t"><thead><tr><th>${t('thItem')}</th>${Array.from({length:k},(_,j)=>`<th>F${j+1}</th>`).join('')}<th>${t('thComm')}</th></tr></thead><tbody>`;
  for(let i=0;i<m;i++){
    h+=`<tr><td>${esc(names[i])}</td>${f.pattern[i].map(v=>`<td class="${Math.abs(v)>=thr?'hig':''}">${fx(v,4)}</td>`).join('')}<td class="${f.h2[i]>=1?'neg':''}">${fx(f.h2[i],4)}</td></tr>`;
  }
  if(k>=2&&S.rot==='varimax') h+=`<tr style="background:#f0f4fa;font-weight:700"><td>${t('contrib')}</td>${Array.from({length:k},(_,j)=>`<td>${fx(f.pattern.reduce((s,r)=>s+r[j]*r[j],0),4)}</td>`).join('')}<td></td></tr>`;
  h+='</tbody></table></div>';
  if(k>=2&&S.rot==='promax'){
    h+=`<h3>${t('phiT')}</h3><div class="ov"><table class="t"><thead><tr><th></th>${Array.from({length:k},(_,j)=>`<th>F${j+1}</th>`).join('')}</tr></thead><tbody>`;
    for(let i=0;i<k;i++) h+=`<tr><td>F${i+1}</td>${f.phi[i].map((v,j)=>`<td>${i===j?'1.000':fx(v,4)}</td>`).join('')}</tr>`;
    h+=`</tbody></table></div><details><summary style="cursor:pointer;color:var(--blue);font-weight:700;margin-top:8px">${t('structT')}</summary><div class="ov"><table class="t"><thead><tr><th>${t('thItem')}</th>${Array.from({length:k},(_,j)=>`<th>F${j+1}</th>`).join('')}</tr></thead><tbody>`;
    for(let i=0;i<m;i++) h+=`<tr><td>${esc(names[i])}</td>${f.structure[i].map(v=>`<td class="${Math.abs(v)>=thr?'hig':''}">${fx(v,4)}</td>`).join('')}</tr>`;
    h+='</tbody></table></div></details>';
  }
  h+=`<div class="note">${esc(t('dirNote'))}</div>`;
  let st='done';
  if(f.fit.converged) h+=msg('info',t('iterOk',f.fit.iter)); else { h+=msg('warn',t('warnConv')); st='check'; }
  if(f.fit.heywood){ const l=names.filter((_,i)=>f.h2[i]>=1).join(', '); h+=msg('warn',t('warnHey',l)); st='check'; }
  if(f.fit.negEig){ h+=msg('warn',t('warnNeg')); st='check'; }
  h+=`<div class="note">${esc(t('s3note'))}</div>`;
  $('b3').innerHTML=h; setStatus(3,st);
}

// ---------- step 4 ----------
function updateCounts(){
  const el=$('cnts'); if(!el||!S.fa) return; const k=S.k; let h='',st='done';
  for(let j=0;j<k;j++){ const c=S.assign.filter(a=>a===j).length; h+=`<span class="tag ${c<=1?'e':'i'}">${esc(t('cnt',facLabel(j),c))}</span> `; if(c<=1) st='check'; }

}
function renderS4(){
  if(!ready()){ $('b4').innerHTML=blockedHtml(); setStatus(4,''); return; }

  const f=S.fa, m=S.selIdx.length, k=S.k, thr=S.thr, names=S.selIdx.map(j=>S.names[j]);

  for(let i=0;i<m;i++){
    const row=f.pattern[i], mx=Math.max(...row.map(Math.abs)), nBig=row.filter(v=>Math.abs(v)>=thr).length;
    const flags=(mx<thr?`<span class="tag w">${esc(t('flagWeak'))}</span>`:'')+(nBig>=2?`<span class="tag w">${esc(t('flagCross'))}</span>`:'');

  }
  h+=`</tbody></table></div><div id="cnts" style="margin-top:6px"></div><div class="note">${esc(t('s4note'))}</div>`;

// ---------- step 5 ----------
function dataOutOfRange(){
  const bad=[]; const idx=S.selIdx;
  idx.forEach((j,i)=>{ if(S.assign[i]<0) return; for(const r of S.X){ const v=r[i]; if(v<S.min||v>S.max){ bad.push(S.names[j]); break; } } });
  return bad;
}
function renderRangeWarn(){
  const el=$('rangewarn'); if(!el) return; const bad=dataOutOfRange();
  el.innerHTML=(S.max<=S.min?msg('err','min < max'):'')+(bad.length?msg('warn',t('warnRange',bad.join(', '))):'');
}
function renderS5(){
  if(!ready()||S.faErr||!S.fa){ $('b5').innerHTML=blockedHtml(); setStatus(5,''); return; }
  const f=S.fa, m=S.selIdx.length, names=S.selIdx.map(j=>S.names[j]);
  const used=[]; for(let j=0;j<S.k;j++) for(let i=0;i<m;i++) if(S.assign[i]===j) used.push(i);
  if(!used.length){ $('b5').innerHTML=`<div class="blocked">${esc(t('s5none'))}</div>`; setStatus(5,'check'); return; }
  let h=`<div class="row"><div><label class="f">${t('lblSMin')}</label><input type="number" step="1" value="${S.min}" oninput="onScale('min',this.value)"></div><div><label class="f">${t('lblSMax')}</label><input type="number" step="1" value="${S.max}" oninput="onScale('max',this.value)"></div><div class="note" style="margin:0 0 6px"><b>${t('lblScale')}</b>: ${esc(t('scaleChk'))}</div></div><div id="rangewarn"></div>`;
  h+=`<div class="ov"><table class="t"><thead><tr><th>${t('thItem')}</th><th>${t('thFactor')}</th><th>${t('thLoadOn')}</th><th>${t('thRev')}</th></tr></thead><tbody>`;
  let anyHint=false;
  for(const i of used){ const j=S.assign[i], l=f.pattern[i][j], hint=l<0; if(hint) anyHint=true;
    h+=`<tr><td>${esc(names[i])}</td><td class="l">${esc(facLabel(j))}</td><td class="${hint?'neg':''}">${fx(l,3)}${hint?` <span class="tag w">${esc(t('hintRev'))}</span>`:''}</td><td class="l"><input type="checkbox" ${S.rev[i]?'checked':''} onchange="onRev(${i},this.checked)"></td></tr>`; }
  h+=`</tbody></table></div><div class="note">${esc(t('s5note'))}</div>`;
  $('b5').innerHTML=h; renderRangeWarn();
  setStatus(5,(anyHint&&!S.rev.some(x=>x))||dataOutOfRange().length||S.max<=S.min?'check':'done');
}

// ---------- step 6 / 7 helpers ----------
function factorItems(j){ const o=[]; S.assign.forEach((a,i)=>{ if(a===j) o.push(i); }); return o; }
function revMap(){ const o={}; S.rev.forEach((r,i)=>{ if(r) o[i]=true; }); return o; }
function factorMatrix(cols){ const rv=revMap(), mn=S.min, mx=S.max; return S.X.map(r=>cols.map(i=>rv[i]?(mn+mx-r[i]):r[i])); }
function renderS6(){
  if(!ready()||S.faErr||!S.fa){ $('b6').innerHTML=blockedHtml(); setStatus(6,''); return; }
  const names=S.selIdx.map(j=>S.names[j]); let h='', st='done', any=false;
  for(let j=0;j<S.k;j++){
    const cols=factorItems(j); if(!cols.length) continue; any=true;
    h+=`<div class="fac-block"><b>${esc(facLabel(j))}</b>${(S.facNames[j]&&S.facNames[j].trim())?` (F${j+1})`:''} ・ ${t('s6t1')}: ${cols.length}`;
    if(cols.length<2){ h+=msg('warn',t('warnK1',facLabel(j)))+'</div>'; st='check'; continue; }
    const a=alphaStats(factorMatrix(cols));
    h+=` ・ ${t('thAlpha')} = <b>${fx(a.alpha,3)}</b> ・ ${t('thAlphaS')} = ${fx(a.alphaStd,3)}`;
    h+=`<div class="ov"><table class="t"><thead><tr><th>${t('thItem')}</th><th>${t('thMean')}</th><th>${t('thSD')}</th><th>${t('thRDrop')}</th><th>${t('thADrop')}</th></tr></thead><tbody>`;
    cols.forEach((i,q)=>{ const it=a.items[q]; const tags=(it.rDrop<0?`<span class="tag e">${esc(t('tagNegR'))}</span>`:'')+(it.alphaDrop>a.alpha?`<span class="tag w">${esc(t('tagUp'))}</span>`:'');
      h+=`<tr><td>${esc(names[i])}${S.rev[i]?' (R)':''}</td><td>${fx(it.mean,2)}</td><td>${fx(it.sd,2)}</td><td class="${it.rDrop<0?'neg':''}">${fx(it.rDrop,3)}</td><td>${cols.length>2?fx(it.alphaDrop,3):'–'}${tags}</td></tr>`; });
    h+='</tbody></table></div>';
    if(a.alpha<0){ h+=msg('warn',t('warnAneg',facLabel(j))); st='check'; }
    if(a.items.some(it=>it.rDrop<0)) st='check';
    if(cols.length===2) h+=`<div class="note">${esc(t('k2'))}</div>`;
    h+='</div>';
  }
  if(!any){ h=`<div class="blocked">${esc(t('s5none'))}</div>`; st='check'; }
  h+=`<div class="note">${esc(t('s6meanNote'))} ${esc(t('s6note'))}</div>`;
  $('b6').innerHTML=h; setStatus(6,st);
}
function subscales(){
  const out=[]; const used=new Set(); const fl=[];
  for(let j=0;j<S.k;j++){ const cols=factorItems(j); if(!cols.length) continue;
    let nm=facLabel(j); let base=nm, c=1; while(used.has(nm)){ c++; nm=base+'_'+c; } used.add(nm);
    out.push({j,name:nm,cols,scores:subscaleScores(S.X,cols,revMap(),S.min,S.max)}); }
  return out;
}
function descr(v){ const n=v.length, mu=v.reduce((a,b)=>a+b,0)/n, sd=Math.sqrt(v.reduce((a,b)=>a+(b-mu)*(b-mu),0)/(n-1)); return {mu,sd,mn:Math.min(...v),mx:Math.max(...v)}; }
function csvText(sc){
  const lines=[['ID',...sc.map(s=>s.name)].join(',')];
  S.ids.forEach((id,r)=>lines.push([id,...sc.map(s=>String(+s.scores[r].toFixed(6)))].join(',')));
  return lines.join('\r\n');
}
function downloadCsv(){
  const sc=subscales(); if(!sc.length) return;
  const blob=new Blob(['﻿'+csvText(sc)],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='subscale_scores.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function reportLines(sc){
  const o={n:S.X.length,m:S.selIdx.length,iter:S.fa.fit.iter,rot:S.rot,k:S.k,thr:S.thr.toFixed(2),min:S.min,max:S.max,
    revs:S.selIdx.map((j,i)=>S.rev[i]?S.names[j]:null).filter(Boolean),
    facs:sc.map(s=>({name:s.name,k:s.cols.length,alpha:s.cols.length>1?fx(alphaStats(factorMatrix(s.cols)).alpha,3):'–'}))};
  return t('repLines',o);
}
function copyReport(){ const ta=$('reptext'); ta.focus(); ta.select(); let ok=false; try{ok=document.execCommand('copy');}catch(e){} if(!ok&&navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(()=>{}); const b=$('repbtn'); b.textContent=t('copied'); setTimeout(()=>{b.textContent=t('repCopy');},1500); }
function renderS7(){
  if(!ready()||S.faErr||!S.fa){ $('b7').innerHTML=blockedHtml(); setStatus(7,''); return; }
  const sc=subscales();
  if(!sc.length){ $('b7').innerHTML=`<div class="blocked">${esc(t('s7none'))}</div>`; setStatus(7,'check'); return; }
  let h=`<div class="note">${esc(t('s7note'))}</div><h3>${t('s7desc')}</h3><div class="ov"><table class="t"><thead><tr><th>${t('thName')}</th><th>${t('thN')}</th><th>${t('thMean')}</th><th>${t('thSD')}</th><th>${t('thMin')}</th><th>${t('thMax')}</th></tr></thead><tbody>`;
  sc.forEach(s=>{ const d=descr(s.scores); h+=`<tr><td>${esc(s.name)}</td><td>${s.cols.length}</td><td>${fx(d.mu,3)}</td><td>${fx(d.sd,3)}</td><td>${fx(d.mn,2)}</td><td>${fx(d.mx,2)}</td></tr>`; });
  h+='</tbody></table></div>';
  if(sc.length>=2){ const M=sc[0].scores.map((_,r)=>sc.map(s=>s.scores[r])); const C=corMat(M);
    h+=`<h3>${t('s7corr')}</h3><div class="ov"><table class="t"><thead><tr><th></th>${sc.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>`;
    sc.forEach((s,i)=>{ h+=`<tr><td>${esc(s.name)}</td>${C[i].map((v,j)=>`<td>${i===j?'1.000':fx(v,3)}</td>`).join('')}</tr>`; }); h+='</tbody></table></div>'; }
  h+=`<h3>${t('s7head')}</h3><div class="ov"><table class="t"><thead><tr><th>ID</th>${sc.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>`;
  for(let r=0;r<Math.min(10,S.ids.length);r++) h+=`<tr><td>${esc(S.ids[r])}</td>${sc.map(s=>`<td>${fx(s.scores[r],3)}</td>`).join('')}</tr>`;
  h+=`</tbody></table></div><div class="row" style="margin-top:8px"><button class="btn dl" type="button" onclick="downloadCsv()">${esc(t('dlCsv'))}</button></div>`;
  h+=`<h3>${t('repTitle')}</h3><textarea id="reptext" readonly style="height:170px;font-family:inherit;font-size:13px">${esc(reportLines(sc).map(x=>'・'+x).join('\n'))}</textarea><div class="row" style="margin-top:6px"><button class="btn" id="repbtn" type="button" onclick="copyReport()">${esc(t('repCopy'))}</button></div>`;
  const nmq=sc.map(s=>'`'+s.name+'`');
  h+=`<h3>${t('regT')}</h3><div class="note">${esc(t('regNote'))}</div><textarea readonly style="height:112px">scales <- read.csv("subscale_scores.csv", fileEncoding = "UTF-8-BOM")\n# dat <- merge(scales, outcome_data, by = "ID")   # outcome_data: ID と アウトカム y を含むデータ\n# summary(lm(y ~ ${nmq.join(' + ')}, data = dat))</textarea>`;
  $('b7').innerHTML=h;
  let st='done'; if(sc.some(s=>s.cols.length<2)) st='check'; setStatus(7,st);
}
function renderProgressAll(){
  const items=[1,2,3,4,5,6,7].map(n=>`<a href="#s${n}" id="pg${n}"><b>${n}</b>${esc(t('s'+n+'t'))}</a>`); $('progress').innerHTML=items.join('');
  for(let n=1;n<=7;n++){ const c=$('st'+n).className.replace('st','').trim(); const a=$('pg'+n); if(c) a.className=c; }
}
function renderAll(){
  $('pre-list').innerHTML=t('pre').map(x=>`<li>${esc(x)}</li>`).join('');
  renderS1(); renderMsgS1(); renderS2(); renderS3(); renderS4(); renderS5(); renderS6(); renderS7(); renderProgressAll();
}
function onLangChange(){
  // an untouched example follows the language (names are replaced; the analysis settings are reset)
  const ta=$('csv');
  for(const l of ['ja','en']){ const E=(ta.value===EX[l])?EX:(ta.value===EX2[l])?EX2:(ta.value===EX3[l])?EX3:null; if(l!==LANG&&E){ ta.value=E[LANG]; parseCSV(); renderAll(); const rs=$('rs-text'); if(rs.value&&!rsFailed(rs.value)) rsMake(); return; } }
  renderAll();
  const rs=$('rs-text'); if(rs.value&&rs.value.indexOf(RS_FAIL.ja)!==0&&rs.value.indexOf(RS_FAIL.en)!==0) rsMake();
}

// ===================== R script =====================
function rsRaw(text){ let d='---'; while(text.indexOf(')'+d+'"')>=0) d+='-'; return 'r"'+d+'(\n'+text.replace(/\r\n?/g,'\n').replace(/\s+$/,'')+'\n)'+d+'"'; }
const RS_FAIL={ja:'# スクリプトを作成できませんでした',en:'# Could not create the script'};
function rsFailed(v){ return v.indexOf(RS_FAIL.ja)===0||v.indexOf(RS_FAIL.en)===0; }
function rsMake(){ const ta=$('rs-text'); try{ ta.value=buildRScript(); }catch(e){ ta.value=RS_FAIL[LANG]+': '+(e&&e.message?e.message:(e&&e.length?t.apply(null,e):String(e))); } }
function rsCopy(){ const ta=$('rs-text'); rsMake(); if(rsFailed(ta.value)) return; ta.focus(); ta.select(); let ok=false; try{ok=document.execCommand('copy');}catch(e){} if(!ok&&navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(()=>{}); const b=$('rs-copy-btn'); b.textContent=t('copied'); setTimeout(()=>{b.textContent=t('rsCopy');},1500); }
function rsDownload(){ const ta=$('rs-text'); rsMake(); if(rsFailed(ta.value)) return; const b64=btoa(unescape(encodeURIComponent('﻿'+ta.value))); const a=document.createElement('a'); a.href='data:text/plain;charset=utf-8;base64,'+b64; a.download='scale_maker_check.R'; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
function buildRScript(){
  if(!ready()||!S.fa) throw new Error(t(S.err?S.err[0]:'errLoad'));
  const ja=LANG==='ja', m=S.selIdx.length, k=S.k, rot=S.rot;
  const sc=subscales(); const idxs=sc.map(s=>s.j+1);
  const csv=['id,'+S.selIdx.map((_,i)=>'v'+(i+1)).join(',')].concat(S.X.map((r,i)=>S.ids[i]+','+r.join(','))).join('\n');
  const q=x=>'"'+String(x).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
  const T=(a,b)=>ja?a:b;
  const L=[
   '# =====================================================================',
   '# '+T('Scale Maker と同じ計算をRで行う(基本のRだけ。比較用のpsychは、コメントアウトしてあります)','The same calculation as the Scale Maker, in R (base R only; the comparison with psych is commented out)'),
   '# '+T('このスクリプトは、ツールに入力したデータ(欠損値のない行だけ)と、画面で選んだ設定を埋め込んであります。','This script embeds the data entered in the tool (complete rows only) and the settings chosen on the screen.'),
   '# '+T('RStudioに貼り付けて、上から順に実行してください。','Paste it into RStudio and run it from top to bottom.'),
   '# =====================================================================','',
   '# '+T('項目の対応: ','Item mapping: ')+S.selIdx.map((j,i)=>'v'+(i+1)+'='+S.names[j]).join(', '),'',
   T('# 1. データ(1列目は回答者ID)','# 1. Data (column 1 = respondent ID)'),
   'dat <- read.csv(text = '+rsRaw(csv)+', header = TRUE, row.names = 1)',
   'X <- as.matrix(dat)','m <- ncol(X)','k <- '+k+T('   # 因子数(画面で選んだ数)','   # number of factors (as chosen on the screen)'),'',
   T('# 2. 相関行列と固有値(因子数を決める目安)','# 2. Correlation matrix and eigenvalues (a guide for the number of factors)'),
   'R <- cor(X)','print(round(eigen(R)$values, 4))','',
   T('# 3. 主因子法(初期の共通性 = 重相関の2乗。共通性の合計の変化が 1e-8 未満になるまで反復)','# 3. Principal axis factoring (initial communalities = squared multiple correlations; iterate until the change in their sum is below 1e-8)'),
   'h <- 1 - 1 / diag(solve(R))','comm <- sum(h); err <- comm; it <- 1',
   'while (err > 1e-8) {','  rr <- R; diag(rr) <- h','  e <- eigen(rr)',
   '  L <- e$vectors[, 1:k, drop = FALSE] %*% diag(sqrt(pmax(e$values[1:k], 0)), nrow = k)',
   '  h <- rowSums(L^2)','  err <- abs(comm - sum(h)); comm <- sum(h); it <- it + 1','  if (it > 1000) break','}',
   T('L <- sweep(L, 2, ifelse(colSums(L) < 0, -1, 1), "*")   # 因子の向き: 負荷量の合計が正になるようにそろえる','L <- sweep(L, 2, ifelse(colSums(L) < 0, -1, 1), "*")   # orientation: make the sum of each factor\'s loadings positive'),'',
   T('# 4. 回転('+(rot==='promax'?'プロマックス: stats::promax、べき乗4':'バリマックス: stats::varimax、Kaiser正規化あり')+')','# 4. Rotation ('+(rot==='promax'?'promax: stats::promax, power 4':'varimax: stats::varimax, with Kaiser normalization')+')')];
  if(k<2) L.push('pattern <- L; Phi <- matrix(1)');
  else if(rot==='promax') L.push('pm <- promax(L, m = 4)','pattern <- unclass(pm$loadings)','Phi <- solve(crossprod(pm$rotmat))');
  else L.push('vm <- varimax(L)','pattern <- unclass(vm$loadings)','Phi <- diag(k)');
  L.push(T('# 回転後の向きと並び順(psych::fa と同じ規則: 合計が正の向き。因子の分散の大きい順)','# Orientation and order after rotation (same rule as psych::fa: positive sum; descending factor variance)'),
   'sg <- ifelse(colSums(pattern) < 0, -1, 1)','pattern <- sweep(pattern, 2, sg, "*"); Phi <- Phi * outer(sg, sg)',
   'ord <- order(diag(Phi %*% crossprod(pattern)), decreasing = TRUE)','pattern <- pattern[, ord, drop = FALSE]; Phi <- Phi[ord, ord, drop = FALSE]',
   'rownames(pattern) <- colnames(X)',
   'cat("'+T('共通性','Communality')+'\\n"); print(round(h, 4))',
   'cat("'+T('因子パターン行列','Pattern matrix')+'\\n"); print(round(pattern, 4))',
   'cat("'+T('因子間相関','Factor correlations')+'\\n"); print(round(Phi, 4))',
   'cat("'+T('構造行列','Structure matrix')+'\\n"); print(round(pattern %*% Phi, 4))','');
  const asg=S.assign.map(a=>a+1<=0?0:a+1);
  L.push(T('# 5. 項目の割り当て(0 = 使わない)と、逆転項目','# 5. Item assignment (0 = not used) and reverse-coded items'),
   'assign <- c('+asg.join(', ')+')','rev_items <- c('+S.rev.map(r=>r?'TRUE':'FALSE').join(', ')+')',
   'smin <- '+S.min+'; smax <- '+S.max+T('   # 尺度の範囲','   # scale range'),
   'Xr <- X','if (any(rev_items)) Xr[, rev_items] <- (smin + smax) - X[, rev_items]','',
   T('# 6. クロンバックのαと、下位尺度得点(項目の平均)','# 6. Cronbach\'s alpha and subscale scores (item means)'),
   'alpha_raw <- function(x) { kk <- ncol(x); C <- cov(x); kk / (kk - 1) * (1 - sum(diag(C)) / sum(C)) }',
   'alpha_std <- function(x) { r <- cor(x); rb <- mean(r[lower.tri(r)]); ncol(x) * rb / (1 + (ncol(x) - 1) * rb) }',
   'fac_idx <- c('+idxs.join(', ')+')','fac_names <- c('+sc.map(s=>q(s.name)).join(', ')+')',
   'out <- data.frame(ID = rownames(X))',
   'for (q in seq_along(fac_idx)) {','  x <- Xr[, which(assign == fac_idx[q]), drop = FALSE]',
   '  cat("\\n", fac_names[q], ": ", ncol(x), "'+T('項目','items')+'\\n", sep = "")',
   '  if (ncol(x) >= 2) {','    cat("alpha =", round(alpha_raw(x), 4), " standardized alpha =", round(alpha_std(x), 4), "\\n")',
   '    print(round(data.frame(r_drop = sapply(1:ncol(x), function(i) cor(x[, i], rowSums(x[, -i, drop = FALSE]))),',
   '                           alpha_drop = if (ncol(x) > 2) sapply(1:ncol(x), function(i) alpha_raw(x[, -i, drop = FALSE])) else NA, row.names = colnames(x)), 4))',
   '  }','  out[[fac_names[q]]] <- rowMeans(x)','}','print(head(round(out[, -1, drop = FALSE], 4)))',
   'write.csv(out, "subscale_scores.csv", row.names = FALSE, fileEncoding = "UTF-8")','',
   T('# ---------------------------------------------------------------------','# ---------------------------------------------------------------------'),
   T('# 比較する場合(psych が必要。先頭の # を外して実行)','# To compare with psych (requires psych; remove the leading # and run)'),
   '# library(psych)',
   '# fa(X, nfactors = k, fm = "pa", rotate = "'+(k<2?'none':(rot==='promax'?'Promax':'varimax'))+'", SMC = TRUE, min.err = 1e-8, max.iter = 1000)',
   T('# 注: psych の既定は min.err = 0.001, max.iter = 50 です。既定のままだと、収束が緩く、小数第3位あたりまで結果が変わることがあります。','# Note: psych defaults to min.err = 0.001 and max.iter = 50. With the defaults the convergence is looser, and results can differ around the third decimal place.'),
   T('# 注: プロマックスの計算は、psych のバージョンによって少し異なります(新しい版では、因子負荷量の小数第3位が、Rの標準の promax と最大0.003ずれることを確認しました)。ツールと、このスクリプトの本体は、Rの標準の stats::promax と同じ計算です。','# Note: the promax calculation differs slightly between psych versions (a newer version differed from base R promax by up to 0.003 in the third decimal place of the loadings). The tool and the main body of this script use the same calculation as base R stats::promax.'),
   T('# 注: rotate = "promax"(小文字)は、Kaiser正規化が加わるため、値が少し変わります。stats::promax と同じ計算は "Promax" です。','# Note: rotate = "promax" (lower case) adds Kaiser normalization, so the values change slightly. "Promax" is the same calculation as stats::promax.'),
   '# alpha(Xr[, which(assign == 1)], check.keys = FALSE)','',
   T('# ---- 修正するなら、ここ -----------------------------------------------','# ---- If you want to change something, here ---------------------------'),
   T('# 因子数を平行分析で決める場合','# To decide the number of factors by parallel analysis'),
   '# psych::fa.parallel(X, fm = "pa", fa = "fa")','',
   T('# 最尤法に変える場合(fm を変える)','# To use maximum likelihood (change fm)'),
   '# psych::fa(X, nfactors = k, fm = "ml", rotate = "Promax")',
   T('# または','# or'),
   '# stats::factanal(X, factors = k, rotation = "promax")');
  return L.join('\n')+'\n';
}

LANG=detectLang();
applyI18n();
</script>
