<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCA Quickstart</title>
<script data-goatcounter="https://yuki-toyoda.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<meta id="metaDesc" name="description" content="Generates a ready-to-run QCA script (truthTable / minimize) for data you've already calibrated to crisp 0/1 or fuzzy [0,1] membership scores.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1ef;
    --surface:#ffffff;
    --surface-2:#e3e8e6;
    --border:#c9d1ce;
    --text:#16211f;
    --text-muted:#57655f;
    --accent:#1f6f78;
    --accent-ink:#ffffff;
    --accent-2:#c1601a;
    --accent-2-tint:#f5e6d8;
    --code-bg:#151b1a;
    --code-text:#e7ece9;
    --code-key:#7fd4c9;
    --code-str:#e0a566;
    --code-num:#d7c48a;
    --shadow: 0 1px 2px rgba(20,30,28,.06), 0 8px 24px -12px rgba(20,30,28,.18);
    color-scheme: light;
  }
  /* Light theme only, to match the other tools */

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans", system-ui, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    padding-inline:16px; padding-block:0 64px;
  }
  .wrap{max-width:1080px; margin:0 auto;}
  code, pre, .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}

  .hbar{background:#233A9A;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;margin-inline:-16px;}
  .hbar-title{font-size:17px;font-weight:600;}
  .hbar-badge{background:#F28018;color:#1a2332;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
  .hbar .langsw{position:static;margin-left:auto;}
  .hbar .langsw button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);}
  .hbar .langsw button.on{background:#fff;color:#233A9A;border-color:#fff;font-weight:700;}
  .disc{background:#F28018;color:#1a2332;font-weight:700;font-size:12px;line-height:1.6;padding:10px 24px;margin-inline:-16px;}
  .wrap{margin-top:24px;}
  header.top{margin-bottom:22px;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-2-tint);
    border:1px solid var(--border); padding:3px 10px; border-radius:999px;
    margin-bottom:12px;
  }
  h1{
    font-size:clamp(22px, 3.4vw, 30px); line-height:1.2; margin:0 0 8px;
    text-wrap:balance; font-weight:700;
  }
  header.top p{
    color:var(--text-muted); max-width:64ch; margin:0;
    font-size:14.5px; line-height:1.55;
  }

  .layout{
    display:grid; grid-template-columns: 1.15fr 1fr; gap:20px;
    align-items:start;
  }
  @media (max-width: 860px){ .layout{grid-template-columns: 1fr;} }

  .panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow); padding:20px;
  }
  .panel + .panel{margin-top:16px;}

  .section-title{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-muted); font-weight:600; margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title .n{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background:var(--surface-2); color:var(--text);
    font-size:10.5px; font-family:"IBM Plex Mono",monospace;
  }

  label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px;}
  label .hint{font-weight:400; color:var(--text-muted); font-size:11.5px;}
  .field{margin-bottom:14px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:480px){ .row2,.row3{grid-template-columns:1fr;} }

  input[type="text"], input[type="number"], select{
    width:100%; border:1px solid var(--border); background:var(--surface);
    color:var(--text); border-radius:8px; padding:8px 10px;
    font-size:13.5px; font-family:"IBM Plex Mono", monospace;
  }
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .outcome-precal{
    display:flex; align-items:center; gap:6px; font-size:11px;
    color:var(--text-muted); margin-top:6px;
  }
  .outcome-precal input{width:auto; margin:0;}

  .cond-table{border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .cond-row{
    display:grid; grid-template-columns: 1.1fr 1fr .95fr; gap:8px;
    padding:9px 10px; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .cond-row:last-child{border-bottom:none;}
  .cond-row:nth-child(odd){background:var(--surface-2);}
  .cond-row .cname{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600;}
  .cond-vals input{width:100%; padding:6px 8px; font-size:12.5px;}
  .precal-toggle{
    display:flex; align-items:center; gap:5px; font-size:10.5px;
    color:var(--text-muted); white-space:nowrap; cursor:pointer;
  }
  .precal-toggle input{width:auto; margin:0;}
  .precal-note{font-size:11px; color:var(--text-muted); font-style:italic;}
  .empty-note{padding:14px; color:var(--text-muted); font-size:12.5px; text-align:center;}

  .dir-row{
    display:grid; grid-template-columns: 1.2fr 1.8fr; gap:10px;
    padding:9px 10px; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .dir-row:last-child{border-bottom:none;}
  .dir-row:nth-child(odd){background:var(--surface-2);}
  .dir-row select{padding:6px 8px; font-size:12.5px;}

  .note-box{
    font-size:12px; line-height:1.55; color:var(--text-muted);
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:9px; padding:9px 11px; margin:0 0 14px;
  }
  .note-box b{color:var(--text); font-weight:600;}
  .note-box .soltype{
    display:inline-block; font-weight:700; color:var(--accent-2);
    font-family:"IBM Plex Mono",monospace; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.04em;
  }

  .code-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; gap:10px; flex-wrap:wrap;
  }
  .code-head h2{font-size:13px; margin:0; font-weight:600;}
  .copy-btn{
    border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
    border-radius:8px; padding:7px 13px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:"IBM Plex Sans",sans-serif;
    display:inline-flex; align-items:center; gap:6px;
  }
  .copy-btn:active{transform:translateY(1px);}
  .copy-btn.copied{background:var(--accent-2); border-color:var(--accent-2);}

  pre.codebox{
    background:var(--code-bg); color:var(--code-text);
    border-radius:10px; padding:16px 14px; font-size:12.5px; line-height:1.6;
    overflow-x:auto; margin:0; white-space:pre;
  }
  .k{color:var(--code-key);}
  .s{color:var(--code-str);}
  .nnum{color:var(--code-num);}

  .trust{
    margin-top:14px; font-size:12px; line-height:1.55; color:var(--text-muted);
    border-top:1px solid var(--border); padding-top:12px;
  }
  .trust b{color:var(--text);}

  .upsell{
    margin-top:16px; padding:14px; border-radius:11px;
    background:var(--accent-2-tint); border:1px solid var(--border);
    font-size:12.5px; line-height:1.55;
  }
  .upsell b{color:var(--text);}
  .upsell a{color:var(--accent-2); font-weight:700; text-decoration:none;}
  .upsell a:hover{text-decoration:underline;}

  footer{
    margin-top:22px; font-size:12px; color:var(--text-muted);
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  }
  footer a{color:var(--accent); text-decoration:none; font-weight:600;}
  footer a:hover{text-decoration:underline;}
  .dot{opacity:.5;}

  /* ---- language toggle + footer (i18n) ---- */
  header.top{position:relative;}
  .langsw{position:absolute; top:0; right:0; display:flex; gap:4px;}
  .langsw button{
    background:transparent; color:var(--text-muted); border:1px solid var(--border);
    border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .langsw button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
  .solhint{font-size:11.5px; color:var(--text-muted);}
  .foot{margin-top:14px; font-size:11px; color:var(--text-muted);}
</style>

<header class="hbar"><span class="hbar-title" data-i="barTitle"></span><span class="hbar-badge">QCA</span><div class="langsw"><button type="button" data-lang="ja" onclick="setLang('ja')">日本語</button><button type="button" data-lang="en" onclick="setLang('en')">English</button></div></header>
<div class="disc"><span data-i="disc1"></span><br><span data-i="disc2"></span></div>
<div class="wrap">
  <header class="top">
    <span class="eyebrow" data-i="eyebrow"></span>
    <h1 data-i="h1"></h1>
    <p data-ih="lead"></p>
  </header>

  <div class="layout">
    <div class="left">
      <div class="panel">
        <p class="section-title"><span class="n">1</span><span data-i="sec1"></span></p>
        <p class="note-box" data-ih="noteCal"></p>
        <div class="row2">
          <div class="field">
            <label data-ih="lblDat"></label>
            <input type="text" id="dat" value="dat">
          </div>
          <div class="field">
            <label data-ih="lblOutcome"></label>
            <input type="text" id="outcome" value="Y">
          </div>
        </div>

        <div class="field">
          <label data-ih="lblConds"></label>
          <input type="text" id="conditions" value="X1, X2, X3">
        </div>

        <p class="section-title" style="margin-top:16px;"><span class="n">2</span><span data-i="sec2"></span></p>
        <div class="row3">
          <div class="field">
            <label data-ih="lblIncl"></label>
            <input type="text" id="inclCut" value="0.8">
          </div>
          <div class="field">
            <label data-ih="lblN"></label>
            <input type="text" id="nCut" value="1">
          </div>
          <div class="field">
            <label data-i="lblSol"></label>
            <select id="solutionType">
              <option value="conservative" data-i="optConservative"></option>

              <option value="intermediate" selected data-i="optIntermediate"></option>
              <option value="liberal" data-i="optLiberal"></option>
            </select>
          </div>
        </div>
        <p class="note-box" id="solutionHelp"></p>

        <div id="dirExpSection">
          <p class="section-title"><span class="n">3</span><span data-i="sec3"></span><span class="hint" data-i="sec3h"></span></p>
          <div class="cond-table" id="dirTable"></div>
          <p class="note-box" data-ih="noteDir"></p>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="panel" style="position:sticky; top:16px;">
        <div class="code-head">
          <h2 data-i="codeTitle"></h2>
          <button class="copy-btn" id="copyBtn" data-i="copy"></button>
        </div>
        <pre class="codebox"><code id="codeOut"></code></pre>
        <p class="trust" data-ih="trust"></p>
        <div class="upsell" data-ih="upsell"></div>
      </div>
    </div>
  </div>

  <footer>
    <span>install.packages("QCA")</span>
    <span class="dot">&middot;</span>
    <a href="sweep-builder.html" data-i="ftSweep"></a>
    <span class="dot">&middot;</span>
    <span data-i="ftAuthor"></span>
  </footer>
  <div class="foot" data-i="foot"></div>
</div>

<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}
// =================================================================

  dirFavors:"存在・高水準がアウトカムに寄与",
  dirDisfavors:"不在・低水準がアウトカムに寄与",
  noteDir:"条件ごとに、その存在・高水準がアウトカムの成立に寄与するのか（<b>存在・高水準がアウトカムに寄与</b>）、不在・低水準が寄与するのか（<b>不在・低水準がアウトカムに寄与</b>）、あるいはどちらとも言えないのか（<b>期待なし</b>）を選びます。この設定が、倹約解を中間解に変えます。中間解は、QCAの多くの解説書（Ragin 2008; Schneider &amp; Wagemann 2012）が報告を推奨している種類の解です。",
  emptyConds:"上の欄に条件変数を一つ以上入力してください。",
  codeTitle:"生成されたRコード",
  copy:"コードをコピー",
  copied:"コピーしました",
  codeEmpty:"# 条件変数を一つ以上入力すると、コードが生成されます",
  trust:"<b>この形にしている理由:</b> <code class=\"mono\">truthTable()</code> と <code class=\"mono\">minimize()</code> はQCAパッケージ自身の関数で、ドキュメントどおりに使っています。このページは呼び出しのコードを組み立てるだけで、計算そのものは行いません。",
  upsell:"<b>閾値を一つしか確認していませんか。</b> 適切な閾値が一目で決まることはまれです。閾値を動かしたときに解がどう変わるかは、姉妹ツールで確認できます。<a href=\"sweep-builder.html\">スイープビルダー（ThSQCA）&rarr;</a>",
  ftSweep:"スイープビルダー",
  ftAuthor:"Yuki Toyoda（法政大学）",
  foot:"このツールは、Claude（Anthropic）の支援を受けて開発しました。"
});
// ===========================================================

(function(){
  "use strict";

  var state = { conds: [] };

  function $(id){ return document.getElementById(id); }

  function parseConditions(raw){
    return raw.split(",").map(function(s){return s.trim();}).filter(Boolean);
  }
  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function isNumericToken(s){
    return /^-?\d+(\.\d+)?$/.test((s||"").trim());
  }
  function rConditionsVec(names){
    return "c(" + names.map(function(n){ return '"' + n + '"'; }).join(", ") + ")";
  }

  // ---- condition list (names only; no calibration inputs needed) --------

  function rebuildCondTable(){
    var raw = $("conditions").value;
    var names = parseConditions(raw);

    var prev = {};
    state.conds.forEach(function(c){ prev[c.name] = c; });
    state.conds = names.map(function(name){
      return prev[name] || { name:name, dir:"-" };
    });

    rebuildDirTable();
    renderCode();
  }

  // ---- directional-expectation table ------------------------------------

  var DIR_OPTIONS = [
    { value:"-", key:"dirNone" },
    { value:"1", key:"dirFavors" },
    { value:"0", key:"dirDisfavors" }
  ];

  function rebuildDirTable(){
    var table = $("dirTable");
    if (!table) return;
    if (state.conds.length === 0){
      table.innerHTML = '<div class="empty-note">'+t('emptyConds')+'</div>';
      return;
    }
    table.innerHTML = state.conds.map(function(c, i){
      var opts = DIR_OPTIONS.map(function(o){
        return '<option value="'+o.value+'"'+(c.dir===o.value?" selected":"")+'>'+t(o.key)+'</option>';
      }).join("");
      return '<div class="dir-row">'+
               '<span class="cname">'+escapeHtml(c.name)+'</span>'+
               '<select data-ci="'+i+'">'+opts+'</select>'+
             '</div>';
    }).join("");
    table.querySelectorAll("select").forEach(function(sel){
      sel.addEventListener("change", function(){
        var i = +sel.getAttribute("data-ci");
        state.conds[i].dir = sel.value;
        renderCode();
      });
    });
  }

  function rDirExpVec(conds){
    var toks = conds.map(function(c){ return c.dir || "-"; });
    if (toks.every(function(t){ return t === "-"; })) return null;
    return "c(" + toks.map(function(t){
      return isNumericToken(t) ? t : '"' + t + '"';
    }).join(", ") + ")";
  }

  // ---- solution type -----------------------------------------------------

  var SOLUTION_META = {
    conservative: { include:"",  useDir:false },
    parsimonious: { include:"?", useDir:false },
    intermediate: { include:"?", useDir:true  },
    liberal:      { include:"1", useDir:false }
  };

  function updateSolutionHelp(){
    var v = $("solutionType").value;
    if (!SOLUTION_META[v]) v = "intermediate";
    var m = SOLUTION_META[v];
    var hint = t("solHint_"+v);
    $("solutionHelp").innerHTML = '<span class="soltype">'+t("solLabel_"+v)+'</span>' +
      (hint ? ' <span class="solhint">'+hint+'</span>' : '') + t("solSep") + t("solText_"+v);
    $("dirExpSection").style.display = m.useDir ? "" : "none";
  }

  // ---- code generation ----------------------------------------------------

  function highlight(code){
    var esc = escapeHtml(code);
    esc = esc.replace(/"([^"\\]|\\.)*"/g, function(m){ return '<span class="s">'+m+'</span>'; });
    esc = esc.replace(/\b(\d+(\.\d+)?)\b/g, function(m){ return '<span class="nnum">'+m+'</span>'; });
    esc = esc.replace(/\b(calibrate|truthTable|minimize|library)\b(?=\()/g, function(m){ return '<span class="k">'+m+'</span>'; });
    esc = esc.replace(/\b(TRUE|FALSE)\b/g, function(m){ return '<span class="k">'+m+'</span>'; });
    return esc;
  }

  function renderCode(){
    var dat = $("dat").value.trim() || "dat";
    var outcome = $("outcome").value.trim() || "Y";
    var inclCut = $("inclCut").value.trim() || "0.8";
    var nCut = $("nCut").value.trim() || "1";
    var solMeta = SOLUTION_META[$("solutionType").value] || SOLUTION_META.intermediate;
    var dirExp = solMeta.useDir ? rDirExpVec(state.conds) : null;
    var condNames = state.conds.map(function(c){ return c.name; });

    if (condNames.length === 0){
      $("codeOut").innerHTML = '<span style="color:var(--text-muted)">' +
        t("codeEmpty") + "</span>";
      return;
    }

    var lines = [];
    lines.push("library(QCA)");
    lines.push("");
    lines.push("tt <- truthTable(");
    lines.push("  " + dat + ",");
    lines.push('  outcome = "' + outcome + '",');
    lines.push("  conditions = " + rConditionsVec(condNames) + ",");
    lines.push("  incl.cut = " + inclCut + ",");
    lines.push("  n.cut = " + nCut + ",");
    lines.push("  show.cases = TRUE");
    lines.push(")");
    lines.push("tt");
    lines.push("");
    lines.push("sol <- minimize(");
    lines.push("  tt,");
    lines.push('  include = "' + solMeta.include + '"' + (dirExp ? "," : ""));
    if (dirExp) lines.push("  dir.exp = " + dirExp);
    lines.push(")");
    lines.push("sol");

    $("codeOut").innerHTML = highlight(lines.join("\n"));
  }

  // ---- copy ---------------------------------------------------------------

  $("copyBtn").addEventListener("click", function(){
    var text = $("codeOut").textContent;
    var btn = $("copyBtn");
    function done(){
      btn.textContent = t("copied");
      btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = t("copy"); btn.classList.remove("copied"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });
  function fallbackCopy(text, cb){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    cb();
  }

  // ---- wiring --------------------------------------------------------------

  ["dat","outcome","inclCut","nCut"].forEach(function(id){
    var el = $(id);
    el.addEventListener("input", renderCode);
    el.addEventListener("change", renderCode);
  });
  $("solutionType").addEventListener("change", function(){ updateSolutionHelp(); renderCode(); });
  $("conditions").addEventListener("input", rebuildCondTable);

  window.onLangChange = function(){
    $("metaDesc").setAttribute("content", t("desc"));
    updateSolutionHelp();
    rebuildCondTable();
  };
  LANG = detectLang();
  applyI18n();
})();
</script>
