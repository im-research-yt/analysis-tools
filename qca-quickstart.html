<style>
  :root{
    --bg:#eef1ef;
    --surface:#ffffff;
    --surface-2:#e3e8e6;
    --border:#c9d1ce;
    --text:#16211f;
    --text-muted:#57655f;
    --accent:#1f6f78;
    --accent-ink:#ffffff;
    --accent-2:#c1601a;
    --accent-2-tint:#f5e6d8;
    --code-bg:#151b1a;
    --code-text:#e7ece9;
    --code-key:#7fd4c9;
    --code-str:#e0a566;
    --code-num:#d7c48a;
    --shadow: 0 1px 2px rgba(20,30,28,.06), 0 8px 24px -12px rgba(20,30,28,.18);
    color-scheme: light;
  }
  /* Light theme only, to match the other tools */

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans", system-ui, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    padding-inline:16px; padding-block:0 64px;
  }
  .wrap{max-width:1080px; margin:0 auto;}
  code, pre, .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}

  .hbar{background:#233A9A;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;margin-inline:-16px;}
  .hbar-title{font-size:17px;font-weight:600;}
  .hbar-badge{background:#F28018;color:#1a2332;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
  .hbar .langsw{position:static;margin-left:auto;}
  .hbar .langsw button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);}
  .hbar .langsw button.on{background:#fff;color:#233A9A;border-color:#fff;font-weight:700;}
  .disc{background:#F28018;color:#1a2332;font-weight:700;font-size:12px;line-height:1.6;padding:10px 24px;margin-inline:-16px;}
  .wrap{margin-top:24px;}
  header.top{margin-bottom:22px;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-2-tint);
    border:1px solid var(--border); padding:3px 10px; border-radius:999px;
    margin-bottom:12px;
  }
  h1{
    font-size:clamp(22px, 3.4vw, 30px); line-height:1.2; margin:0 0 8px;
    text-wrap:balance; font-weight:700;
  }
  header.top p{
    color:var(--text-muted); max-width:64ch; margin:0;
    font-size:14.5px; line-height:1.55;
  }

  .layout{
    display:grid; grid-template-columns: 1.15fr 1fr; gap:20px;
    align-items:start;
  }
  @media (max-width: 860px){ .layout{grid-template-columns: 1fr;} }

  .panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow); padding:20px;
  }
  .panel + .panel{margin-top:16px;}

  .section-title{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-muted); font-weight:600; margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title .n{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background:var(--surface-2); color:var(--text);
    font-size:10.5px; font-family:"IBM Plex Mono",monospace;
  }

  label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px;}
  label .hint{font-weight:400; color:var(--text-muted); font-size:11.5px;}
  .field{margin-bottom:14px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:480px){ .row2,.row3{grid-template-columns:1fr;} }

  input[type="text"], input[type="number"], select{
    width:100%; border:1px solid var(--border); background:var(--surface);
    color:var(--text); border-radius:8px; padding:8px 10px;
    font-size:13.5px; font-family:"IBM Plex Mono", monospace;
  }
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .outcome-precal{
    display:flex; align-items:center; gap:6px; font-size:11px;
    color:var(--text-muted); margin-top:6px;
  }
  .outcome-precal input{width:auto; margin:0;}

  .cond-table{border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .cond-row{
    display:grid; grid-template-columns: 1.1fr 1fr .95fr; gap:8px;
    padding:9px 10px; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .cond-row:last-child{border-bottom:none;}
  .cond-row:nth-child(odd){background:var(--surface-2);}
  .cond-row .cname{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600;}
  .cond-vals input{width:100%; padding:6px 8px; font-size:12.5px;}
  .precal-toggle{
    display:flex; align-items:center; gap:5px; font-size:10.5px;
    color:var(--text-muted); white-space:nowrap; cursor:pointer;
  }
  .precal-toggle input{width:auto; margin:0;}
  .precal-note{font-size:11px; color:var(--text-muted); font-style:italic;}
  .empty-note{padding:14px; color:var(--text-muted); font-size:12.5px; text-align:center;}

  .dir-row{
    display:grid; grid-template-columns: 1.2fr 1.8fr; gap:10px;
    padding:9px 10px; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .dir-row:last-child{border-bottom:none;}
  .dir-row:nth-child(odd){background:var(--surface-2);}
  .dir-row select{padding:6px 8px; font-size:12.5px;}

  .note-box{
    font-size:12px; line-height:1.55; color:var(--text-muted);
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:9px; padding:9px 11px; margin:0 0 14px;
  }
  .note-box b{color:var(--text); font-weight:600;}
  .note-box .soltype{
    display:inline-block; font-weight:700; color:var(--accent-2);
    font-family:"IBM Plex Mono",monospace; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.04em;
  }

  .code-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; gap:10px; flex-wrap:wrap;
  }
  .code-head h2{font-size:13px; margin:0; font-weight:600;}
  .copy-btn{
    border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
    border-radius:8px; padding:7px 13px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:"IBM Plex Sans",sans-serif;
    display:inline-flex; align-items:center; gap:6px;
  }
  .copy-btn:active{transform:translateY(1px);}
  .copy-btn.copied{background:var(--accent-2); border-color:var(--accent-2);}

  pre.codebox{
    background:var(--code-bg); color:var(--code-text);
    border-radius:10px; padding:16px 14px; font-size:12.5px; line-height:1.6;
    overflow-x:auto; margin:0; white-space:pre;
  }
  .k{color:var(--code-key);}
  .s{color:var(--code-str);}
  .nnum{color:var(--code-num);}

  .readfirst{
    margin-top:14px; padding:12px 14px; border-radius:10px;
    background:var(--accent-2-tint); border:1px solid var(--accent-2);
    border-left:6px solid var(--accent-2);
    font-size:12.5px; line-height:1.6; color:var(--text);
  }
  .readfirst b{font-size:13.5px; color:var(--accent-2);}
  .readfirst ul{margin:6px 0 0; padding-left:1.2em;}
  .readfirst li{margin-bottom:5px;}
  .readfirst li:last-child{margin-bottom:0;}
  .readfirst b.em{font-size:13px; color:var(--text); background:#fff3a8; padding:1px 3px; border-radius:3px;}
  .readfirst .rf-books{margin-top:10px; padding-top:9px; border-top:1px dashed var(--accent-2);}
  .readfirst .rf-books ul{margin:4px 0 6px;}
  .readfirst .rf-books li{margin-bottom:3px; font-size:12px;}
  .readfirst a{color:var(--accent-2); font-weight:700; text-decoration:none;}
  .readfirst a:hover{text-decoration:underline;}

  .trust{
    margin-top:14px; font-size:12px; line-height:1.55; color:var(--text-muted);
    border-top:1px solid var(--border); padding-top:12px;
  }
  .trust b{color:var(--text);}

  .upsell{
    margin-top:16px; padding:14px; border-radius:11px;
    background:var(--accent-2-tint); border:1px solid var(--border);
    font-size:12.5px; line-height:1.55;
  }
  .upsell b{color:var(--text);}
  .upsell a{color:var(--accent-2); font-weight:700; text-decoration:none;}
  .upsell a:hover{text-decoration:underline;}

  footer{
    margin-top:22px; font-size:12px; color:var(--text-muted);
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  }
  footer a{color:var(--accent); text-decoration:none; font-weight:600;}
  footer a:hover{text-decoration:underline;}
  .dot{opacity:.5;}

  /* ---- language toggle + footer (i18n) ---- */
  header.top{position:relative;}
  .langsw{position:absolute; top:0; right:0; display:flex; gap:4px;}
  .langsw button{
    background:transparent; color:var(--text-muted); border:1px solid var(--border);
    border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .langsw button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
  .solhint{font-size:11.5px; color:var(--text-muted);}
  .foot{margin-top:14px; font-size:11px; color:var(--text-muted);}
/* back link to the blog's tools page */
.backlink{color:#fff;text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap;padding:3px 10px;border:1px solid rgba(255,255,255,.45);border-radius:6px;flex-shrink:0}
.backlink:hover{background:rgba(255,255,255,.15)}
.backlink.bl-en{display:none}
html[lang="en"] .backlink.bl-ja{display:none}
html[lang="en"] .backlink.bl-en{display:inline-block}
.backlink-home{color:#fff;text-decoration:none;font-size:12px;opacity:.92;white-space:nowrap;flex-shrink:0}
.backlink-home:hover{text-decoration:underline;opacity:1}
.backlink-home.bl-en{display:none}
html[lang="en"] .backlink-home.bl-ja{display:none}
html[lang="en"] .backlink-home.bl-en{display:inline}
@media (max-width:600px){header,.hbar{flex-wrap:wrap}}
</style>

<div class="disc"><span data-i="disc1"></span><br><span data-i="disc2"></span></div>
<div class="wrap">
  <header class="top">
    <span class="eyebrow" data-i="eyebrow"></span>

  <div class="layout">
    <div class="left">
      <div class="panel">
        <p class="section-title"><span class="n">1</span><span data-i="sec1"></span></p>
        <p class="note-box" data-ih="noteCal"></p>
        <div class="row2">
          <div class="field">

            <input type="text" id="dat" value="dat">
          </div>
          <div class="field">
            <label data-ih="lblOutcome"></label>

          </div>
        </div>

        <div class="field">
          <label data-ih="lblConds"></label>
          <input type="text" id="conditions" value="X1, X2, X3">
        </div>

        <p class="section-title" style="margin-top:16px;"><span class="n">2</span><span data-i="sec2"></span></p>
        <div class="row3">
          <div class="field">
            <label data-ih="lblIncl"></label>

          <div class="field">

          </div>
          <div class="field">
            <label data-i="lblSol"></label>

              <option value="conservative" data-i="optConservative"></option>
              <option value="parsimonious" data-i="optParsimonious"></option>

            </select>

        <p class="note-box" data-ih="noteDef"></p>

        <div id="dirExpSection">
          <p class="section-title"><span class="n">3</span><span data-i="sec3"></span><span class="hint" data-i="sec3h"></span></p>

          <p class="note-box" data-ih="noteDir"></p>

      </div>
    </div>

    <div class="right">
      <div class="panel" style="position:sticky; top:16px;">
        <div class="code-head">
          <h2 data-i="codeTitle"></h2>
          <button class="copy-btn" id="copyBtn" data-i="copy"></button>
        </div>
        <pre class="codebox"><code id="codeOut"></code></pre>
        <div class="readfirst" data-ih="readFirst"></div>
        <p class="trust" data-ih="trust"></p>
        <div class="upsell" data-ih="upsell"></div>
      </div>
    </div>
  </div>

  <footer>
    <span>install.packages("QCA")</span>
    <span class="dot">&middot;</span>
    <a href="sweep-builder.html" data-i="ftSweep"></a>
    <span class="dot">&middot;</span>
    <span data-i="ftAuthor"></span>
  </footer>
  <div class="foot" data-i="foot"></div>
</div>

<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}
// =================================================================

// ===================== i18n dictionary =====================
Object.assign(I18N.en,{
  barTitle:"QCA Quickstart", disc1:"Yuki Toyoda Laboratory, Graduate School of Innovation Management, Hosei University", disc2:"This is a learning tool. It may contain calculation errors, so please verify the results with other software before using them in research or business.",
  title:"QCA Quickstart",
  desc:"Generates a ready-to-run QCA script (truthTable / minimize) for data you've already calibrated to crisp 0/1 or fuzzy [0,1] membership scores.",
  eyebrow:"QCA · quickstart",
  h1:"Write a QCA script for R",
  lead:"Writing a <code class=\"mono\">QCA</code> script by hand is hard at first. Enter your data object, outcome and conditions, and this tool assembles a ready-to-run <code class=\"mono\">truthTable()</code> &rarr; <code class=\"mono\">minimize()</code> script to paste into R. It assumes your data is already calibrated: each outcome and condition column is either a crisp set (0 or 1) or a fuzzy set (a membership score from 0 to 1). If you are new to QCA, crisp-set QCA with 0/1 data is the easiest place to start. Crisp and fuzzy columns can be mixed, and you do not need to say which is which; <code class=\"mono\">truthTable()</code> tells them apart from the values themselves.",
  sec1:"Data, outcome & conditions",
  noteCal:"Before you start, load your data into R (for example <code class=\"mono\">dat &lt;- read.csv(\"data.csv\")</code>) and enter the name of that R object below, not the CSV file name. Every column used here, outcome and conditions alike, must already hold set-membership scores, crisp (0/1) or fuzzy ([0, 1]). If any column still holds raw values, convert it first with <code class=\"mono\">calibrate()</code>; this tool starts from <code class=\"mono\">truthTable()</code>.",
  lblDat:"Data object <span class=\"hint\">R object name, not the CSV file name</span>",
  lblOutcome:"Outcome <span class=\"hint\">column name</span>",
  lblConds:"Condition variables <span class=\"hint\">comma-separated column names</span>",
  noteDef:"The initial values (incl.cut = 0.8, n.cut = 1, intermediate solution) are for practice. Thresholds should be chosen for each study, so check the settings in an introductory QCA text before you report results.",
  sec2:"Analysis settings",
  lblIncl:"incl.cut <span class=\"hint\">consistency</span>",
  lblN:"n.cut <span class=\"hint\">frequency</span>",
  lblSol:"Solution type",
  optConservative:"Complex",
  optParsimonious:"Parsimonious",
  optIntermediate:"Intermediate",
  optLiberal:"Most liberal",
  solSep:"; ",
  solLabel_conservative:"Complex solution",
  solHint_conservative:"(= conservative in some texts)",
  solText_conservative:"Only observed configurations are used for minimization. Logical remainders (configurations with no or too few cases) are not used to simplify the solution further. This gives the least reduced, and typically the most complex, of the three solution types.",
  solLabel_parsimonious:"Parsimonious solution", solHint_parsimonious:"",
  solText_parsimonious:"Remainders are treated as “don't care” and freely used to simplify the solution, with no restriction on which simplifying assumptions are allowed.",
  solLabel_intermediate:"Intermediate solution", solHint_intermediate:"",
  solText_intermediate:"Remainders are treated as “don't care,” but only used when they match the directional expectations set below. This is the type most QCA guides (Ragin 2008; Schneider &amp; Wagemann 2012) recommend reporting.",
  solLabel_liberal:"Most liberal solution", solHint_liberal:"",
  solText_liberal:"All remainders are treated as if the outcome were present. The strongest, most permissive assumption: use only with a clear theoretical justification.",
  sec3:"Directional expectations",
  sec3h:"dir.exp, one per condition",
  dirNone:"No expectation",
  dirFavors:"Favors outcome (presence/high)",
  dirDisfavors:"Disfavors outcome (absence/low)",
  noteDir:"For each condition, choose whether its presence/high level (<b>Favors outcome</b>) or its absence/low level (<b>Disfavors outcome</b>) is expected to help produce the outcome, or choose <b>No expectation</b> if you cannot tell. Base the choice on the subject matter and the theory. This setting is used only for the intermediate solution; it is what turns the parsimonious solution into the intermediate solution, the type most QCA guides (Ragin 2008; Schneider &amp; Wagemann 2012) recommend reporting.",
  emptyConds:"Enter at least one condition variable above.",
  codeTitle:"Generated R code",
  copy:"Copy code",
  copied:"Copied",
  codeEmpty:"# add at least one condition variable to generate code",
  readFirst:"<b>Before you use it, and before you read the results</b><ul><li><b class=\"em\">Before using QCA, be sure to read an introductory text and understand the basics of the method.</b> This tool only assembles R code; it does not tell you what the results mean.</li><li>These settings are for practice. incl.cut = 0.8 and n.cut = 1 are starting values; thresholds should be chosen for each study.</li><li>A solution is not proof of causation. It shows that your data contain combinations of conditions linked to the outcome. Read it as a source of candidate actions and of hypotheses to test.</li><li>&ldquo;No solution&rdquo; does not mean that no pathway exists. It means that no minimal solution was produced under these conditions, measurements, number of cases, and settings.</li></ul><div class=\"rf-books\"><b>Standard introductions to QCA</b><ul><li>Oana, I.-E., Schneider, C. Q., &amp; Thomann, E. (2021). <i>Qualitative comparative analysis using R: A beginner's guide</i>. Cambridge University Press. <a href=\"https://doi.org/10.1017/9781009006781\" target=\"_blank\" rel=\"noopener\">DOI</a></li><li>Schneider, C. Q., &amp; Wagemann, C. (2012). <i>Set-theoretic methods for the social sciences: A guide to qualitative comparative analysis</i>. Cambridge University Press. <a href=\"https://doi.org/10.1017/CBO9781139004244\" target=\"_blank\" rel=\"noopener\">DOI</a></li><li>Ragin, C. C. (2008). <i>Redesigning social inquiry: Fuzzy sets and beyond</i>. University of Chicago Press.</li></ul><a href=\"https://im-research-yt.github.io/posts/reading-list-basics/\" target=\"_blank\" rel=\"noopener\">See the reading list (basics) on the blog &rarr;</a></div>",
  trust:"<b>Why this shape:</b> <code class=\"mono\">truthTable()</code> and <code class=\"mono\">minimize()</code> are QCA's own functions, used exactly as documented; this page only assembles the call for you, it does not compute anything itself.",
  upsell:"<b>Only checked one threshold?</b> Real thresholds are rarely obvious. See how the solution changes across a range of them with the companion tool; <a href=\"sweep-builder.html\">Sweep Builder (ThSQCA) &rarr;</a>",
  ftSweep:"Sweep Builder",
  ftAuthor:"Yuki Toyoda, Hosei University",
  foot:"This tool was developed with the assistance of Claude (Anthropic)."

(function(){
  "use strict";

  var state = { conds: [] };

  function $(id){ return document.getElementById(id); }

  function parseConditions(raw){
    return raw.split(",").map(function(s){return s.trim();}).filter(Boolean);
  }
  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function isNumericToken(s){
    return /^-?\d+(\.\d+)?$/.test((s||"").trim());
  }
  function rConditionsVec(names){
    return "c(" + names.map(function(n){ return '"' + n + '"'; }).join(", ") + ")";
  }

  // ---- condition list (names only; no calibration inputs needed) --------

  function rebuildCondTable(){
    var raw = $("conditions").value;
    var names = parseConditions(raw);

    var prev = {};
    state.conds.forEach(function(c){ prev[c.name] = c; });
    state.conds = names.map(function(name){
      return prev[name] || { name:name, dir:"-" };
    });

    rebuildDirTable();
    renderCode();
  }

  // ---- directional-expectation table ------------------------------------

  var DIR_OPTIONS = [
    { value:"-", key:"dirNone" },
    { value:"1", key:"dirFavors" },
    { value:"0", key:"dirDisfavors" }
  ];

  function rebuildDirTable(){
    var table = $("dirTable");
    if (!table) return;
    if (state.conds.length === 0){
      table.innerHTML = '<div class="empty-note">'+t('emptyConds')+'</div>';
      return;
    }
    table.innerHTML = state.conds.map(function(c, i){
      var opts = DIR_OPTIONS.map(function(o){
        return '<option value="'+o.value+'"'+(c.dir===o.value?" selected":"")+'>'+t(o.key)+'</option>';
      }).join("");
      return '<div class="dir-row">'+
               '<span class="cname">'+escapeHtml(c.name)+'</span>'+
               '<select data-ci="'+i+'">'+opts+'</select>'+
             '</div>';
    }).join("");
    table.querySelectorAll("select").forEach(function(sel){
      sel.addEventListener("change", function(){
        var i = +sel.getAttribute("data-ci");
        state.conds[i].dir = sel.value;
        renderCode();
      });
    });
  }

  function rDirExpVec(conds){
    var toks = conds.map(function(c){ return c.dir || "-"; });
    if (toks.every(function(t){ return t === "-"; })) return null;
    return "c(" + toks.map(function(t){
      return isNumericToken(t) ? t : '"' + t + '"';
    }).join(", ") + ")";
  }

  // ---- solution type -----------------------------------------------------

  var SOLUTION_META = {
    conservative: { include:"",  useDir:false },
    parsimonious: { include:"?", useDir:false },
    intermediate: { include:"?", useDir:true  },
    liberal:      { include:"1", useDir:false }
  };

  function updateSolutionHelp(){
    var v = $("solutionType").value;
    if (!SOLUTION_META[v]) v = "intermediate";
    var m = SOLUTION_META[v];
    var hint = t("solHint_"+v);
    $("solutionHelp").innerHTML = '<span class="soltype">'+t("solLabel_"+v)+'</span>' +
      (hint ? ' <span class="solhint">'+hint+'</span>' : '') + t("solSep") + t("solText_"+v);
    $("dirExpSection").style.display = m.useDir ? "" : "none";
  }

  // ---- code generation ----------------------------------------------------

  function highlight(code){
    var esc = escapeHtml(code);
    esc = esc.replace(/"([^"\\]|\\.)*"/g, function(m){ return '<span class="s">'+m+'</span>'; });
    esc = esc.replace(/\b(\d+(\.\d+)?)\b/g, function(m){ return '<span class="nnum">'+m+'</span>'; });
    esc = esc.replace(/\b(calibrate|truthTable|minimize|library)\b(?=\()/g, function(m){ return '<span class="k">'+m+'</span>'; });
    esc = esc.replace(/\b(TRUE|FALSE)\b/g, function(m){ return '<span class="k">'+m+'</span>'; });
    return esc;
  }

  function renderCode(){
    var dat = $("dat").value.trim() || "dat";
    var outcome = $("outcome").value.trim() || "Y";
    var inclCut = $("inclCut").value.trim() || "0.8";
    var nCut = $("nCut").value.trim() || "1";
    var solMeta = SOLUTION_META[$("solutionType").value] || SOLUTION_META.intermediate;
    var dirExp = solMeta.useDir ? rDirExpVec(state.conds) : null;
    var condNames = state.conds.map(function(c){ return c.name; });

    if (condNames.length === 0){
      $("codeOut").innerHTML = '<span style="color:var(--text-muted)">' +
        t("codeEmpty") + "</span>";
      return;
    }

    var lines = [];
    lines.push("library(QCA)");
    lines.push("");
    lines.push("tt <- truthTable(");
    lines.push("  " + dat + ",");
    lines.push('  outcome = "' + outcome + '",');
    lines.push("  conditions = " + rConditionsVec(condNames) + ",");
    lines.push("  incl.cut = " + inclCut + ",");
    lines.push("  n.cut = " + nCut + ",");
    lines.push("  show.cases = TRUE");
    lines.push(")");
    lines.push("tt");
    lines.push("");
    lines.push("sol <- minimize(");
    lines.push("  tt,");
    lines.push('  include = "' + solMeta.include + '"' + (dirExp ? "," : ""));
    if (dirExp) lines.push("  dir.exp = " + dirExp);
    lines.push(")");
    lines.push("sol");

    $("codeOut").innerHTML = highlight(lines.join("\n"));
  }

  // ---- copy ---------------------------------------------------------------

  $("copyBtn").addEventListener("click", function(){
    var text = $("codeOut").textContent;
    var btn = $("copyBtn");
    function done(){
      btn.textContent = t("copied");
      btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = t("copy"); btn.classList.remove("copied"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });
  function fallbackCopy(text, cb){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    cb();
  }

  // ---- wiring --------------------------------------------------------------

  ["dat","outcome","inclCut","nCut"].forEach(function(id){
    var el = $(id);
    el.addEventListener("input", renderCode);
    el.addEventListener("change", renderCode);
  });
  $("solutionType").addEventListener("change", function(){ updateSolutionHelp(); renderCode(); });
  $("conditions").addEventListener("input", rebuildCondTable);

  window.onLangChange = function(){
    $("metaDesc").setAttribute("content", t("desc"));
    updateSolutionHelp();
    rebuildCondTable();
  };
  LANG = detectLang();
  applyI18n();
})();
</script>
