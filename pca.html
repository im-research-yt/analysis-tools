<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f5;padding:0 0 16px}
h1{font-size:20px;font-weight:500;margin-bottom:1.2rem;color:#1a1a1a;display:flex;align-items:center;gap:8px}
h2{font-size:16px;font-weight:500;margin-bottom:.6rem;color:#333}
h3{font-size:14px;font-weight:500;margin-bottom:.4rem;color:#555}
header{background:#233A9A;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;font-weight:600;margin:0;color:#fff;display:block}
.badge{background:#F28018;color:#1a2332;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.container{max-width:960px;margin:0 auto;padding:0 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #ddd;margin-bottom:1rem}
.tab{padding:7px 16px;font-size:13px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;color:#666;background:none;font-family:inherit}
.tab.active{color:#1a1a1a;border-color:#ddd;background:#fff;font-weight:500}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
label{font-size:12px;color:#666;display:block;margin-bottom:4px}
textarea{width:100%;height:180px;font-family:monospace;font-size:12px;padding:8px;border:1px solid #ddd;border-radius:6px;background:#fafafa;color:#1a1a1a;resize:vertical;outline:none}
textarea:focus{border-color:#378add}
select,input[type=number]{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:#378add}
.btn-primary{background:#185FA5;color:#fff;border:none;padding:9px 20px;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;width:100%;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary:hover{background:#0c447c}
.btn-secondary{background:#fff;color:#333;border:1px solid #ddd;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-secondary:hover{background:#f5f5f5}
.btn-download{background:#0F6E56;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn-download:hover{background:#085041}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#f0f4fa;padding:5px 8px;text-align:right;font-weight:500;border:1px solid #ddd}
.tbl th:first-child{text-align:left}
.tbl td{padding:5px 8px;border:1px solid #e8e8e8;text-align:right}
.tbl td:first-child{text-align:left;font-weight:500;color:#555;background:#f9f9f9}
.tbl tr:hover td:not(:first-child){background:#f5f8ff}
.hi{background:#fff3cd!important;font-weight:600;color:#7d5a00}
.hi-rot{background:#d4edda!important;font-weight:600;color:#155724}
.hi-corr{background:#fde8e8!important;font-weight:600;color:#721c24}
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.metric{background:#f0f4fa;border-radius:8px;padding:10px 12px;border:1px solid #d0dcf0}
.metric-lbl{font-size:11px;color:#556;margin-bottom:4px}
.metric-val{font-size:22px;font-weight:500;color:#185FA5}
.err{color:#721c24;font-size:13px;padding:8px 12px;background:#f8d7da;border:1px solid #f5c6cb;border-radius:6px;margin-bottom:8px}
.info{color:#0c5460;font-size:12px;padding:6px 10px;background:#d1ecf1;border-radius:5px;margin-top:6px}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;max-height:160px;overflow-y:auto;padding:6px;border:1px solid #ddd;border-radius:6px;background:#fafafa}
.chk-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 6px;border-radius:4px;cursor:pointer;user-select:none}
.chk-item:hover{background:#e8f0fe}
.chk-item input{cursor:pointer}
.chart-wrap{position:relative;width:100%}
.section-title{font-size:15px;font-weight:500;color:#185FA5;margin:16px 0 8px;padding-bottom:5px;border-bottom:2px solid #d0dcf0}
.star-sig{font-size:11px;color:#888;margin-left:8px;font-weight:400}
.note{font-size:11px;color:#888;margin-top:4px}
.overflow-x{overflow-x:auto}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:8px;font-size:12px;color:#555}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:2px}

.langsw{margin-left:auto;display:flex;gap:4px}
.langsw button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.langsw button.on{background:#fff;color:#233A9A;font-weight:700}
.foot{max-width:960px;margin:0 auto;padding:8px 16px 28px;font-size:11px;color:#777}
/* back link to the blog's tools page */
.backlink{color:#fff;text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap;padding:3px 10px;border:1px solid rgba(255,255,255,.45);border-radius:6px;flex-shrink:0}
.backlink:hover{background:rgba(255,255,255,.15)}
.backlink.bl-en{display:none}
html[lang="en"] .backlink.bl-ja{display:none}

html[lang="en"] .backlink-home.bl-en{display:inline}
@media (max-width:600px){header,.hbar{flex-wrap:wrap}}

    </div>

<script>
// ===================== i18n core (JA / EN) =====================
// 使い方: 各要素に data-i="キー"(textContent) / data-ih="キー"(innerHTML) / data-ip="キー"(placeholder) を付ける。
// 動的な文字列は t('キー', 引数...) を使う。辞書の値は文字列、または関数。
const I18N={ja:{},en:{}};
let LANG='ja';
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang'); if(q==='ja'||q==='en') return q;}catch(e){}
  try{const s=localStorage.getItem('tool_lang'); if(s==='ja'||s==='en') return s;}catch(e){}
  return ((navigator.language||'en')+'').toLowerCase().indexOf('ja')===0?'ja':'en';
}
function t(key){
  const a=Array.prototype.slice.call(arguments,1);
  let s=I18N[LANG]&&I18N[LANG][key];
  if(s===undefined) s=I18N.en[key];
  if(s===undefined) return key;
  return typeof s==='function'?s.apply(null,a):s;
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.getAttribute('data-ih'));});
  document.querySelectorAll('[data-ip]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-ip')));});
  document.querySelectorAll('.langsw button').forEach(b=>{b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  if(typeof onLangChange==='function') onLangChange();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('tool_lang',l);}catch(e){}
  applyI18n();
}
// =================================================================

// ───────── dictionary ─────────
Object.assign(I18N.ja,{

 disc1:'法政大学経営大学院イノベーション･マネジメント研究科 豊田裕貴研究室',
 disc2:'学習用のツールです。計算に誤りが含まれる可能性があるため、研究やビジネスでの利用は、結果を別の方法で確認したうえで、慎重にお願いします。',
 tabInput:'① データ入力', tabResult:'② 結果',
 cardLoad:'データの読み込み', exBtn:'📱 例題：ブランド評価（n=25, 9変数）', openCsv:'📂 CSVファイルを開く',
 csvLabel:'CSV形式で貼り付け（1行目=変数名、1列目=ケース名）またはファイルを選択',
 csvPh:'ID,変数1,変数2,変数3,...\nCase1,4,5,3,...\nCase2,3,4,4,...',
 parsed:(n,m)=>`読み込み完了：${n} ケース × ${m} 変数`,
 cardVars:'変数選択', selAll:'全選択', selNone:'全解除',
 cardSet:'分析設定', lblType:'分析タイプ', optPca:'主成分分析 (PCA)',
 optFa:'因子分析・主成分法ベース（バリマックス回転・直交）', optPm:'因子分析・主成分法ベース（プロマックス回転・斜交）',
 lblMat:'行列タイプ', optCorr:'相関係数行列（推奨）', optCov:'分散共分散行列',
 lblEg:'バイプロット・スクリー表示成分数', lblThr:'高負荷量の閾値（色付け）', showScree:'スクリープロット表示',
 lblFaMethod:'因子数の決定方法', optAutoNf:'自動（Kaiser基準：固有値≥1）', optManualNf:'手動で指定', lblNf:'因子数を指定',
 faNote:'※ 現在の実装は<b>主成分法ベースの因子分析</b>です（共通性の反復推定なし）。<br>　 最尤法が必要な場合はRの <code>factanal()</code> または <code>psych::fa(fm="ml")</code> を推奨します。',
 run:'分析を実行',
 guideTitle:'分析タイプの選び方', gType:'タイプ', gPurpose:'目的', gFeat:'特徴', gUse:'用途',
 g1a:'<b>主成分分析（PCA）★推奨</b>', g1b:'データの次元圧縮・可視化', g1c:'回転なし。分散を最大化する成分を順に抽出。成分は直交。', g1d:'探索的分析・バイプロット・スコア取得',
 g2a:'<b>バリマックス回転</b>', g2b:'因子の解釈を容易にする', g2c:'直交回転。各因子に高負荷の変数を絞り込む。因子間相関はゼロ。初期解は主成分法ベース。', g2d:'因子が理論的に独立と仮定できる場合',

 guideNote:'★ ポジショニングマップや得点取得が目的であればPCAを推奨。潜在因子の解釈が目的であれば回転あり因子分析を使用。<br>※ 本アプリの因子分析は<b>主成分法ベース</b>（共通性の反復推定なし）です。最尤法が必要な場合はRの <code>factanal()</code> を推奨します。',
 mType:'行列タイプ', mWhen:'使う場面',
 m1a:'<b>相関係数行列 ★推奨</b>', m1b:'変数の単位・スケールが異なる場合。ほとんどの場合こちらを使用。',

let parsedData=null, varNames=[], caseNames=[], rawMatrix=[];

// ─── CSV解析 ──────────────────────────────────────────────
function loadCSVFile(event, targetId){
  const file = event.target.files[0];
  if(!file) return;
  // UTF-8で読み込み、文字化けならShift-JISで再試行
  const tryRead = (encoding) => {
    const reader = new FileReader();
    reader.onload = function(e){
      let text = e.target.result.replace(/^\uFEFF/, '');
      // 文字化け簡易チェック（置換文字が多い場合はShift-JISで再試行）
      if(encoding === 'UTF-8' && (text.match(/\uFFFD/g)||[]).length > 5){
        tryRead('Shift-JIS'); return;
      }
      document.getElementById(targetId).value = text;
      if(targetId === 'csv-input') parseCSV();
    };
    reader.readAsText(file, encoding);
  };
  tryRead('UTF-8');
  event.target.value = '';
}

function loadExample(){ document.getElementById('csv-input').value=EX[LANG]; parseCSV(); }

function loadCSVFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    // BOM除去
    let text = e.target.result.replace(/^﻿/, '');
    document.getElementById('csv-input').value = text;
    parseCSV();
  };
  reader.readAsText(file, 'UTF-8');
  // 同じファイルを再選択できるようリセット
  event.target.value = '';
}

function parseCSV(){
  const txt=document.getElementById('csv-input').value.trim();
  if(!txt) return;
  const lines=txt.split('\n').map(l=>l.trim()).filter(l=>l);
  if(lines.length<3){ return; }
  const headers=lines[0].split(',');
  varNames=headers.slice(1);
  caseNames=[]; rawMatrix=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(',');
    const row=cols.slice(1).map(v=>parseFloat(v.trim()));
    if(row.some(isNaN)||row.length<varNames.length) continue;
    caseNames.push(cols[0].trim());
    rawMatrix.push(row);
  }
  parsedData={n:rawMatrix.length,m:varNames.length};
  document.getElementById('parse-info').style.display='block';
  renderParseInfo();
  buildVarChecks();
  document.getElementById('var-select-card').style.display='block';
}
document.getElementById('csv-input').addEventListener('input', parseCSV);

// ─── 統計計算 ─────────────────────────────────────────────
function computeStats(data, selIdx, useCorr){
  const n=data.length, m=selIdx.length;
  const X=data.map(r=>selIdx.map(j=>r[j]));
  const mu=Array.from({length:m},(_,i)=>X.reduce((s,r)=>s+r[i],0)/n);
  const sg=Array.from({length:m},(_,i)=>{
    const v=X.reduce((s,r)=>s+(r[i]-mu[i])**2,0)/(n-1);
    return Math.sqrt(v);
  });
  const S=Array.from({length:m},()=>Array(m).fill(0));
  for(let k=0;k<n;k++)
    for(let i=0;i<m;i++)
      for(let j=i;j<m;j++){
        S[i][j]+=(X[k][i]-mu[i])*(X[k][j]-mu[j]);
        S[j][i]=S[i][j];
      }
  for(let i=0;i<m;i++) for(let j=0;j<m;j++) S[i][j]/=(n-1);
  if(useCorr){
    for(let i=0;i<m;i++) for(let j=0;j<m;j++)
      S[i][j]=(i===j)?1:S[i][j]/(sg[i]*sg[j]);
  }
  return{X,mu,sg,S,n,m};
}

// ─── Jacobi固有値分解 ─────────────────────────────────────
function eigen(A){
  const n=A.length;
  let a=A.map(r=>[...r]);
  let V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let iter=0;iter<2000;iter++){
    let p=0,q=1,mx=0;
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++)
      if(Math.abs(a[i][j])>mx){mx=Math.abs(a[i][j]);p=i;q=j;}
    if(mx<1e-12) break;
    const th=0.5*Math.atan2(2*a[p][q],a[p][p]-a[q][q]);
    const c=Math.cos(th),s=Math.sin(th);
    const na=a.map(r=>[...r]);
    for(let i=0;i<n;i++){
      na[p][i]=c*a[p][i]+s*a[q][i]; na[q][i]=-s*a[p][i]+c*a[q][i];
    }
    for(let i=0;i<n;i++){
      na[i][p]=c*a[i][p]+s*a[i][q]; na[i][q]=-s*a[i][p]+c*a[i][q];
    }
    na[p][p]=c*c*a[p][p]+2*s*c*a[p][q]+s*s*a[q][q];
    na[q][q]=s*s*a[p][p]-2*s*c*a[p][q]+c*c*a[q][q];
    na[p][q]=0; na[q][p]=0; a=na;
    const nV=V.map(r=>[...r]);
    for(let i=0;i<n;i++){
      nV[i][p]=c*V[i][p]+s*V[i][q]; nV[i][q]=-s*V[i][p]+c*V[i][q];
    }
    V=nV;
  }
  let eigs=Array.from({length:n},(_,i)=>({val:a[i][i],vec:V.map(r=>r[i])}));
  eigs.sort((x,y)=>y.val-x.val);
  // 符号補正：各固有ベクトルの正成分の和が負なら符号を反転（負荷量が正方向に集まるよう）
  eigs.forEach(e=>{
    const sumPos=e.vec.reduce((s,v)=>s+v,0);
    if(sumPos<0) e.vec=e.vec.map(v=>-v);
  });
  return{values:eigs.map(e=>Math.max(0,e.val)),vectors:eigs.map(e=>e.vec)};
}

// ─── バリマックス回転 ──────────────────────────────────────
// Rの stats::varimax(normalize=TRUE, eps=1e-5) と同じ手順（Kaiser正規化あり、反復は特異値分解の極分解で更新）
function varimax(L,m,nf){
  if(nf<2) return L.map(r=>r.slice(0,nf));
  const eps=1e-5;
  let x=Array.from({length:m},(_,i)=>Array.from({length:nf},(_,j)=>L[i][j]));
  const sc=x.map(r=>Math.sqrt(r.reduce((s,v)=>s+v*v,0)));
  x=x.map((r,i)=>r.map(v=>sc[i]>0?v/sc[i]:v));          // Kaiser正規化
  let T=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>i===j?1:0));
  let d=0;
  for(let it=0;it<1000;it++){
    const z=matMul(x,T,m,nf,nf);
    const colSS=Array.from({length:nf},(_,j)=>z.reduce((s,r)=>s+r[j]*r[j],0));
    // B = x' (z^3 - z diag(colSS)/m)
    const Zm=z.map(r=>r.map((v,j)=>v*v*v-v*colSS[j]/m));
    const B=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>x.reduce((s,r,k)=>s+r[i]*Zm[k][j],0)));
    // 極分解 T = B (B'B)^(-1/2)、特異値の和 = Σ sqrt(固有値(B'B))
    const BtB=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>B.reduce((s,r)=>s+r[i]*r[j],0)));
    const e=eigen(BtB);                                    // e.vectors[k] = k番目の固有ベクトル
    const lam=e.values.map(v=>Math.max(v,1e-300));
    const W=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>
      e.vectors.reduce((s,vec,k)=>s+vec[i]*vec[j]/Math.sqrt(lam[k]),0)));
    T=matMul(B,W,nf,nf,nf);
    const dpast=d; d=lam.reduce((s,v)=>s+Math.sqrt(v),0);
    if(d<dpast*(1+eps)) break;
  }
  let z=matMul(x,T,m,nf,nf);
  z=z.map((r,i)=>r.map(v=>v*sc[i]));                      // 正規化を戻す
  return z;
}

// ─── プロマックス回転 ────────────────────────────────────
// バリマックス後の負荷量をべき乗してパターン行列・構造行列・因子間相関を求める
function promax(varimaxLoad, m, nf, power=4){
  // Rのstats::promax / SPSSと同じ手順（べき乗 kappa=4）
  // Step1: ターゲット行列 T = sign(v)*|v|^power
  const T=Array.from({length:m},(_,i)=>Array.from({length:nf},(_,j)=>{
    const v=varimaxLoad[i][j];
    return Math.sign(v)*Math.pow(Math.abs(v),power);
  }));
  // Step2: 最小二乗の回転行列 U = (V'V)^-1 V'T
  const VtV=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>
    Array.from({length:m},(_,k)=>varimaxLoad[k][i]*varimaxLoad[k][j]).reduce((a,b)=>a+b,0)));
  const VtT=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>
    Array.from({length:m},(_,k)=>varimaxLoad[k][i]*T[k][j]).reduce((a,b)=>a+b,0)));
  let U=matMul(matInv(VtV,nf),VtT,nf,nf,nf);
  // Step3: 因子間相関 Phi=(U'U)^-1 の対角が1になるよう、Uの各列をスケーリング
  const UtU0=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>
    Array.from({length:nf},(_,k)=>U[k][i]*U[k][j]).reduce((a,b)=>a+b,0)));
  const inv0=matInv(UtU0,nf);
  U=U.map(row=>row.map((v,j)=>v*Math.sqrt(inv0[j][j])));
  const UtU=Array.from({length:nf},(_,i)=>Array.from({length:nf},(_,j)=>
    Array.from({length:nf},(_,k)=>U[k][i]*U[k][j]).reduce((a,b)=>a+b,0)));
  const phi=matInv(UtU,nf);
  // Step4: パターン行列 P = V U、構造行列 S = P Phi
  const P=Array.from({length:m},(_,i)=>Array.from({length:nf},(_,j)=>
    Array.from({length:nf},(_,k)=>varimaxLoad[i][k]*U[k][j]).reduce((a,b)=>a+b,0)));
  const structure=Array.from({length:m},(_,i)=>Array.from({length:nf},(_,j)=>
    Array.from({length:nf},(_,k)=>P[i][k]*phi[k][j]).reduce((a,b)=>a+b,0)));
  return{pattern:P, structure, phi};
}

// 行列演算ユーティリティ
function matMul(A,B,r,mid,c){
  return Array.from({length:r},(_,i)=>Array.from({length:c},(_,j)=>
    Array.from({length:mid},(_,k)=>A[i][k]*B[k][j]).reduce((a,b)=>a+b,0)
  ));
}
function matInv(A,n){
  // ガウス・ジョルダン法
  const M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>i===j?1:0)]);
  for(let col=0;col<n;col++){
    let pivRow=col;
    for(let row=col+1;row<n;row++) if(Math.abs(M[row][col])>Math.abs(M[pivRow][col])) pivRow=row;
    [M[col],M[pivRow]]=[M[pivRow],M[col]];
    const piv=M[col][col];
    if(Math.abs(piv)<1e-12) continue;
    for(let j=0;j<2*n;j++) M[col][j]/=piv;
    for(let row=0;row<n;row++){
      if(row===col) continue;
      const f=M[row][col];
      for(let j=0;j<2*n;j++) M[row][j]-=f*M[col][j];
    }
  }
  return M.map(r=>r.slice(n));
}

// ─── 数値フォーマット ─────────────────────────────────────
const f4=v=>v.toFixed(4), f2=v=>v.toFixed(2), pct=v=>(v*100).toFixed(2)+'%';

function toggleFactorNumUI(){

function runAnalysis(){
  hideErr();
  if(!parsedData){showErr(t('errLoad'),['errLoad']); return;}
  const selIdx=getSelIdx();
  if(selIdx.length<3){showErr(t('errVar3'),['errVar3']); return;}

  const useCorr=document.getElementById('mat-type').value==='corr';
  const analType=document.getElementById('anal-type').value;
  const isFA=(analType==='fa'||analType==='pm');
  const isPM=analType==='pm';
  const compPfx=isFA?'F':'PC';
  const egNum=+document.getElementById('eg-num').value;
  const thresh=+document.getElementById('thresh').value;
  const showScree=document.getElementById('show-scree').checked;
  const selVarNames=selIdx.map(i=>varNames[i]);

  const{X,mu,sg,S,n,m}=computeStats(rawMatrix,selIdx,useCorr);

  // ── データ妥当性チェック ──────────────────────────────
  // 1. 標準偏差ゼロ（定数列）
  const zeroSdVars = selVarNames.filter((_,i) => sg[i] < 1e-10);
  if(zeroSdVars.length > 0){
    const l=zeroSdVars.join(', ');
    showErr(t('errZeroSd',l),['errZeroSd',l]);
    return;
  }
  // 2. 完全相関（r=±1.0）の変数ペアを検出
  const perfectPairs = [];
  for(let i=0;i<m;i++) for(let j=i+1;j<m;j++){
    const rij=S[i][j]/Math.sqrt(S[i][i]*S[j][j]);  // 共分散行列のときも相関係数で判定
    if(Math.abs(rij) > 0.9999){
      perfectPairs.push([selVarNames[i],selVarNames[j],rij.toFixed(4)]);
    }
  }
  if(perfectPairs.length > 0){
    showErr(t('errPerfect',perfectPairs),['errPerfect',perfectPairs]);
    return;
  }
  // 3. ケース数が変数数以下
  if(n <= m){
    showErr(t('errN',n,m),['errN',n,m]);
    return;
  }

  const{values:eigVals,vectors:eigVecs}=eigen(S);

  // 5. 最小固有値が極端に小さい（事実上の特異行列）
  const minEig = Math.min(...eigVals);
  if(minEig < 1e-6){
    const e=minEig.toExponential(2);
    showErr(t('errSing',e),['errSing',e]);
    return;
  }
  const totalVar=eigVals.reduce((a,b)=>a+b,0);
  const contrib=eigVals.map(v=>v/totalVar);

  // 主成分負荷量 PCLoad[変数i][成分j]
  const eigVecsT = eigVecs.map(vec => [...vec]); // eigVecsT[j][i]
  const PCLoad = Array.from({length:m}, (_,i) =>
    Array.from({length:eigVals.length}, (_,j) =>
      Math.sqrt(Math.max(0, eigVals[j])) * eigVecsT[j][i]
    )
  );

  // 因子数の決定
  let tblClm=1;
  const faMethod=document.getElementById('factor-num-method')?.value||'auto';
  const faManual=+(document.getElementById('factor-num-manual')?.value||3);
  if(isFA && faMethod==='manual'){
    tblClm=Math.min(Math.max(1,faManual),m-1);
  } else {
    // Kaiser基準（固有値≥1）
    for(let i=m-1;i>=0;i--) if(eigVals[i]>=1){tblClm=i+1;break;}
    // 累積寄与率90%の補完（PCAのみ）
    if(!isFA){
      let cum=0;
      for(let i=0;i<m;i++){cum+=contrib[i];if(cum>=0.9){tblClm=Math.max(tblClm,i+1);break;}}
    }
  }
  tblClm=Math.max(tblClm,egNum);

  // バリマックス回転
  const rotLoad=isFA?varimax(PCLoad,m,tblClm):null;
  // プロマックス
  const pmResult=isPM&&rotLoad?promax(rotLoad,m,tblClm):null;

  // 主成分得点
  const scores=X.map(row=>{
    const zs=useCorr?row.map((v,i)=>(v-mu[i])/sg[i]):row.map((v,i)=>v-mu[i]);
    return eigVecs.map(vec=>vec.reduce((s,c,i)=>s+c*zs[i],0));
  });

  const pcLbls=Array.from({length:tblClm},(_,i)=>analType==='fa'?`F${i+1}`:`PC${i+1}`);
  const fLbls=Array.from({length:tblClm},(_,i)=>`F${i+1}`);

  // state kept so that the results can be re-rendered when the language changes (nothing is re-computed)
  ST={selIdx,useCorr,analType,isFA,isPM,compPfx,thresh,showScree,selVarNames,S,n,m,eigVals,contrib,PCLoad,
      tblClm,faMethod,rotLoad,pmResult,scores,pcLbls,fLbls};
  HAS_RESULT=true;
  renderResult(true);
}

  html+=`</tbody></table></div></div>`;

  const labelOpts=`
    <div style="display:flex;gap:12px;margin-bottom:8px;font-size:13px;flex-wrap:wrap;align-items:center">

// ─── 得点散布図（Score Plot）────────────────────────────
function drawScorePlot(scores, caseNames, contrib, compPfx, isFA, xDim, yDim){
  if(xDim===undefined||xDim===null) xDim=0;
  if(yDim===undefined||yDim===null) yDim=1;
  if(scoreChart){scoreChart.destroy();scoreChart=null;}
  const ctx=document.getElementById('score-canvas');
  if(!ctx) return;

  const lblPlugin={
    id:'scoreLabels',
    afterDraw(chart){
      if(!(document.getElementById('show-score-lbl')?.checked)) return;
      const ctx2=chart.ctx;
      const xs=chart.scales.x, ys=chart.scales.y;
      ctx2.save();
      const _scFs=+(document.getElementById('score-font-size')?.value||11);
      ctx2.font=`${_scFs}px Helvetica Neue,Arial,sans-serif`;
      ctx2.fillStyle='rgba(24,95,165,0.9)';
      ctx2.textBaseline='middle';
      const sxd=+(document.getElementById('score-xaxis')?.value??0);
      const syd=+(document.getElementById('score-yaxis')?.value??1);
      scores.forEach((s,k)=>{
        ctx2.fillText(caseNames[k], xs.getPixelForValue(s[sxd])+7, ys.getPixelForValue(s[syd])-6);
      });
      ctx2.restore();
    }
  };

  scoreChart=new Chart(ctx,{
    type:'scatter',
    data:{datasets:[{
      label:t('dsScore'),
      data:scores.map((s,k)=>({x:s[xDim]??s[0],y:s[yDim]??s[1],nm:caseNames[k]})),
      backgroundColor:'rgba(24,95,165,0.65)',
      pointRadius:6,pointHoverRadius:8,
      borderColor:'rgba(24,95,165,0.9)',borderWidth:1.2
    }]},
    plugins:[lblPlugin],
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>`${c.raw.nm} (${f2(c.raw.x)}, ${f2(c.raw.y)})`}}},
      scales:{
        x:{title:{display:true,text:`${compPfx}${xDim+1} (${pct(contrib[xDim])})`,font:{size:12}},
           grid:{color:'rgba(0,0,0,0.06)'},ticks:{callback:v=>f2(v)}},
        y:{title:{display:true,text:`${compPfx}${yDim+1} (${pct(contrib[yDim])})`,font:{size:12}},
           grid:{color:'rgba(0,0,0,0.06)'},ticks:{callback:v=>f2(v)}}
      }
    }
  });
}

// ─── 負荷量プロット（Loading Plot）──────────────────────
function drawLoadingPlot(loadingData, contrib, compPfx, xDim, yDim){
  if(loadingChart){loadingChart.destroy();loadingChart=null;}
  const ctx=document.getElementById('loading-canvas');
  if(!ctx) return;

  if(xDim===undefined||xDim===null) xDim=0;
  if(yDim===undefined||yDim===null) yDim=1;

  // 軸範囲：選択した2次元の最大絶対値で±対称
  const allX=loadingData.map(d=>d.vals[xDim]);
  const allY=loadingData.map(d=>d.vals[yDim]);
  const absMax=Math.max(Math.max(...allX.map(Math.abs)),Math.max(...allY.map(Math.abs)),0.1)*1.3;

  // 先端点のみ scatter で描画（矢印・ラベルは afterDraw で Canvas2D）
  const arrowPlugin={
    id:'loadingArrows',
    afterDraw(chart){
      const xd=+(document.getElementById('load-xaxis')?.value??0);
      const yd=+(document.getElementById('load-yaxis')?.value??1);
      const c2=chart.ctx;
      const xs=chart.scales.x, ys=chart.scales.y;
      const ox=xs.getPixelForValue(0), oy=ys.getPixelForValue(0);

      // 単位円
      c2.save();
      const rx=Math.abs(xs.getPixelForValue(1)-ox);
      const ry=Math.abs(ys.getPixelForValue(1)-oy);
      c2.beginPath();
      c2.ellipse(ox,oy,rx,ry,0,0,2*Math.PI);
      c2.strokeStyle='rgba(150,150,150,0.5)';
      c2.lineWidth=1; c2.setLineDash([4,4]);
      c2.stroke(); c2.setLineDash([]);

      // 矢印（原点 → 先端）
      loadingData.forEach(d=>{
        const ex=xs.getPixelForValue(d.vals[xd]);
        const ey=ys.getPixelForValue(d.vals[yd]);
        const dx=ex-ox, dy=ey-oy;
        const len=Math.sqrt(dx*dx+dy*dy)||1;
        c2.beginPath();
        c2.moveTo(ox,oy);
        c2.lineTo(ex,ey);
        c2.strokeStyle='rgba(210,50,30,0.85)';
        c2.lineWidth=2;
        c2.stroke();
        const ah=10, aw=5;
        const ux=dx/len, uy=dy/len;
        c2.beginPath();
        c2.moveTo(ex,ey);
        c2.lineTo(ex-ah*ux+aw*uy, ey-ah*uy-aw*ux);
        c2.lineTo(ex-ah*ux-aw*uy, ey-ah*uy+aw*ux);
        c2.closePath();
        c2.fillStyle='rgba(210,50,30,0.85)';
        c2.fill();
      });

      // ラベル
      if(document.getElementById('show-load-lbl')?.checked){
        const _ldFs=+(document.getElementById('load-font-size')?.value||11);
        c2.font=`bold ${_ldFs}px Helvetica Neue,Arial,sans-serif`;
        c2.textBaseline='middle';
        loadingData.forEach(d=>{
          const ex=xs.getPixelForValue(d.vals[xd]);
          const ey=ys.getPixelForValue(d.vals[yd]);
          const dx=ex-ox, dy=ey-oy;
          const len=Math.sqrt(dx*dx+dy*dy)||1;
          const lx=ex+(dx/len)*14, ly=ey+(dy/len)*14;
          const tw=c2.measureText(d.name).width;
          c2.fillStyle='rgba(255,255,255,0.88)';
          c2.fillRect(lx-3,ly-9,tw+6,18);
          c2.fillStyle='rgba(180,30,20,0.95)';
          c2.fillText(d.name,lx,ly);
        });
      }
      c2.restore();
    }
  };

  // 先端点だけ scatter で渡す（座標確認用・tooltip用）
  loadingChart=new Chart(ctx,{
    type:'scatter',
    data:{datasets:[{
      label:t('dsLoad'),
      data:loadingData.map(d=>({x:d.vals[xDim], y:d.vals[yDim], nm:d.name})),
      pointRadius:0,  // 点は矢頭で描くので非表示
      pointHoverRadius:6,
      backgroundColor:'rgba(210,50,30,0.8)'
    }]},
    plugins:[arrowPlugin],
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:c=>`${c.raw.nm} (${f4(c.raw.x)}, ${f4(c.raw.y)})`}}
      },
      scales:{
        x:{min:-absMax, max:absMax,
           title:{display:true,text:`${compPfx}${xDim+1} (${pct(contrib[xDim])})`,font:{size:12}},
           grid:{color:'rgba(0,0,0,0.06)'}, ticks:{callback:v=>f2(v)}},
        y:{min:-absMax, max:absMax,
           title:{display:true,text:`${compPfx}${yDim+1} (${pct(contrib[yDim])})`,font:{size:12}},
           grid:{color:'rgba(0,0,0,0.06)'}, ticks:{callback:v=>f2(v)}}
      }
    }
  });
}

function setBiplotHeight(){

  if(wrap) wrap.style.height = h + 'px';

function setSubChartHeight(type){
  const h = +(document.getElementById(type+'-height')?.value || 300);
  const wrap = document.querySelector('#'+type+(type==='score'?'-canvas':'ing-canvas'))?.parentElement;
  if(wrap) wrap.style.height = h + 'px';
  redrawSubCharts();
}

function drawBiplot(){
  if(!window._scores || !window._loadingData) return;
  const scores=window._scores;
  const caseNames=window._caseNames;
  const contrib=window._contrib;
  const isFA=window._isFA;
  const compPfx=window._compPfx;
  const loadingData=window._loadingData;
  const selVarNames=loadingData.map(d=>d.name);
  const PCLoad=loadingData.map(d=>d.vals);
  if(biplotChart){biplotChart.destroy();biplotChart=null;}
  const bcanvas=document.getElementById('biplot-canvas');
  const bctx=bcanvas.getContext('2d');

  const {x:bpXi,y:bpYi}=getPcaAxes();
  const maxScr=Math.max(...scores.flatMap(s=>[Math.abs(s[bpXi]||0),Math.abs(s[bpYi]||0)]));
  const scaleF=maxScr*0.82;

  let xMin=0,xMax=0,yMin=0,yMax=0;
  scores.forEach(s=>{
    xMin=Math.min(xMin,s[bpXi]||0);xMax=Math.max(xMax,s[bpXi]||0);
    yMin=Math.min(yMin,s[bpYi]||0);yMax=Math.max(yMax,s[bpYi]||0);
  });
  selVarNames.forEach((_,i)=>{
    xMin=Math.min(xMin,(PCLoad[i][bpXi]||0)*scaleF);xMax=Math.max(xMax,(PCLoad[i][bpXi]||0)*scaleF);
    yMin=Math.min(yMin,(PCLoad[i][bpYi]||0)*scaleF);yMax=Math.max(yMax,(PCLoad[i][bpYi]||0)*scaleF);
  });
  const pad=0.22;
  const xR=xMax-xMin,yR=yMax-yMin;
  const xlo=xMin-xR*pad, xhi=xMax+xR*pad;
  const ylo=yMin-yR*pad, yhi=yMax+yR*pad;

  // Chart.jsでプロット（データポイント＋ベクトル線）
  const datasets=[
    {label:t('dsPcScore'),type:'scatter',
     data:scores.map((s,k)=>({x:s[bpXi]||0,y:s[bpYi]||0,nm:caseNames[k]})),
     backgroundColor:'rgba(24,95,165,0.70)',
     pointRadius:5,pointHoverRadius:7,
     borderColor:'rgba(24,95,165,0.95)',borderWidth:1.2}
  ];
  selVarNames.forEach((nm,i)=>{
    datasets.push({
      label:nm,type:'line',
      data:[{x:0,y:0},{x:(PCLoad[i][bpXi]||0)*scaleF,y:(PCLoad[i][bpYi]||0)*scaleF}],
      borderColor:'rgba(210,50,30,0.80)',backgroundColor:'rgba(210,50,30,0.80)',
      pointRadius:[0,5],pointStyle:['circle','triangle'],
      showLine:true,borderWidth:2,fill:false
    });
  });

  // カスタムプラグイン：afterDrawのたびにDOMを直接読んでON/OFFを反映
  const labelPlugin={
    id:'biplotLabels',
    afterDraw(chart){
      // チェックボックスを毎回DOMから読む（チェック変更を即反映するため）
      const showCase=document.getElementById('show-case-lbl')?.checked||false;
      const showVar=document.getElementById('show-var-lbl')?.checked||false;
      if(!showCase && !showVar) return;

      const ctx2=chart.ctx;
      const xScale=chart.scales.x, yScale=chart.scales.y;
      const toX=v=>xScale.getPixelForValue(v);
      const toY=v=>yScale.getPixelForValue(v);

      ctx2.save();
      ctx2.textBaseline='middle';

      // ケースラベル
      if(showCase){
        const _bpFs1=+(document.getElementById('biplot-font-size')?.value||11);
        ctx2.font=`${_bpFs1}px Helvetica Neue,Arial,sans-serif`;
        ctx2.fillStyle='rgba(24,95,165,0.9)';
        scores.forEach((s,k)=>{
          const px=toX(s[bpXi]||0), py=toY(s[bpYi]||0);
          ctx2.fillText(caseNames[k], px+7, py-6);
        });
      }

      // 変数ラベル（ベクトル先端）
      if(showVar){
        const _bpFs2=+(document.getElementById('biplot-font-size')?.value||11);
        ctx2.font=`bold ${_bpFs2}px Helvetica Neue,Arial,sans-serif`;
        selVarNames.forEach((nm,i)=>{
          const ex=(PCLoad[i][bpXi]||0)*scaleF, ey=(PCLoad[i][bpYi]||0)*scaleF;
          const px=toX(ex), py=toY(ey);
          const len=Math.sqrt(ex*ex+ey*ey)||1;
          const ox=(ex/len)*16, oy=-(ey/len)*16;
          const metrics=ctx2.measureText(nm);
          const tw=metrics.width, th2=14;
          ctx2.fillStyle='rgba(255,255,255,0.85)';
          ctx2.fillRect(px+ox-3, py+oy-th2/2-2, tw+6, th2+4);
          ctx2.fillStyle='rgba(180,30,20,0.95)';
          ctx2.fillText(nm, px+ox, py+oy);
        });
      }
      ctx2.restore();
    }
  };

  biplotChart=new Chart(bctx,{
    data:{datasets},
    plugins:[labelPlugin],
    options:{responsive:true,maintainAspectRatio:false,
      animation:{duration:300},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          label:ctx=>{
            const d=ctx.raw;
            return d.nm?`${d.nm} (${f2(d.x)}, ${f2(d.y)})`:
                   `${ctx.dataset.label} → (${f2(d.x)}, ${f2(d.y)})`;
          }
        }}
      },
      scales:{
        x:{min:xlo,max:xhi,
           title:{display:true,text:`${isFA?'F':'PC'}${bpXi+1} (${pct(contrib[bpXi]||0)})`,font:{size:12}},
           grid:{color:'rgba(0,0,0,0.06)'},
           ticks:{callback:v=>f2(v)}},
        y:{min:ylo,max:yhi,
           title:{display:true,text:`${isFA?'F':'PC'}${bpYi+1} (${pct(contrib[bpYi]||0)})`,font:{size:12}},
           grid:{color:'rgba(0,0,0,0.06)'},
           ticks:{callback:v=>f2(v)}}
      }
    }
  });
}

// ─── 軸選択変更時の再描画 ──────────────────────────────
function getPcaAxes(){
  const x=+(document.getElementById('biplot-xaxis')?.value??0);
  const y=+(document.getElementById('biplot-yaxis')?.value??1);
  return {x, y};
}

function onPcaAxisChange(){
  const {x,y}=getPcaAxes();
  // バイプロットタイトル更新
  setBiplotTitle();
  redrawCharts();
  redrawSubCharts();
}

function redrawSubCharts(){
  if(!window._scores || !window._loadingData) return;
  const gv=(id,d)=>{const e=document.getElementById(id);return (e&&e.value!=='')?+e.value:d;};
  drawScorePlot(window._scores, window._caseNames, window._contrib,
                window._compPfx, window._isFA, gv('score-xaxis',0), gv('score-yaxis',1));
  drawLoadingPlot(window._loadingData, window._contrib,
                  window._compPfx, gv('load-xaxis',0), gv('load-yaxis',1));
}

function downloadScores(selIdx, tblClm, isFA){
  const useCorr=document.getElementById('mat-type').value==='corr';
  const{X,mu,sg,S}=computeStats(rawMatrix,selIdx,useCorr);
  const{vectors:eigVecs}=eigen(S);
  const scores=X.map(row=>{
    const zs=useCorr?row.map((v,i)=>(v-mu[i])/sg[i]):row.map((v,i)=>v-mu[i]);
    return eigVecs.map(vec=>vec.reduce((s,c,i)=>s+c*zs[i],0));
  });
  const pfx=isFA?'F':'PC';
  const cols=Array.from({length:tblClm},(_,i)=>`${pfx}${i+1}`);
  const lines=[['CaseID',...cols].join(','),
    ...caseNames.map((nm,k)=>[nm,...cols.map((_,i)=>scores[k][i].toFixed(4))].join(','))
  ];
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=isFA?'fa_scores.csv':'pca_scores.csv'; a.click();
}

function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add('active');
  document.getElementById(`panel-${id}`).classList.add('active');
}






function onLangChange(){
  renderParseInfo();
  const ta=document.getElementById('csv-input');
  if(!HAS_RESULT && ta.value){   // an untouched example follows the language (not after an analysis, so inputs and results stay consistent)
    for(const l of ['ja','en']){
      if(l!==LANG && ta.value===EX[l]){
        const sel=getSelIdx(), hadChecks=document.querySelectorAll('#var-checks input').length>0;
        ta.value=EX[LANG]; parseCSV();
        if(hadChecks) document.querySelectorAll('#var-checks input').forEach(c=>c.checked=sel.includes(+c.value));
        break;
      }
    }
  }
  if(ERR_I && document.getElementById('err-msg').style.display==='block')
    document.getElementById('err-msg').textContent=t.apply(null,ERR_I);
  if(HAS_RESULT && ST) renderResult(false);
  const rs=document.getElementById('rs-text');
  if(rs && rs.value && rsFailed(rs.value)) rsMake();
}

// ───────── R script export (check script) ─────────
function rsRaw(text){
  let d='---';
  while(text.indexOf(')'+d+'"')>=0) d+='-';
  return 'r"'+d+'(\n'+text.replace(/\r\n?/g,'\n').replace(/\s+$/,'')+'\n)'+d+'"';
}
const RS_FAIL={ja:'# スクリプトを作成できませんでした',en:'# Could not create the script'};
function rsHeader(title, pkgLines){
  const L=(LANG==='ja')?[
    '# =====================================================================',
    '# '+title,
    '# このスクリプトは、アプリに入力したデータと設定をそのまま埋め込んであります。',
    '# RStudioに貼り付けて、上から順に実行してください。',
    '# 日本語が文字化けするときは、RStudioの File > Reopen with Encoding > UTF-8 で開き直してください。',
    '# ====================================================================='
  ]:[
    '# =====================================================================',
    '# '+title,
    '# This script embeds the data and settings you entered in the app.',
    '# Paste it into RStudio and run it from top to bottom.',
    '# ====================================================================='
  ];
  if(pkgLines&&pkgLines.length){ L.push('',(LANG==='ja'?'# 初回だけ、必要なパッケージをインストールしてください（先頭の # を外して実行）':'# Install the required package once (remove the leading # and run)')); pkgLines.forEach(p=>L.push(p)); }
  return L;
}
function rsMake(){
  const ta=document.getElementById('rs-text');
  try{ ta.value=buildRScript(); }
  catch(e){ ta.value=RS_FAIL[LANG]+': '+e.message; }
}
function rsFailed(v){ return v.indexOf(RS_FAIL.ja)===0||v.indexOf(RS_FAIL.en)===0; }
function rsCopy(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(()=>{}); }
  const b=document.getElementById('rs-copy-btn');
  b.textContent=t('copied'); setTimeout(()=>{b.textContent=t('rsCopy');},1500);
}
function rsDownload(){
  const ta=document.getElementById('rs-text');
  rsMake();
  if(rsFailed(ta.value)) return;
  const b64=btoa(unescape(encodeURIComponent('﻿'+ta.value)));
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8;base64,'+b64;
  a.download=RS_FILENAME;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
const RS_FILENAME='pca_fa_check.R';
function buildRScript(){
  const ja=(LANG==='ja');
  if(!parsedData) throw new Error(t('errLoad'));
  const sel=getSelIdx();
  if(sel.length<3) throw new Error(t('errVar3'));
  const useCorr=document.getElementById('mat-type').value==='corr';
  const analType=document.getElementById('anal-type').value;
  const isFA=(analType==='fa'||analType==='pm'), isPM=analType==='pm';
  const egNum=+document.getElementById('eg-num').value;
  const faMethod=document.getElementById('factor-num-method')?.value||'auto';
  const faManual=+(document.getElementById('factor-num-manual')?.value||3);
  // 採用する成分・因子数（アプリの runAnalysis と同じ規則）
  const st=computeStats(rawMatrix,sel,useCorr);
  const ev=eigen(st.S).values; const m=sel.length;
  const contrib=ev.map(v=>v/ev.reduce((a,b)=>a+b,0));
  let nf=1;
  if(isFA && faMethod==='manual'){ nf=Math.min(Math.max(1,faManual),m-1); }
  else{
    for(let i=m-1;i>=0;i--) if(ev[i]>=1){nf=i+1;break;}
    if(!isFA){ let c=0; for(let i=0;i<m;i++){c+=contrib[i];if(c>=0.9){nf=Math.max(nf,i+1);break;}} }
  }
  nf=Math.max(nf,egNum);
  const csv=['id,'+varNames.map((_,i)=>'v'+(i+1)).join(',')]
    .concat(rawMatrix.map((r,i)=>caseNames[i]+','+r.join(','))).join('\n');
  const L=rsHeader(ja?((isFA?'因子分析（主成分法ベース）':'主成分分析')+': アプリ(pca.html)と同じ計算をRで行う（標準関数 eigen / varimax / promax）')
                     :((isFA?'Factor analysis (principal component method)':'Principal component analysis')+': the same calculation as the app (pca.html), in R (standard functions eigen / varimax / promax)'));
  L.push('',
    (ja?'# 変数の対応: ':'# Variable mapping: ')+varNames.map((v,i)=>'v'+(i+1)+'='+v.trim()).join(', '),
    '',
    ja?'# 1. データ（1列目はケース名）':'# 1. Data (column 1 = case names)',
    'dat <- read.csv(text = '+rsRaw(csv)+', header = TRUE, row.names = 1)',
    'vars <- c('+sel.map(i=>i+1).join(', ')+ (ja?')   # アプリで選んだ変数（列番号）':')   # variables selected in the app (column numbers)'),
    'X <- as.matrix(dat[, vars, drop = FALSE])',
    'm <- ncol(X)',
    '',
    ja?('# 2. '+(useCorr?'相関係数行列':'分散共分散行列')+'の固有値分解')
       :('# 2. Eigendecomposition of the '+(useCorr?'correlation matrix':'covariance matrix')),
    'S <- '+(useCorr?'cor(X)':'cov(X)'),
    'e <- eigen(S)',
    ja?'# 固有ベクトルの向き: アプリと同じく、各成分の係数の合計が正になる向きにそろえる'
       :'# Eigenvector direction: as in the app, flip each component so that the sum of its coefficients is positive',
    'V <- sweep(e$vectors, 2, ifelse(colSums(e$vectors) < 0, -1, 1), "*")',
    'eig <- e$values',
    '',
    ja?'# 3. 固有値と寄与率（アプリの「固有値・寄与率」に対応）'
       :'# 3. Eigenvalues and proportion of variance (corresponds to "Eigenvalues and proportion of variance" in the app)',
    'print(data.frame(component = 1:m, eigenvalue = eig, contribution = eig / sum(eig),',
    '                 cumulative = cumsum(eig) / sum(eig)))',
    '',
    ja?('# 4. 採用する'+(isFA?'因子':'成分')+'数（アプリの採用数 = '+nf+'）')
       :('# 4. Number of '+(isFA?'factors':'components')+' retained (the app uses '+nf+')'),
    'nf <- '+nf,
    '',
    ja?'# 5. 負荷量 = 固有ベクトル x sqrt(固有値)':'# 5. Loadings = eigenvectors x sqrt(eigenvalues)',
    'L <- V[, 1:nf, drop = FALSE] %*% diag(sqrt(eig[1:nf]), nf)',
    'rownames(L) <- colnames(X)',
    'cat("'+(ja?(isFA?'因子負荷量（回転前）':'主成分負荷量'):(isFA?'Factor loadings (before rotation)':'Principal component loadings'))+'\\n"); print(round(L, 4))',
    'cat("'+(ja?'共通性':'Communality')+'\\n"); print(round(rowSums(L^2), 4))');
  if(isFA){
    L.push('',
      ja?'# 6. バリマックス回転（Rの stats::varimax。Kaiser正規化あり、アプリと同じ）'
         :'# 6. Varimax rotation (stats::varimax in R, with Kaiser normalization, as in the app)',
      'vm <- varimax(L)',
      'cat("'+(ja?'バリマックス回転後の因子負荷量':'Factor loadings after varimax rotation')+'\\n"); print(round(unclass(vm$loadings), 4))');
    if(isPM) L.push('',
      ja?'# 7. プロマックス回転（Rの stats::promax。べき乗 m = 4）':'# 7. Promax rotation (stats::promax in R; power m = 4)',
      'pm <- promax(L, m = 4)',
      ja?'pattern <- unclass(pm$loadings)                 # パターン行列':'pattern <- unclass(pm$loadings)                 # pattern matrix',
      ja?'Phi <- solve(crossprod(pm$rotmat))              # 因子間相関':'Phi <- solve(crossprod(pm$rotmat))              # factor correlation',
      ja?'structure <- pattern %*% Phi                    # 構造行列':'structure <- pattern %*% Phi                    # structure matrix',
      'cat("'+(ja?'パターン行列':'Pattern matrix')+'\\n"); print(round(pattern, 4))',
      'cat("'+(ja?'因子間相関':'Factor correlation')+'\\n"); print(round(Phi, 4))',
      'cat("'+(ja?'構造行列':'Structure matrix')+'\\n"); print(round(structure, 4))');
  }
  L.push('',
    ja?('# '+(isFA?'8':'6')+'. 主成分得点（アプリのスコアに対応）'):('# '+(isFA?'8':'6')+'. Component scores (correspond to the scores in the app)'),
    'Z <- '+(useCorr?'scale(X)':'scale(X, scale = FALSE)'),
    'scores <- Z %*% V[, 1:nf, drop = FALSE]',
    'print(head(round(scores, 4)))',
    '',
    ja?'# 参考: prcomp でも同じ固有値（標準偏差の2乗）が得られます':'# For reference: prcomp gives the same eigenvalues (squared standard deviations)',
    'print(round(prcomp(X, scale. = '+(useCorr?'TRUE':'FALSE')+')$sdev^2, 4))',
    '',
    ja?'# スクリープロット':'# Scree plot',
    'plot(eig, type = "b", xlab = "component", ylab = "eigenvalue"); abline(h = 1, lty = 2)');
  return L.join('\n')+'\n';
}
